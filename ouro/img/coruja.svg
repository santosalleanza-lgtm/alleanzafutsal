<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290" role="img" aria-label="Coruja dourada, mascote da Ouro Concursos">
  <defs>
    <linearGradient id="cj-ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF0CF"/>
      <stop offset=".45" stop-color="#E2BE62"/>
      <stop offset="1" stop-color="#9A7426"/>
    </linearGradient>
    <linearGradient id="cj-corpo" x1="0" y1="0" x2="0" y2="1">
