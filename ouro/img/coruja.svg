    <path d="M80 90 C70 76 62 60 60 40 C70 50 78 54 86 58 C88 50 90 46 94 40 C98 54 102 66 106 78 Z" fill="url(#cj-ouro)" stroke-width="2"/>
    <path d="M160 90 C170 76 178 60 180 40 C170 50 162 54 154 58 C152 50 150 46 146 40 C142 54 138 66 134 78 Z" fill="url(#cj-ouro)" stroke-width="2"/>
