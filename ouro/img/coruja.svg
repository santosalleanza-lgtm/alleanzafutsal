    <radialGradient id="cj-olho" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFF6D8"/>
      <stop offset=".55" stop-color="#E9C76C"/>
      <stop offset="1" stop-color="#A57B27"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="url(#cj-ouro)" stroke-linecap="round" stroke-linejoin="round">
