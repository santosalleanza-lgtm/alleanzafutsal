  <!-- olhos -->
  <circle cx="92" cy="130" r="17" fill="url(#cj-olho)"/>
  <circle cx="148" cy="130" r="17" fill="url(#cj-olho)"/>
  <circle cx="94" cy="132" r="7.5" fill="#070605"/>
