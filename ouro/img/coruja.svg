    <path d="M190 150 C206 182 198 222 160 242" stroke-width="3"/>
    <path d="M58 176 C54 196 62 214 78 226" stroke-width="2" opacity=".55"/>
    <path d="M182 176 C186 196 178 214 162 226" stroke-width="2" opacity=".55"/>
