:root{
 --bg:#0b0b0c;--s1:#151517;--s2:#1d1d21;--s3:#26262b;--line:#2e2e34;
 --tx:#f3eee2;--tx2:#b8b1a0;--tx3:#8a8475;
 --gold:#e6c34a;--gold2:#c9a227;--goldbg:rgba(230,195,74,.12);
 --ok:#4cbf7a;--okbg:rgba(76,191,122,.14);--bad:#e26a6a;--badbg:rgba(226,106,106,.14);
 --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
h1,h2,h3{margin:0;line-height:1.15}
.pf{font-family:"PF",Georgia,serif;font-weight:900;letter-spacing:-.01em}
.pf,.stat b,.sim .n,.score .big,.calc .tot,.rv .hd b,.qhead .num,.brand .b2{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.top .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{color:var(--tx3);font-size:12px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);flex:none}
.ib svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand .b1{font-size:9px;letter-spacing:.3em;color:#d9cfb2;font-weight:700}
.brand .b2{font-family:"PF",Georgia,serif;font-weight:900;font-size:20px;color:var(--gold);line-height:.95}
.hero{margin:18px 0 8px;padding:22px 20px;border-radius:22px;background:radial-gradient(120% 120% at 100% 0%,rgba(201,162,39,.28),transparent 55%),var(--s1);border:1px solid rgba(201,162,39,.28)}
.hero .k{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:800}
.hero h1{font-size:30px;margin:6px 0 6px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--tx2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(0,0,0,.35);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:"PF",Georgia,serif;font-size:22px;color:var(--gold)}
.stat span{font-size:11px;color:var(--tx3);line-height:1.2;display:block}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:18px}
.sec span{font-size:12px;color:var(--tx3)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:84px}
.qa b{display:block;font-size:15px;margin-bottom:2px}
.qa span{font-size:12px;color:var(--tx3)}
.qa i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--goldbg);color:var(--gold);margin-bottom:8px;font-weight:800}
.list{display:grid;gap:10px}
.sim{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.sim .n{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:"PF",Georgia,serif;font-size:20px;background:var(--s3);color:var(--gold)}
.sim .m{flex:1;min-width:0}
.sim .m b{display:block;font-size:15px}
.sim .m span{font-size:12px;color:var(--tx3)}
.sim .r{flex:none;text-align:right;font-size:12px;color:var(--tx3)}
.sim .r b{display:block;font-size:17px;color:var(--tx)}
.sim.done .n{background:var(--gold);color:#111}
.btn svg{width:22px;height:22px}
.frm{display:grid;gap:10px;margin-top:12px}
.frm input{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:0 14px;font:inherit;font-size:16px}
.frm input:focus{outline:2px solid var(--gold);outline-offset:1px}
.sim.lk{opacity:.62}.sim.lk .n{background:var(--s2);color:var(--tx3);font-size:18px}
.sim.prog .n{box-shadow:inset 0 0 0 2px var(--gold)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--s3);color:var(--tx2)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.g{background:var(--goldbg);color:var(--gold)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;font-weight:800;font-size:16px;background:linear-gradient(135deg,#f3d873,#c9a227);color:#111}
.btn.sec2{background:var(--s2);color:var(--tx);font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:700}
.btn:disabled{opacity:.45}
.mode{display:grid;gap:10px;margin:16px 0}
.mo{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r);background:var(--s1);border:2px solid var(--line);width:100%}
.mo.on{border-color:var(--gold);background:var(--goldbg)}
.mo .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--tx3);margin-top:2px}
.mo.on .dot{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 45%,transparent 50%)}
.mo b{display:block}
.mo span{font-size:13px;color:var(--tx2)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.info div{background:var(--s2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--tx3)}
.info b{display:block;color:var(--tx);font-size:15px}
.note{font-size:13px;color:var(--tx2);background:var(--s2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;margin:12px 0}
/* quiz */
.qbar{height:4px;background:var(--s3)}
.qbar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--s2);color:var(--gold)}
.timer.low{color:var(--bad)}
.qhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;gap:8px}
.qhead .num{font-family:"PF",Georgia,serif;font-size:26px;color:var(--gold)}
.qhead .num small{font-family:inherit;font-size:14px;color:var(--tx3);font-weight:400}
.flag{padding:8px 12px;border-radius:10px;background:var(--s2);font-size:13px;font-weight:700;color:var(--tx2)}
.flag.on{background:var(--goldbg);color:var(--gold)}
.txt{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.txt summary{list-style:none;padding:12px 14px;font-weight:700;font-size:14px;color:var(--gold);display:flex;justify-content:space-between}
.txt summary::-webkit-details-marker{display:none}
.txt .body{padding:0 16px 14px;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.65;color:#e9e3d3}
.txt .body p{margin:0 0 10px;text-indent:1.2em}
.txt .body small{display:block;color:var(--tx3);font-family:inherit;font-size:12px;text-indent:0}
.enun{font-size:17px;line-height:1.55;margin:0 0 14px;white-space:pre-line}
.af{margin:-4px 0 14px;display:grid;gap:8px}
.af div{background:var(--s1);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45}
.af b{color:var(--gold);margin-right:6px}
.opts{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;background:var(--s1);border:2px solid var(--line);font-size:15.5px;line-height:1.45;min-height:56px}
.op .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s3);font-weight:800;font-size:14px;color:var(--tx2)}
.op.sel{border-color:var(--gold);background:var(--goldbg)}
.op.sel .l{background:var(--gold);color:#111}
.op.right{border-color:var(--ok);background:var(--okbg)}
.op.right .l{background:var(--ok);color:#06210f}
.op.wrong{border-color:var(--bad);background:var(--badbg)}
.op.wrong .l{background:var(--bad);color:#2a0808}
.op.cut{opacity:.38;text-decoration:line-through}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;background:var(--s2);border-left:4px solid var(--gold);font-size:15px;line-height:1.55}
.exp .h{font-weight:800;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.exp .h.ok{color:var(--ok)}.exp .h.bad{color:var(--bad)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,12,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b))}

.gridbtn{width:50px;height:50px;border-radius:14px;background:var(--s2);display:grid;place-items:center}

.sheet h3{font-size:16px;margin-bottom:4px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx3);margin:6px 0 12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.dots button{aspect-ratio:1;border-radius:10px;background:var(--s3);font-weight:700;font-size:13px;color:var(--tx2);position:relative}
.dots button.a{background:var(--gold);color:#111}
.dots button.ok{background:var(--ok);color:#06210f}
.dots button.bad{background:var(--bad);color:#2a0808}
.dots button.cur{outline:2px solid #fff;outline-offset:2px}
.dots button.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#ff9f1c}
.dsep{grid-column:1/-1;font-size:11px;letter-spacing:.12em;color:var(--tx3);font-weight:700;margin-top:6px}
/* result */
.score{text-align:center;padding:26px 18px;border-radius:22px;background:radial-gradient(120% 100% at 50% 0%,rgba(201,162,39,.25),transparent 60%),var(--s1);border:1px solid rgba(201,162,39,.3);margin-top:18px}
.score .big{font-family:"PF",Georgia,serif;font-size:64px;line-height:1;color:var(--gold)}
.score .big small{font-size:24px;color:var(--tx3)}
.score .st{margin:10px 0 4px;font-weight:800;font-size:18px}
.score .st.ok{color:var(--ok)}.score .st.bad{color:var(--bad)}
.score p{margin:4px 0 0;color:var(--tx2);font-size:14px}
.bars{display:grid;gap:14px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .t span{color:var(--tx3)}

.calc .row{display:flex;justify-content:space-between;font-size:14px;color:var(--tx2)}
.calc .tot{font-family:"PF",Georgia,serif;font-size:36px;color:var(--gold);text-align:center}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0;padding-bottom:4px;scrollbar-width:none}

.empty{text-align:center;color:var(--tx3);padding:40px 10px}
.foot{margin:36px 0 10px;font-size:11px;color:var(--tx3);line-height:1.45;text-align:center}

.ig .tx{flex:1;min-width:0}.ig .tx b{display:block;font-size:15px}.ig .tx span{font-size:13px;color:var(--tx2)}
.ig a.go{flex:0 0 auto;background:var(--gold);color:#111;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;text-decoration:none}
.ig .x{position:absolute;top:4px;right:6px;width:28px;height:28px;color:var(--tx3);font-size:18px;line-height:1}
.ig.dis{padding-right:34px}
.buy{display:flex;gap:14px;align-items:center;margin-top:16px;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid rgba(230,195,74,.45);text-decoration:none;color:inherit}
.buy .bk{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--goldbg);font-size:22px}
.buy .tx{flex:1;min-width:0}.buy .tx b{display:block;font-size:15px}.buy .tx span{display:block;font-size:13px;color:var(--tx2);line-height:1.4}
.buy .cta{flex:0 0 auto;background:linear-gradient(135deg,#f3d873,#c9a227);color:#111;font-weight:700;font-size:13px;padding:9px 12px;border-radius:999px}
.pc{display:grid;gap:10px}
.pt{display:flex;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit}
.pt .lg{flex:0 0 48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#111}
.pt .tx{flex:1;min-width:0}.pt .tx b{display:block;font-size:15px}.pt .tx span{display:block;font-size:13px;color:var(--tx2);line-height:1.4}
.pt .tx small{display:block;font-size:12px;color:var(--gold);margin-top:3px}
.pt .lg svg{width:32px;height:32px}
.pt .lg{overflow:hidden}.pt .lg img{width:100%;height:100%;object-fit:cover;display:block}
.pt .ar{color:var(--tx3);font-size:20px}
.pt.ad{border-style:dashed;border-color:rgba(230,195,74,.45);background:transparent}
.dev{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px auto 0;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--s1);color:var(--tx);text-decoration:none;font-size:14px;font-weight:600;width:max-content;max-width:100%}
.dev svg{width:18px;height:18px;color:#4cbf7a}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#f3eee2;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:12px;border-radius:12px;background:var(--s2);font-weight:800}
.seg button.on{background:var(--gold);color:#111}
.hint{font-size:12px;color:var(--tx3);text-align:center;margin-top:10px}
@media (min-width:700px){.dots{grid-template-columns:repeat(10,1fr)}}

/* barra de navegação acima do selo "Powered by Netlify" (canto inferior direito, plano grátis) */

ito, ou em periodicidade programada.","o":["somente uma vez por mês.","apenas após a alta do paciente.","diariamente, em todas as unidades.","apenas em áreas externas."],"c":2},{"id":"h01q22","d":"E","t":"Limpeza hospitalar","e":"A limpeza terminal é realizada","x":"A limpeza terminal é mais completa e abrange paredes, teto, piso, mobiliário e equipamentos.","o":["somente em corredores.","apenas quando há reclamação.","a cada hora, em todas as áreas.","após alta, transferência ou óbito do paciente e de forma programada."],"c":3},{"id":"h01q23","d":"E","t":"Áreas hospitalares","e":"Os centros cirúrgicos e as unidades de terapia intensiva são classificados como áreas","x":"Áreas críticas oferecem maior risco de infecção, como CC, UTI, isolamento e central de esterilização.","o":["administrativas.","externas.","críticas.","não críticas."],"c":2},{"id":"h01q24","d":"E","t":"Áreas hospitalares","e":"Os refeitórios e a recepção são exemplos de áreas","x":"Áreas não críticas são as que não oferecem risco especial de transmissão de infecção.","o":["de esterilização.","não críticas.","críticas.","semicríticas de isolamento."],"c":1},{"id":"h01q25","d":"E","t":"Técnica de limpeza","e":"Na limpeza de superfícies, a ordem correta é limpar","x":"Limpa-se de cima para baixo e do mais limpo para o mais sujo, evitando recontaminar.","o":["do mais sujo para o mais limpo e de baixo para cima.","aleatoriamente.","apenas o chão.","do mais limpo para o mais sujo e de cima para baixo."],"c":3},{"id":"h01q26","d":"E","t":"Técnica de limpeza","e":"No piso, o movimento correto do rodo ou mop durante a limpeza úmida é","x":"O movimento em 'S', de dentro para fora, evita voltar sobre área já limpa.","o":["de trás para frente, voltando sobre a área limpa.","em círculos, repetindo no mesmo local.","em 'S', sem retroceder.","aleatório."],"c":2},{"id":"h01q27","d":"E","t":"Técnica de limpeza","e":"A técnica dos dois baldes consiste em","x":"O balde de enxágue evita levar a sujidade de volta para ocortantes. Grupo A: biológicos. Grupo B: químicos. Grupo D: comuns.","o":["D.","B.","E.","A."],"c":2},{"id":"h01q34","d":"E","t":"Resíduos","e":"Os resíduos comuns, semelhantes aos domiciliares, pertencem ao grupo","x":"O Grupo D reúne resíduos sem risco biológico, químico ou radiológico.","o":["D.","A.","E.","B."],"c":0},{"id":"h01q35","d":"E","t":"Resíduos","e":"O saco branco leitoso, identificado com o símbolo de substância infectante, é utilizado para","x":"O saco branco leitoso com símbolo de risco biológico é usado para os resíduos do grupo A.","o":["resíduos comuns.","vidros.","recicláveis em geral.","resíduos infectantes (grupo A)."],"c":3},{"id":"h01q36","d":"E","t":"NR 32","e":"A NR 32 trata da segurança e saúde no trabalho em","x":"A NR 32 estabelece medidas de proteção à segurança e à saúde dos trabalhadores de serviços de saúde.","o":["construção civil.","atividades rurais.","mineração.","serviços de saúde."],"c":3},{"id":"h01q37","d":"E","t":"NR 32","e":"É proibido, segundo a NR 32, nos locais de trabalho com risco biológico,","x":"A NR 32 veda adornos (anéis, pulseiras) e a guarda/consumo de alimentos no local de trabalho.","o":["a lavagem das mãos.","o uso de calçado fechado.","o uso de jaleco.","o uso de adornos e o consumo de alimentos."],"c":3},{"id":"h01q38","d":"E","t":"Higiene das mãos","e":"São momentos de higienização das mãos, segundo a OMS, antes e depois","x":"Os 5 momentos incluem antes e após o contato com o paciente e após o contato com superfícies próximas.","o":["de abrir uma janela.","do contato com o paciente.","de tomar café.","de conversar com colegas."],"c":1},{"id":"h01q39","d":"E","t":"Infecções","e":"A sigla IRAS significa","x":"IRAS são infecções adquiridas durante a assistência à saúde.","o":["Instruções de Rotina para Áreas Sujas.","Índice de Resíduos e Áreas Seguras.","Infecções Relacionadas à Assistência à Saúde.","Infecções Rápidas de Alto Sofrimento."],"c":2},{"id":"h01q40","d":"E","t":"Limpeza hospitalar","e":"Qual é o principal objetivo da limpeza hospitalar?","x":"Limpar e desinfetar reduz o risco de infecção relacionada à assistência.","o":["Apenas deixar o ambiente perfumado.","Reduzir a carga de microrganismos e prevenir infecções.","Evitar o trabalho da enfermagem.","Economizar produtos."],"c":1}],"texto":{"titulo":"A higiene das mãos salva vidas","corpo":"A higiene das mãos é considerada a medida mais simples e eficaz para reduzir infecções em hospitais. Em ambientes de saúde, as mãos dos profissionais são o principal meio de transmissão de microrganismos entre pacientes e superfícies.\n\nMesmo assim, estudos mostram que muitos profissionais não lavam as mãos nos momentos recomendados. O motivo mais comum é a falta de tempo, mas também pesam o esquecimento e a falta de estrutura, como pias distantes ou dispensadores vazios.\n\nPor isso, as instituições investem em campanhas educativas e em álcool em gel nos pontos de cuidado. Quando a higiene das mãos vira hábito coletivo, o risco de infecção diminui para todos: pacientes, acompanhantes e equipe."},"tema":"Limpeza, EPIs e resíduos"},{"n":2,"q":[],"tema":"Precauções e NR 32","lock":1},{"n":3,"q":[],"tema":"Desinfecção e rotinas","lock":1}]}</script>

function evaluate(qs,ans){

 qs.forEach((q,i)=>{const a=ans[i];by[q.d][1]++;tp[q.t]=tp[q.t]||[0,0];tp[q.t][1]++;
  if(a==null)blank++;else if(a===q.c){ok++;by[q.d][0]++;tp[q.t][0]++}});
 const full=qs.length===40;
 const nota=ok*0.25;
 let pass=null,why=[];
 if(full){pass=ok>=24;if(!pass)why.push(`${ok} acertos: a meta de treino é 24 (60%)`)}
 return{ok,blank,total:qs.length,nota,by,tp,pass,why}
}

 const a=ST.att[key];if(!a)return go('#');

 i=Math.max(0,Math.min(a.qs.length-1,i|0));a.cur=i;save();
 const q=QBYID[a.qs[i]],tot=a.qs.length,ans=a.ans[i],study=a.mode==='estudo',revealed=study&&ans!=null;
 const title=a.sim?`Simulado ${a.sim}`:(key==='erradas'?'Minhas erradas':'Treino');

 let h=topbar(title,`${DISC[q.d]} · ${q.t}`,`<button class="ib" onclick="APP.go('${a.sim?'#sim/'+a.sim:'#'}')">${IC.back}</button>`,tm);

 h+=`<div class="qhead"><div class="num pf">${String(i+1).padStart(2,'0')}<small> / ${tot}</small></div><button class="flag ${a.fl[i]?'on':''}" onclick="APP.flag('${key}',${i})">${a.fl[i]?'★ Marcada':'☆ Revisar depois'}</button></div>`;
 if(q.tx){const sim=SIMS.find(s=>s.q.some(x=>x.id===q.id));const firstTx=a.qs.findIndex(id=>QBYID[id].tx&&SIMS.find(s=>s.q.some(x=>x.id===id))===sim);if(sim&&sim.texto)h+=`<details class="txt" ${i===firstTx?'open':''}><summary><span>Texto: ${esc(sim.texto.titulo)}</span><span>▾</span></summary><div class="body">${sim.texto.corpo.split('\n').map(p=>`<p>${fmt(p)}</p>`).join('')}<small>${esc(sim.texto.fonte||'Texto elaborado para este material.')}</small></div></details>`}
 h+=`<p class="enun">${fmt(q.e)}</p>`;
 if(q.af)h+=`<div class="af">${q.af.map((t,k)=>`<div><b>${['I','II','III','IV'][k]}</b>${fmt(t)}</div>`).join('')}</div>`;
 h+=`<div class="opts">${q.o.map((o,k)=>{let c='';if(revealed){if(k===q.c)c='right';else if(k===ans)c='wrong'}else if(ans===k)c='sel';

  return `<button class="op ${c}${cut}" onclick="APP.pick('${key}',${i},${k})" oncontextmenu="APP.cut(event,'${key}',${i},${k})"><span class="l">${L[k]}</span><span>${fmt(o)}</span></button>`}).join('')}</div>`;
 if(!revealed&&!study)h+=`<div class="hint">Dica: toque e segure uma alternativa para riscá-la.</div>`;
 if(revealed){const ok=ans===q.c;h+=`<div class="exp"><div class="h ${ok?'ok':'bad'}">${ok?'✓ Você acertou':'✗ Resposta correta: '+L[q.c]}</div>${fmt(q.x)}<div class="tp">${DISC[q.d]} · ${esc(q.t)}</div></div>`}
 h+=`</div>`;
 const last=i===tot-1;
 h+=`<div class="nav"><div class="in"><button class="btn sec2" ${i===0?'disabled':''} onclick="APP.go('#q/${key}/${i-1}')">‹ Anterior</button><button class="gridbtn" onclick="APP.sheet('${key}')">${IC.grid}</button>${last?`<button class="btn" onclick="APP.finish('${key}')">Entregar</button>`:`<button class="btn" onclick="APP.go('#q/${key}/${i+1}')">Próxima ›</button>`}</div></div>`;
 $('#app').innerHTML=h;window.scrollTo(0,0);
 stopTimer();
 if(a.mode==='prova'){timerInt=setInterval(()=>{a.left--;const t=$('#tm');if(t){t.textContent=clock(a.left);t.classList.toggle('low',a.left<900)}if(a.left%15===0)save();if(a.left<=0){stopTimer();save();toast('Tempo esgotado!');finish(key,true)}},1000)}
 // long-press para riscar
 document.querySelectorAll('.op').forEach((b,k)=>{let t=null;b.addEventListener('touchstart',()=>{t=setTimeout(()=>{t='done';cutOpt(key,i,k)},550)},{passive:true});b.addEventListener('touchend',e=>{if(t==='done'){e.preventDefault()}else clearTimeout(t);t=null});b.addEventListener('touchmove',()=>{clearTimeout(t);t=null},{passive:true})});
}

function finish(key,forced){
 const a=ST.att[key];if(!a)return;

 if(!forced&&blank&&!confirmBox(`Você deixou ${blank} ${blank>1?'questões':'questão'} em branco. Entregar mesmo assim?`))return;

function focoResultado(r,txtAprovado){
 const ds=Object.keys(r.by).filter(d=>r.by[d][1]);
 const pct=d=>r.by[d][0]/r.by[d][1];
 const elim=r.total===40?["P","I","R"].filter(d=>r.by[d]&&r.by[d][1]&&r.by[d][0]<2&&r.why.some(w=>w.indexOf(DISC[d])>=0)):[];
 if(elim.length){const d=elim[0];return['Você foi eliminado em '+DISC[d],'Foi a matéria que derrubou o simulado ('+r.by[d][0]+'/'+r.by[d][1]+'). A apostila traz '+DISC[d]+' do edital com teoria e questões comentadas para virar esse jogo.']}
 if(!ds.length)return['Consolide o conteúdo do edital',txtAprovado];
 const pior=ds.slice().sort((a,b)=>pct(a)-pct(b))[0];
 if(r.pass===true)return[r.why.length||!['P','I','R'].every(d=>r.by[d])?'Meta atingida. Agora é manter o ritmo':'Você passaria. Agora é manter o ritmo',txtAprovado];
 const [o,t]=r.by[pior];
 return[(r.pass===false?'Seu ponto fraco: ':'Onde você mais errou: ')+DISC[pior]+' ('+o+'/'+t+')','Revise '+DISC[pior]+' na apostila, com teoria e questões comentadas, e refaça o simulado para medir a evolução.'];
}

 stopTimer();
 const ids=Object.keys(ST.wrong).filter(id=>QBYID[id]);
 let h=topbar('Minhas erradas',`${ids.length} questões`,`<button class="ib" onclick="APP.go('#')">${IC.back}</button>`);
 h+=`<div class="wrap">`;
 if(!ids.length)h+=`<div class="empty"><div class="pf" style="font-size:40px;color:var(--gold)">✓</div><p>Nenhuma questão errada salva.<br>As questões que você errar nos simulados e treinos aparecem aqui.</p></div>`;
 else{const by={};ids.forEach(id=>{const d=QBYID[id].d;by[d]=(by[d]||0)+1});
  h+=`<div class="card" style="margin-top:18px"><table class="tbl">${DORD.filter(d=>by[d]).map(d=>`<tr><td>${DISC[d]}</td><td>${by[d]}</td></tr>`).join('')}</table></div><div class="note">Ao acertar uma questão aqui, ela sai da lista.</div><button class="btn" onclick="APP.erstart()">Refazer ${Math.min(ids.length,40)} questões</button>`}
 h+=`</div>`;$('#app').innerHTML=h
}
function erStart(){const ids=shuffle(Object.keys(ST.wrong).filter(id=>QBYID[id])).slice(0,40);ST.att.erradas={sim:0,qs:ids,ans:Array(ids.length).fill(null),fl:{},mode:'estudo',left:0,cur:0,done:false,ts:Date.now()};save();go('#q/erradas/0')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- ROUTER ---------- */
function route(){
 closeSheet();
 const h=location.hash.slice(1).split('/');
 if(h[0]==='sim')return intro(+h[1]);
 if(h[0]==='q')return quiz(h[1],+h[2]);
 if(h[0]==='res')return result(h[1]);
 if(h[0]==='treino')return treino();
 if(h[0]==='erradas')return erradas();
 home()
}
/* ---------- liberação pelo WhatsApp ---------- */
function waUnlock(n){
 const num=CFG.wa.replace(/^55(\d{2})(\d{5})(\d{4})$/,'($1) $2-$3');
 return `<b>Quer liberar os simulados?</b><p style="color:var(--tx2);margin:6px 0 14px;font-size:14px">Entre em contato pelo WhatsApp <b>${num}</b> e receba o acesso aos ${LOCKED} simulados bloqueados.</p>
 <a class="btn" style="background:#25d366;text-decoration:none" href="${waLink(`Olá! Comprei o material de Higienização Hospitalar e quero liberar os simulados (cliquei no Simulado ${n}). Meu e-mail da compra é: `)}" target="_blank" rel="noopener">${WAI}Chamar no WhatsApp</a>`
}
function codeForm(n){
 const em=esc(lsGet('po_email')||'');
 return `<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><b>Já recebeu o código?</b>
 <form class="frm" onsubmit="APP.liberar(event,${n})"><input name="email" type="email" placeholder="E-mail informado na compra" required autocomplete="email" value="${em}"><input name="codigo" placeholder="Código (6 caracteres)" required maxlength="6" autocapitalize="characters" autocomplete="one-time-code" style="text-transform:uppercase;letter-spacing:.25em"><button class="btn sec2">Liberar simulados</button></form></div>`
}
function lockPop(n){
 closeSheet();
 const s=document.createElement('div');s.className='sheet';s.onclick=e=>{if(e.target===s)s.remove()};
 s.innerHTML=`<div class="pn"><h3>🔒 Simulado ${n} bloqueado</h3><p style="color:var(--tx2);font-size:14px;margin:0 0 14px">${FREE>1?`Os simulados 1 a ${FREE} são grátis.`:"O simulado 1 é grátis."}</p>${waUnlock(n)}${codeForm(n)}<button class="btn ghost" style="margin-top:10px" onclick="APP.closeSheet()">Agora não</button></div>`;
 document.body.appendChild(s)
}
async function onPedir(e){
 e.preventDefault();const f=e.target,b=f.querySelector('button');const d=Object.fromEntries(new FormData(f));
 d.email=d.email.trim().toLowerCase();b.disabled=true;b.textContent='Enviando...';
 try{await pedir(d);lsSet('po_email',d.email);const ce=document.querySelector('form input[name=codigo]');if(ce&&!ce.form.email.value)ce.form.email.value=d.email;const c=$('#pedido');if(c)c.innerHTML=`<b>Pedido enviado ✓</b><p style="color:var(--tx2);margin:6px 0 12px;font-size:14px">Para agilizar, avise no WhatsApp. Assim que a compra for confirmada, o código chega em <b>${esc(d.email)}</b>${d.whatsapp?' ou no seu WhatsApp':''}. Depois é só digitar no campo abaixo.</p><a class="btn" style="background:#25d366;text-decoration:none" href="${waLink(`Olá! Acabei de comprar sua apostila e quero fazer os simulados. Pode enviar o código?\nNome: ${d.nome}\nE-mail: ${d.email}`)}" target="_blank" rel="noopener">${WAI}Avisar no WhatsApp</a>`}
 catch(err){toast(err.message);b.disabled=false;b.textContent='Pedir liberação'}
}
async function onLiberar(e,n){
 e.preventDefault();const f=e.target,b=f.querySelector('button');const d=Object.fromEntries(new FormData(f));
 const email=d.email.trim().toLowerCase(),codigo=d.codigo.trim().toUpperCase();b.disabled=true;b.textContent='Verificando...';
 try{await liberar(email,codigo);lsSet('po_email',email);closeSheet();toast('Simulados liberados!');intro(n)}
 catch(err){toast(err.message);b.disabled=false;b.textContent='Liberar simulados'}
}
window.APP={pedir:onPedir,liberar:onLiberar,lock:lockPop,igok:()=>lsSet("po_ig_hide","1"),igx:()=>{lsSet("po_ig_hide","1");const e=document.getElementById("igc");if(e)e.remove()},go,start:startSim,restart,mode:(m,n)=>{chosenMode=m;intro(n)},pick,flag,sheet,closeSheet,finish,rv:setRv,calc,
 cut:(e,k,i,x)=>{e.preventDefault();cutOpt(k,i,x)},
 trd:d=>{trD=trD.includes(d)?trD.filter(x=>x!==d):trD.concat(d);if(!trD.length)trD=[d];trT=null;treino()},trt:t=>{trT=t||null;treino()},trn:n=>{trN=n;treino()},trstart:trStart,erstart:erStart};
route();
})();
</script>
