# Site Ouro Concursos: catálogo (/) + simulados grátis (/simulados/). Sem funções nem variáveis de ambiente.
# No Netlify: Base directory = ouro.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
