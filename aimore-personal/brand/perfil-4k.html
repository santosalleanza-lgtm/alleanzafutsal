<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Sora:wght@300;400;600&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:768px;height:960px;background:#0A0907;font-family:Sora,sans-serif;color:#F6F2EA;overflow:hidden}
.card{position:relative;width:768px;height:960px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 30%,rgba(212,175,97,.28),transparent 55%),radial-gradient(ellipse at 100% 100%,rgba(168,130,60,.18),transparent 50%),#0A0907}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(212,175,97,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(212,175,97,.06) 1px,transparent 1px);background-size:48px 48px;
 -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 75%)}
.frame{position:absolute;inset:18px;border:1px solid rgba(212,175,97,.45);border-radius:28px}
.frame2{position:absolute;inset:28px;border:1px solid rgba(212,175,97,.18);border-radius:22px}
.streak{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(242,221,166,.7),transparent)}
.mark{position:absolute;left:50%;top:100px;transform:translateX(-50%);width:300px;filter:drop-shadow(0 20px 60px rgba(212,175,97,.45))}
.text{position:absolute;left:0;right:0;top:438px;text-align:center}
.brand{font-weight:300;letter-spacing:.5em;font-size:15px;color:#D4AF61;text-transform:uppercase}
h1{font-family:'Barlow Condensed';font-weight:900;font-size:108px;line-height:.88;text-transform:uppercase;margin-top:18px}
h1 span{display:block;background:linear-gradient(135deg,#F2DDA6 0%,#D4AF61 40%,#A8823C 70%,#E8CB8C 100%);-webkit-background-clip:text;color:transparent}
.role{margin-top:18px;font-size:16px;color:#C2BAAC}
.line{width:90px;height:2px;margin:26px auto;background:#D4AF61}
.pos{font-size:14px;color:#C2BAAC;line-height:1.9}
.motto{position:absolute;left:0;right:0;bottom:74px;text-align:center;font-family:'Barlow Condensed';font-weight:800;letter-spacing:.32em;font-size:18px;color:#D4AF61;text-transform:uppercase}
.handle{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:12px;color:#8E8678;letter-spacing:.1em}
</style></head><body><div class="card">
<div class="grid"></div><div class="frame"></div><div class="frame2"></div>
<div class="streak" style="width:900px;left:-80px;top:96px;transform:rotate(-12deg)"></div>
<div class="streak" style="width:420px;right:-140px;bottom:120px;transform:rotate(-38deg)"></div>
<svg class="mark" viewBox="0 0 100 92"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2DDA6"/><stop offset=".45" stop-color="#D4AF61"/><stop offset=".75" stop-color="#8F6A2C"/><stop offset="1" stop-color="#E8CB8C"/></linearGradient></defs>
<path fill-rule="evenodd" fill="url(#g)" d="M50 2 98 90H2L50 2Zm0 22L19 80h62L50 24Z"/><path fill="url(#g)" d="M50 42 64 68H36L50 42Z"/><path fill="url(#g)" d="M24 80 33 70h38l-4 10H24Z" opacity=".9"/></svg>
<div class="text">
<p class="brand">Aimoré Performance</p>
<h1>Aimoré <span>Weren</span></h1>
<p class="role">Profissional de Educação Física · CREF 041955</p>
<div class="line"></div>
<p class="pos">Pós-graduação em Treinamento Desportivo<br>Pós-graduação em Fisiologia do Exercício<br>Pós-graduação em Musculação e Condicionamento Físico</p>
</div>
<p class="motto">Disciplina • Evolução • Resultado</p>
<p class="handle">@aimorepersonal</p>
</div></body></html>
