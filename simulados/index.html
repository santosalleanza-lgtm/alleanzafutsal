<script id="data" type="application/json">{"sims":[{"n":1,"q":[{"id":"s01q01","d":"P","t":"Interpretação de texto","e":"De acordo com o texto, é correto afirmar que","x":"O 2º parágrafo afirma que proteger dados 'não é tarefa exclusiva do setor de tecnologia: começa no balcão, com quem faz o cadastro'. As demais contrariam o texto: os sistemas, bem utilizados, tornam o atendimento mais rápido; a confiança 'leva anos para ser construída'; e o paciente entrega 'muito mais do que um documento'.","tx":1,"o":["o paciente entrega à recepção apenas o documento de identidade.","a confiança perdida por um descuido é recuperada com facilidade.","a proteção de dados também é responsabilidade de quem realiza o atendimento inicial.","a proteção de dados cabe exclusivamente ao setor de tecnologia.","os sistemas informatizados tornam o atendimento mais lento e inseguro."],"c":2},{"id":"s01q02","d":"P","t":"Coesão e referência","e":"No 3º parágrafo, o pronome *Ela* retoma","x":"*Ela* é anafórico e retoma o sujeito da frase anterior, 'A confiança', que 'leva anos para ser construída'. A expressão 'dessa corrente' é complemento de 'elo', e os demais termos pertencem ao 2º parágrafo, sem relação com o verbo 'leva anos'.","tx":1,"o":["a confiança.","uma senha compartilhada.","a intimidade.","a instituição.","essa corrente."],"c":0},{"id":"s01q03","d":"P","t":"Nexos e reescrita","e":"Assinale a substituição que **mantém** o sentido e a correção do texto.","x":"*Porém* e *contudo* são conjunções adversativas equivalentes. *Por isso* indica conclusão e *Embora*, concessão; *afinal* tem valor conclusivo, e *no entanto*, adversativo; *somente* restringe o que *também* acrescenta; e a troca da condição (*se*) pela causa (*porque*) altera o sentido.","tx":1,"o":["*também* (3º parágrafo) por *somente*.","*se bem utilizados* (1º parágrafo) por *porque são bem utilizados*.","*porém* (2º parágrafo) por *contudo*.","*Por isso* (2º parágrafo) por *Embora*.","*afinal* (3º parágrafo) por *no entanto*."],"c":2},{"id":"s01q04","d":"P","t":"Crase","e":"Assinale a alternativa em que o acento indicativo de crase está empregado **corretamente**.","x":"*Dirigir-se a* + *a recepção* = *à recepção* (teste: 'dirigiu-se ao balcão'). Não há crase antes de pronome pessoal (*ele*) nem de verbo (*digitar*). Na estrutura 'de… a…', sem artigo no primeiro termo, também não há crase. E 'para à' junta duas preposições, o que é incorreto.","o":["A consulta foi remarcada para à próxima semana.","O paciente dirigiu-se à recepção do ambulatório.","Os dados foram entregues à ele.","O atendimento ocorre de segunda à sexta.","Ela começou à digitar o cadastro."],"c":1},{"id":"s01q05","d":"P","t":"Concordância verbal","e":"Assinale a alternativa **correta** quanto à concordância verbal.","x":"*Fazer* indicando tempo decorrido é impessoal e fica no singular. *Haver* (existir) também é impessoal: 'Houve falhas', 'Deve haver'. *Existir* é pessoal: 'Existem muitos dados'. Com verbo transitivo direto + *se* (voz passiva), o verbo concorda com o sujeito: 'Agendam-se as consultas'.","o":["Faz dois meses que o sistema foi atualizado.","Devem haver novas regras de acesso.","Agenda-se as consultas pelo telefone.","Existe muitos dados desatualizados no sistema.","Houveram falhas no cadastro dos pacientes."],"c":0},{"id":"s01q06","d":"I","t":"Planilhas: fórmulas","e":"Em uma planilha, as células A1, A2 e A3 contêm 10, 20 e 30. Qual é o resultado da fórmula `=SOMA(A1:A3)/CONT.NÚM(A1:A3)*2`?","x":"SOMA(A1:A3) = 60 e CONT.NÚM(A1:A3) = 3. Divisão e multiplicação têm a mesma precedência e são calculadas da esquerda para a direita: 60 / 3 = 20; 20 × 2 = 40.","o":["10","20","30","40","90"],"c":3},{"id":"s01q07","d":"I","t":"Editor de textos","e":"No Microsoft Word instalado em português do Brasil, o atalho para **justificar** o parágrafo selecionado é","x":"No Word em português: Ctrl + J justifica, Ctrl + E centraliza, Ctrl + G alinha à direita, Ctrl + Q alinha à esquerda e Ctrl + N aplica negrito.","o":["Ctrl + J","Ctrl + Q","Ctrl + N","Ctrl + E","Ctrl + G"],"c":0},{"id":"s01q08","d":"I","t":"Nuvem e compartilhamento","e":"Um arquivo do Google Drive foi compartilhado com uma colega no papel de **Comentarista**. Ela poderá","x":"No Google Drive há três papéis para pessoas: Leitor (só visualiza), Comentarista (visualiza e comenta; nos Documentos, também sugere alterações) e Editor (edita e, por padrão, compartilha). Excluir, alterar permissões e transferir a propriedade não cabem ao Comentarista.","o":["apenas fazer download, sem visualizar o arquivo.","transferir a propriedade do arquivo para si.","editar e excluir o arquivo.","alterar as permissões dos demais usuários.","visualizar o arquivo e inserir comentários, sem editar o conteúdo diretamente."],"c":4},{"id":"s01q09","d":"I","t":"Segurança: ameaças","e":"O tipo de programa malicioso que **registra as teclas digitadas** pelo usuário, permitindo capturar senhas e outros dados, é o","x":"O keylogger é um tipo de spyware que captura o que é digitado. O worm se propaga sozinho pela rede; o adware exibe propaganda; o ransomware sequestra dados e cobra resgate; o rootkit esconde a presença do invasor no sistema.","o":["worm.","keylogger.","rootkit.","ransomware.","adware."],"c":1},{"id":"s01q10","d":"I","t":"Certificação e assinatura digital","e":"Considere as afirmações sobre certificação e assinatura digital.","x":"I e II estão corretas: assina-se com a chave privada, e o certificado, emitido por Autoridade Certificadora, vincula a chave pública ao titular. III está incorreta: a assinatura garante autenticidade, integridade e não repúdio, mas o conteúdo continua legível. O sigilo exige criptografar o documento.","af":["A assinatura digital é gerada com a chave privada do signatário.","O certificado digital associa uma chave pública a uma pessoa ou entidade.","A assinatura digital garante que o conteúdo do documento permaneça sigiloso."],"o":["Apenas I.","Apenas II.","Apenas III.","Apenas I e II.","I, II e III."],"c":3},{"id":"s01q11","d":"R","t":"Negação e De Morgan","e":"A negação lógica de “O paciente trouxe o documento e o exame” é:","x":"Pela Lei de De Morgan, ~(p ∧ q) = ~p ∨ ~q: nega-se cada parte e troca-se 'e' por 'ou'. Para a frase original ser falsa, basta que falte um dos dois itens; por isso a negação usa 'ou'.","o":["O paciente não trouxe o documento e trouxe o exame.","O paciente não trouxe o documento ou não trouxe o exame.","O paciente trouxe o documento ou trouxe o exame.","O paciente não trouxe o documento e não trouxe o exame.","Nenhum paciente trouxe o documento e o exame."],"c":1},{"id":"s01q12","d":"R","t":"Argumentação","e":"Considere verdadeiras as premissas: “Todo assistente do turno da manhã fez o treinamento de LGPD” e “Carla não fez o treinamento de LGPD”. Conclui-se, necessariamente, que","x":"O conjunto dos assistentes da manhã está contido no conjunto de quem fez o treinamento. Quem está fora deste conjunto, como Carla, está fora daquele. Não se pode afirmar em que turno ela trabalha, nem que ela seja assistente.","o":["algum assistente da manhã não fez o treinamento.","Carla não é assistente do turno da manhã.","nenhum assistente fez o treinamento.","Carla fará o treinamento na próxima turma.","Carla é assistente do turno da tarde."],"c":1},{"id":"s01q13","d":"R","t":"Porcentagem","e":"Um almoxarifado recebeu 240 caixas de material. Do total, 15% estavam avariadas e foram devolvidas. Das caixas restantes, 25% foram enviadas à emergência. Quantas caixas foram para a emergência?","x":"Caixas aceitas: 240 × 0,85 = 204. Para a emergência: 204 × 0,25 = 51. O erro comum é aplicar os 25% sobre as 240 caixas iniciais, o que dá 60.","o":["36","45","51","60","153"],"c":2},{"id":"s01q14","d":"R","t":"Sequências","e":"Observe a sequência: 5, 9, 17, 33, 65, … O próximo termo é","x":"Cada termo é o dobro do anterior menos 1: 5 × 2 − 1 = 9; 9 × 2 − 1 = 17; … 65 × 2 − 1 = 129. As diferenças (4, 8, 16, 32) também dobram, e a próxima é 64: 65 + 64 = 129.","o":["97","125","129","130","131"],"c":2},{"id":"s01q15","d":"R","t":"Calendário","e":"Em determinado ano, o dia 1º de março caiu em uma segunda-feira. Nesse ano, o dia 1º de abril caiu em uma","x":"Março tem 31 dias, então de 1º/3 a 1º/4 passam 31 dias. 31 = 4 × 7 + 3; avançam-se 3 dias da semana: segunda → terça → quarta → quinta.","o":["quinta-feira.","quarta-feira.","sexta-feira.","segunda-feira.","terça-feira."],"c":0},{"id":"s01q16","d":"E","t":"SUS","e":"Segundo o art. 3º da Lei nº 8.080/1990, são determinantes e condicionantes da saúde, entre outros,","x":"O art. 3º lista, entre outros, alimentação, moradia, saneamento básico, meio ambiente, trabalho, renda, educação, atividade física, transporte, lazer e acesso a bens e serviços essenciais. A lei adota um conceito ampliado de saúde, ligado à organização social e econômica do país.","o":["apenas o acesso a hospitais de alta complexidade.","a alimentação, a moradia, o saneamento básico, o meio ambiente, o trabalho e a renda.","exclusivamente os fatores genéticos de cada indivíduo.","a filiação partidária e a convicção religiosa.","o tipo de plano de saúde contratado pelo usuário."],"c":1},{"id":"s01q17","d":"E","t":"SUS","e":"Sobre a direção do SUS, considere as afirmações a seguir.","x":"O art. 9º da Lei 8.080/1990 prevê direção única em cada esfera: Ministério da Saúde na União e Secretarias de Saúde (ou órgão equivalente) nos estados, no Distrito Federal e nos municípios. III está errada porque a direção é única em cada esfera, e não compartilhada.","af":["No âmbito da União, a direção do SUS é exercida pelo Ministério da Saúde.","No âmbito dos municípios, é exercida pela respectiva Secretaria de Saúde ou órgão equivalente.","A direção do SUS é compartilhada entre as três esferas dentro de cada nível de governo."],"o":["Apenas II.","Apenas III.","Apenas I e II.","Apenas I e III.","I, II e III."],"c":2},{"id":"s01q18","d":"E","t":"Direitos dos usuários","e":"Ao fazer o cadastro, um usuário informa que é conhecido por um nome diferente do que consta em seu registro civil. Segundo a Carta dos Direitos dos Usuários da Saúde, a conduta adequada é","x":"A Carta garante a identificação pelo nome e sobrenome civil, com um campo para o nome social em todo documento do usuário, assegurando o uso do nome de preferência. É vedado identificar o usuário por número, nome ou código da doença ou de outras formas desrespeitosas.","o":["utilizar apenas o nome civil, por segurança.","chamar o usuário pelo número da senha para evitar constrangimento.","recusar o cadastro até a atualização dos documentos.","exigir decisão judicial de alteração do nome antes do cadastro.","registrar o nome social no campo próprio e utilizá-lo no atendimento."],"c":4},{"id":"s01q19","d":"E","t":"Direitos dos usuários","e":"Segundo a Carta dos Direitos dos Usuários da Saúde, é uma **responsabilidade** do usuário","x":"O 5º princípio da Carta trata das responsabilidades do cidadão: prestar informações, seguir o plano de tratamento ou assumir a recusa, cumprir normas e ter em mãos documentos e exames. As demais alternativas são direitos, previstos no 3º e no 4º princípios.","o":["ter acesso ao seu prontuário e a cópias dele.","escolher o local de sua morte.","receber visitas durante a internação.","obter segunda opinião de outro profissional.","ter em mãos seus documentos e, quando solicitados, os resultados de exames que estejam em seu poder."],"c":4},{"id":"s01q20","d":"E","t":"HumanizaSUS","e":"No método da Política Nacional de Humanização, a inclusão dos fenômenos que desestabilizam os modelos tradicionais de atenção e de gestão, como os conflitos, corresponde à inclusão","x":"A tríplice inclusão abrange os sujeitos (gestores, trabalhadores e usuários), os analisadores sociais e os coletivos. Os analisadores sociais são fenômenos, como os conflitos, que revelam problemas e devem ser acolhidos e analisados, e não silenciados.","o":["dos gestores nas decisões clínicas.","das tecnologias de informação.","dos analisadores sociais.","das redes privadas de saúde.","dos usuários nas ouvidorias."],"c":2},{"id":"s01q21","d":"E","t":"HumanizaSUS","e":"A diretriz da PNH que propõe criar espaços saudáveis, acolhedores e confortáveis, que respeitem a privacidade, facilitem o processo de trabalho e sejam lugares de encontro entre as pessoas, é a","x":"A ambiência considera o espaço físico, social, profissional e de relações. Clínica ampliada trata da singularidade do sujeito; cogestão, da gestão participativa; valorização do trabalhador, das condições de trabalho. Transversalidade é um princípio da PNH, não uma diretriz.","o":["transversalidade.","clínica ampliada.","cogestão.","valorização do trabalhador.","ambiência."],"c":4},{"id":"s01q22","d":"E","t":"Segurança do paciente","e":"Segundo a Portaria GM/MS nº 529/2013, **dano** é","x":"A definição inclui doenças, lesão, sofrimento, morte, incapacidade ou disfunção, e o dano pode ser físico, social ou psicológico. Por isso, um erro de cadastro que cause constrangimento ou atraso também pode gerar dano ao paciente.","o":["apenas a lesão física visível decorrente de procedimento cirúrgico.","qualquer reclamação registrada na ouvidoria.","somente o óbito decorrente de erro de profissional.","o comprometimento da estrutura ou função do corpo e/ou qualquer efeito dele oriundo, podendo ser físico, social ou psicológico.","o prejuízo financeiro sofrido pela instituição de saúde."],"c":3},{"id":"s01q23","d":"E","t":"Segurança do paciente","e":"Segundo a RDC Anvisa nº 36/2013, estão **excluídos** do seu escopo","x":"A RDC 36/2013 aplica-se aos serviços de saúde públicos, privados, filantrópicos, civis ou militares, incluindo os de ensino e pesquisa. Ficam fora do escopo apenas os consultórios individualizados, os laboratórios clínicos e os serviços móveis e de atenção domiciliar.","o":["os hospitais filantrópicos.","os consultórios individualizados, os laboratórios clínicos e os serviços móveis e de atenção domiciliar.","os serviços de saúde que exercem ações de ensino e pesquisa.","os serviços de saúde militares.","os hospitais privados."],"c":1},{"id":"s01q24","d":"E","t":"NR 32","e":"Para a NR 32, consideram-se **agentes biológicos**","x":"A NR 32 adota um conceito amplo, que abrange microrganismos modificados ou não, culturas de células, parasitas, toxinas e príons. Produtos químicos e radiações ionizantes são riscos tratados em outros itens da norma.","o":["os microrganismos, geneticamente modificados ou não, as culturas de células, os parasitas, as toxinas e os príons.","somente os microrganismos não modificados geneticamente.","apenas as bactérias e os vírus transmitidos pelo ar.","as radiações ionizantes utilizadas em exames de imagem.","os produtos químicos usados na desinfecção de superfícies."],"c":0},{"id":"s01q25","d":"E","t":"NR 32","e":"Em todo local onde exista possibilidade de exposição ao agente biológico, a NR 32 exige lavatório exclusivo para higiene das mãos provido de","x":"A norma exige água corrente, sabonete líquido, toalha descartável e lixeira com abertura sem contato manual. Sabonete em barra, toalha coletiva e tampa de abertura manual favorecem a contaminação das mãos já higienizadas.","o":["água corrente e lixeira com tampa de abertura manual.","sabonete líquido e secador de ar quente, dispensando a lixeira.","água corrente, sabonete líquido, toalha descartável e lixeira com sistema de abertura sem contato manual.","álcool em gel, dispensando água corrente.","água corrente, sabonete em barra e toalha de tecido de uso coletivo."],"c":2},{"id":"s01q26","d":"E","t":"Ética no serviço público","e":"Segundo o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal, toda ausência injustificada do local de trabalho é","x":"O item XII das regras deontológicas afirma que toda ausência injustificada é fator de desmoralização do serviço público. O Código também prevê como dever ser assíduo e frequente ao serviço. A única pena aplicável pela Comissão de Ética é a censura; não há demissão automática.","o":["fator de desmoralização do serviço público, que conduz à desordem nas relações humanas.","assunto exclusivo da vida privada do servidor.","conduta aceitável quando não houver atendimento ao público.","falta leve, sem repercussão ética.","motivo de demissão imediata, sem processo."],"c":0},{"id":"s01q27","d":"E","t":"Ética no serviço público","e":"Considere as afirmações sobre o Decreto nº 1.171/1994.","x":"I reproduz o item VII, e II é dever previsto no item XIV. III está incorreta: o item XV veda retirar da repartição, sem estar legalmente autorizado, qualquer documento, livro ou bem do patrimônio público.","af":["A publicidade de qualquer ato administrativo constitui requisito de eficácia e moralidade, salvo os casos de segurança nacional, investigações policiais ou interesse superior do Estado.","É dever do servidor exercer com estrita moderação as prerrogativas funcionais que lhe sejam atribuídas.","É permitido ao servidor retirar da repartição documentos públicos para concluir o trabalho em casa, independentemente de autorização."],"o":["Apenas III.","Apenas I e II.","Apenas I e III.","Apenas II e III.","I, II e III."],"c":1},{"id":"s01q28","d":"E","t":"LGPD","e":"Para a LGPD, **tratamento** de dados pessoais é","x":"O art. 5º, X, define tratamento de forma ampla: coleta, produção, recepção, classificação, utilização, acesso, reprodução, transmissão, distribuição, processamento, arquivamento, armazenamento, eliminação, avaliação, modificação, comunicação, transferência, difusão ou extração. Consultar um cadastro também é tratamento.","o":["toda operação realizada com dados pessoais, como coleta, utilização, acesso, armazenamento, compartilhamento e eliminação.","apenas a coleta de dados por meio digital.","somente a venda de bancos de dados a terceiros.","o procedimento de anonimizar dados pessoais.","exclusivamente o armazenamento em nuvem."],"c":0},{"id":"s01q29","d":"E","t":"LGPD","e":"Um hospital registra no prontuário o diagnóstico de um paciente atendido na emergência. A base legal da LGPD mais adequada para esse tratamento de dado sensível é a","x":"O art. 11, II, f, permite tratar dados sensíveis sem consentimento para a tutela da saúde, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária. Legítimo interesse e proteção do crédito não são bases válidas para dados sensíveis, e autorizações genéricas são nulas.","o":["legítimo interesse do controlador.","execução de contrato de trabalho.","autorização genérica dada no momento da entrada no hospital.","proteção do crédito.","tutela da saúde, em procedimento realizado por profissionais de saúde, serviços de saúde ou autoridade sanitária."],"c":4},{"id":"s01q30","d":"E","t":"Almoxarifado e estoques","e":"Um item tem consumo médio de 600 unidades por mês (30 dias). O tempo de reposição é de 15 dias e o estoque de segurança é de 150 unidades. O ponto de pedido é de","x":"Consumo diário = 600 ÷ 30 = 20 unidades. PP = consumo × TR + ES = 20 × 15 + 150 = 300 + 150 = 450. O erro de unidade (600 × 15 + 150 = 9.150) é a armadilha comum.","o":["300 unidades","450 unidades","600 unidades","750 unidades","9.150 unidades"],"c":1},{"id":"s01q31","d":"E","t":"Almoxarifado e estoques","e":"Chega ao almoxarifado um lote de soro com validade para 3 meses. No estoque, há um lote mais antigo, com validade para 8 meses. Segundo as boas práticas de armazenagem hospitalar, deve-se","x":"Para medicamentos e perecíveis vale o PVPS (primeiro que vence, primeiro que sai), também chamado FEFO. O lote que vence antes sai primeiro, ainda que tenha chegado depois, para evitar perdas por vencimento. A devolução só cabe se a validade descumprir o prazo mínimo contratado.","o":["distribuir primeiro o último lote recebido, por ser o mais recente (UEPS).","alternar os lotes aleatoriamente.","devolver o lote novo ao fornecedor por ter validade curta.","distribuir primeiro o lote mais antigo, independentemente da validade (PEPS).","distribuir primeiro o lote que acabou de chegar, por vencer antes (PVPS)."],"c":4},{"id":"s01q32","d":"E","t":"ECA","e":"Segundo o art. 10 do ECA, os hospitais e estabelecimentos de atenção à saúde de gestantes devem fornecer declaração de nascimento onde constem necessariamente","x":"O inciso IV do art. 10 exige declaração de nascimento com as intercorrências do parto e do desenvolvimento do neonato. O mesmo artigo exige prontuário por 18 anos, identificação do recém-nascido, exames metabólicos, alojamento conjunto e orientação sobre amamentação.","o":["a religião dos pais.","a renda da família.","as intercorrências do parto e do desenvolvimento do neonato.","o nome do pediatra que acompanhará a criança.","o tipo sanguíneo do pai."],"c":2},{"id":"s01q33","d":"E","t":"ECA","e":"Segundo o art. 4º do ECA, é dever de quem assegurar, com absoluta prioridade, a efetivação dos direitos da criança e do adolescente?","x":"O art. 4º atribui o dever à família, à comunidade, à sociedade em geral e ao poder público. A garantia de prioridade inclui a precedência de atendimento nos serviços públicos ou de relevância pública, o que se aplica ao atendimento hospitalar.","o":["Da família, da comunidade, da sociedade em geral e do poder público.","Exclusivamente do Estado.","Exclusivamente da família.","Apenas do Conselho Tutelar.","Somente da escola e da família."],"c":0},{"id":"s01q34","d":"E","t":"Estatuto da Pessoa Idosa","e":"Segundo o Estatuto da Pessoa Idosa, a garantia de prioridade compreende o atendimento","x":"O art. 3º, § 1º, I, garante atendimento preferencial imediato e individualizado em órgãos públicos e privados. A prioridade vale a partir dos 60 anos; os maiores de 80 têm prioridade especial sobre as demais pessoas idosas. Não se exige laudo.","o":["prioritário somente para pessoas com mais de 80 anos.","prioritário condicionado à apresentação de laudo médico.","preferencial apenas em órgãos públicos.","preferencial imediato e individualizado junto aos órgãos públicos e privados prestadores de serviços à população.","preferencial apenas quando não houver fila."],"c":3},{"id":"s01q35","d":"E","t":"Estatuto da Pessoa Idosa","e":"Para os efeitos do Estatuto da Pessoa Idosa, considera-se violência contra a pessoa idosa","x":"O art. 19, § 1º, adota conceito amplo: ação ou omissão, em local público ou privado, que cause morte, dano ou sofrimento físico ou psicológico. A suspeita ou confirmação gera notificação compulsória à autoridade sanitária e comunicação à polícia, ao Ministério Público ou aos Conselhos da Pessoa Idosa.","o":["somente a violência praticada por familiares.","apenas a agressão física praticada em local público.","apenas a conduta que resulte em lesão corporal grave.","qualquer ação ou omissão praticada em local público ou privado que lhe cause morte, dano ou sofrimento físico ou psicológico.","exclusivamente a apropriação de bens da pessoa idosa."],"c":3},{"id":"s01q36","d":"E","t":"LBI","e":"Segundo a Lei Brasileira de Inclusão, a concepção de produtos, ambientes, programas e serviços a serem usados por todas as pessoas, sem necessidade de adaptação ou de projeto específico, denomina-se","x":"Desenho universal é a concepção pensada desde o início para todos. Adaptação razoável é o ajuste feito em cada caso, sem ônus desproporcional. Tecnologia assistiva é o conjunto de produtos e serviços que promovem a funcionalidade da pessoa com deficiência.","o":["acessibilidade atitudinal.","tecnologia assistiva.","atendimento prioritário.","desenho universal.","adaptação razoável."],"c":3},{"id":"s01q37","d":"E","t":"LBI","e":"Sobre o atendimento prioritário à pessoa com deficiência, previsto no art. 9º da LBI, considere as afirmações.","x":"I e III constam do art. 9º. II está incorreta: a prioridade é extensiva ao acompanhante ou ao atendente pessoal, exceto quanto à restituição de imposto de renda e à tramitação processual (art. 9º, § 1º).","af":["Inclui o atendimento em todas as instituições e serviços de atendimento ao público.","É extensivo ao acompanhante, inclusive quanto à restituição de imposto de renda.","Inclui a disponibilização de recursos humanos e tecnológicos que garantam atendimento em igualdade de condições com as demais pessoas."],"o":["Apenas I.","Apenas II.","Apenas I e II.","Apenas I e III.","Apenas II e III."],"c":3},{"id":"s01q38","d":"E","t":"Comunicação Não-Violenta","e":"Segundo a Comunicação Não-Violenta, qual das frases expressa um **sentimento**, e não uma interpretação sobre a conduta do outro?","x":"Para Rosenberg, 'sinto que você…' expressa um pensamento, e palavras como 'desrespeitado' e 'manipulado' são pseudossentimentos: interpretam o que o outro fez. 'Estou preocupada' nomeia o que a pessoa sente, ligado a uma necessidade, como segurança ou informação.","o":["Sinto que a chefia é injusta comigo.","Eu me sinto manipulado pela equipe.","Sinto que você não se importa com o paciente.","Eu me sinto desrespeitado por você.","Estou preocupada."],"c":4},{"id":"s01q39","d":"E","t":"Diversidade e inclusão (Guia ANS)","e":"Segundo o Guia ANS de Diversidade e Inclusão, o termo adequado para se referir a quem tem deficiência é","x":"O Guia adota 'pessoa com deficiência (PcD)', em conformidade com a Lei nº 13.146/2015. A deficiência não se 'porta' como um objeto, e termos como 'especial' reforçam estereótipos. O Guia trata o capacitismo como forma de discriminação.","o":["portador de necessidades especiais.","pessoa especial.","portador de deficiência.","pessoa com deficiência.","deficiente."],"c":3},{"id":"s01q40","d":"E","t":"Injúria racial","e":"Após a Lei nº 14.532/2023, a injúria racial, prevista no art. 2º-A da Lei nº 7.716/1989, tem pena de","x":"A Lei 14.532/2023 transformou a injúria racial em crime de racismo, com reclusão de 2 a 5 anos e multa, aumentada de metade em concurso de duas ou mais pessoas. A pena de 1 a 3 anos permanece para a injúria por religião, idade ou deficiência, no Código Penal.","o":["detenção, de 1 a 6 meses, ou multa.","prestação de serviços à comunidade, exclusivamente.","reclusão, de 1 a 3 anos, e multa.","apenas multa.","reclusão, de 2 a 5 anos, e multa."],"c":4}],"texto":{"titulo":"Dados que cuidam","corpo":"Quando um paciente chega à recepção de um hospital, entrega muito mais do que um documento de identidade. Endereço, telefone, histórico de doenças e nomes de familiares passam a circular por sistemas que, se bem utilizados, tornam o atendimento mais rápido e seguro.\nEssa circulação, porém, exige cuidado. Uma informação digitada de forma incorreta pode levar ao exame errado; uma senha compartilhada pode expor a intimidade de alguém que confiou na instituição. Por isso, proteger dados não é tarefa exclusiva do setor de tecnologia: começa no balcão, com quem faz o cadastro.\nA confiança, afinal, é o elo mais frágil dessa corrente. Ela leva anos para ser construída e pode ser perdida em um único descuido. Cuidar dos dados é, também, uma forma de cuidar das pessoas."},"tema":"Proteção de dados e atendimento"},{"n":2,"q":[{"id":"s02q01","d":"P","t":"Interpretação de texto","e":"Segundo o texto,","x":"O 2º parágrafo afirma que escutar é 'ganhar precisão': quem ouve até o fim identifica a necessidade real e evita encaminhamentos equivocados. O texto critica a pressa, mostrando que ela faz o problema voltar, e diz que na saúde a escuta tem peso 'ainda maior'.","tx":1,"o":["nos serviços de saúde, a escuta tem importância menor.","interromper o usuário é recomendável quando há fila.","a pressa garante respostas mais adequadas ao usuário.","a escuta atenta torna o atendimento mais preciso e reduz o retrabalho.","escutar com atenção sempre prolonga o atendimento."],"c":3},{"id":"s02q02","d":"P","t":"Sentido e coesão","e":"No 2º parágrafo, a expressão *ao contrário* estabelece oposição em relação à ideia de","x":"O texto diz que escutar 'não significa perder tempo' e, 'ao contrário', significa 'ganhar precisão'. A expressão opõe 'ganhar precisão' à ideia, negada antes, de 'perder tempo'.","tx":1,"o":["oferecer uma resposta pronta.","estar fragilizado.","identificar a necessidade real.","ser levado a sério.","perder tempo."],"c":4},{"id":"s02q03","d":"P","t":"Nexos e reescrita","e":"Assinale a substituição que **mantém** o sentido e a correção do texto.","x":"Colocado antes do verbo, *pois* tem valor explicativo/causal, equivalente a *uma vez que*. *Portanto* é conclusivo e inverteria a relação lógica. As demais trocas mudam o sentido: *nunca* nega a frequência, *Apesar de* introduz concessão e *menor* inverte a comparação.","tx":1,"o":["*Diante de* (1º parágrafo) por *Apesar de*.","*ainda maior* (3º parágrafo) por *menor*.","*pois* (3º parágrafo) por *uma vez que*.","*muitas vezes* (1º parágrafo) por *nunca*.","*pois* (3º parágrafo) por *portanto*."],"c":2},{"id":"s02q04","d":"P","t":"Regência","e":"Assinale a frase **correta** quanto à regência, segundo a norma-padrão.","x":"*Preferir* pede a estrutura 'preferir algo a algo', sem 'mais' e sem 'do que'. *Assistir*, no sentido de ver, exige 'a' (assistiu ao treinamento). *Obedecer* também exige 'a' (obedeceu às normas). Com verbos de movimento usa-se 'a' (chegou ao hospital).","o":["A recepcionista obedeceu as normas da instituição.","O servidor assistiu o treinamento sobre acolhimento.","Prefiro mais ligar do que ir pessoalmente ao hospital.","O acompanhante chegou no hospital às 8 horas.","O paciente preferia ser atendido pela manhã a esperar até a tarde."],"c":4},{"id":"s02q05","d":"P","t":"Pontuação","e":"Assinale a alternativa **corretamente** pontuada.","x":"O adjunto adverbial antecipado ('Diante da fila que crescia') pode ser isolado por vírgula. Nas demais, a vírgula separa o sujeito do verbo ('Os pacientes… foram'; 'O hospital… oferece'; 'Quem ouve até o fim… identifica') ou o verbo de seu complemento ('explicou, ao acompanhante'), o que a norma não admite.","o":["A servidora explicou, ao acompanhante o fluxo de atendimento.","Quem ouve até o fim, identifica a necessidade real.","Os pacientes que aguardavam na recepção, foram chamados.","O hospital, oferece atendimento humanizado.","Diante da fila que crescia, a recepcionista manteve a calma."],"c":4},{"id":"s02q06","d":"I","t":"Planilhas: referências","e":"Em uma planilha, a célula B2 contém a fórmula `=$A$1*B1`. Se essa fórmula for copiada para a célula D3, o resultado em D3 será","x":"De B2 para D3, o deslocamento é de +2 colunas e +1 linha. A referência absoluta $A$1 não muda. A relativa B1 passa a D2 (B + 2 = D; 1 + 1 = 2).","o":["`=$A$3*D2`","`=$A$1*D3`","`=$A$1*D2`","`=$A$1*B1`","`=$C$2*D2`"],"c":2},{"id":"s02q07","d":"I","t":"Planilhas: funções","e":"Para contar quantas células do intervalo C2:C50 contêm exatamente o texto “Pendente”, a fórmula adequada é","x":"CONT.SE conta as células de um intervalo que atendem a um critério. SOMA e MÉDIA operam números; CONT.NÚM conta células com números; e CONT.VALORES conta células não vazias, sem critério.","o":["`=CONT.NÚM(C2:C50)`","`=CONT.VALORES(\"Pendente\")`","`=MÉDIA(C2:C50;\"Pendente\")`","`=SOMA(C2:C50;\"Pendente\")`","`=CONT.SE(C2:C50;\"Pendente\")`"],"c":4},{"id":"s02q08","d":"I","t":"Editor de textos","e":"No Google Documentos, o recurso que permite a um colaborador propor alterações no texto, que depois podem ser aceitas ou rejeitadas, é o","x":"No modo Sugestão, as alterações aparecem marcadas e o autor ou editor decide se as aceita. É o equivalente ao Controlar Alterações do Word. O histórico de versões serve para consultar e restaurar versões anteriores do arquivo.","o":["histórico de versões.","contador de palavras.","digitação por voz.","modo Sugestão.","modo Visualização."],"c":3},{"id":"s02q09","d":"I","t":"Segurança: golpes","e":"Uma servidora recebeu um **SMS** que imitava o banco e pedia que ela clicasse em um link para “regularizar o cadastro”. Esse golpe é conhecido como","x":"Smishing é o phishing feito por SMS. Pharming redireciona a vítima a um site falso mesmo quando ela digita o endereço correto. Worm é um malware que se propaga sozinho; a negação de serviço derruba sistemas; e o rootkit esconde a presença do invasor.","o":["pharming.","smishing.","negação de serviço.","rootkit.","worm."],"c":1},{"id":"s02q10","d":"I","t":"Segurança: proteção","e":"O recurso de segurança que controla o tráfego de rede que entra e sai do computador, permitindo ou bloqueando conexões conforme regras definidas, é o","x":"O firewall filtra conexões de rede segundo regras. O antivírus (antimalware) detecta e remove códigos maliciosos; o backup preserva cópias dos dados; a navegação anônima apenas não guarda o histórico local; e o certificado digital identifica pessoas ou sites.","o":["firewall.","modo de navegação anônima.","antivírus.","backup.","certificado digital."],"c":0},{"id":"s02q11","d":"R","t":"Equivalência lógica","e":"Uma proposição logicamente equivalente a “Se o setor está organizado, então o inventário é rápido” é:","x":"A contrapositiva (~q → ~p) é equivalente a p → q. A recíproca (q → p) e a inversa (~p → ~q) não são equivalentes. 'p e não q' é a negação. A forma equivalente com 'ou' seria 'O setor não está organizado ou o inventário é rápido'.","o":["O setor está organizado ou o inventário é rápido.","Se o inventário não é rápido, então o setor não está organizado.","Se o setor não está organizado, então o inventário não é rápido.","Se o inventário é rápido, então o setor está organizado.","O setor está organizado e o inventário não é rápido."],"c":1},{"id":"s02q12","d":"R","t":"Tabela-verdade","e":"Sabendo que a proposição p é **falsa** e a proposição q é **verdadeira**, assinale a proposição composta **verdadeira**.","x":"p → q com F → V resulta V (a condicional só é falsa em V → F). p ∧ q = F ∧ V = F. p ↔ q é falsa, pois os valores diferem. ~q = F. ~p → ~q = V → F = F.","o":["~p → ~q","p ↔ q","~q","p → q","p ∧ q"],"c":3},{"id":"s02q13","d":"R","t":"Regra de três composta","e":"Seis funcionários conferem 1.800 itens em 5 horas. Mantido o mesmo ritmo, quantos itens 4 funcionários conferem em 6 horas?","x":"Produtividade: 1.800 ÷ (6 × 5) = 60 itens por funcionário-hora. Com 4 funcionários em 6 horas: 4 × 6 × 60 = 1.440 itens.","o":["1.200","1.440","1.600","1.800","2.160"],"c":1},{"id":"s02q14","d":"R","t":"Sequências","e":"Na sequência de letras B, E, H, K, …, considerando o alfabeto de 26 letras, a próxima letra é","x":"As posições são 2, 5, 8 e 11, aumentando de 3 em 3. A próxima posição é 14, que corresponde à letra N.","o":["P","N","L","M","O"],"c":1},{"id":"s02q15","d":"R","t":"Verdades e mentiras","e":"Três colegas fizeram as afirmações a seguir. Ana: “Bia mente”. Bia: “Caio mente”. Caio: “Ana e Bia mentem”. Cada um sempre diz a verdade ou sempre mente. Pode-se concluir que","x":"Se Caio dissesse a verdade, Ana e Bia mentiriam; mas Ana mentir significaria que Bia diz a verdade, o que é uma contradição. Logo Caio mente, e a fala de Bia ('Caio mente') é verdadeira. Então a fala de Ana ('Bia mente') é falsa. Só Bia diz a verdade.","o":["apenas Ana diz a verdade.","apenas Caio diz a verdade.","os três mentem.","apenas Bia diz a verdade.","Ana e Caio dizem a verdade."],"c":3},{"id":"s02q16","d":"E","t":"SUS","e":"Segundo o art. 198 da Constituição Federal, o atendimento integral no SUS deve ocorrer com prioridade para","x":"O inciso II do art. 198 fixa como diretriz o atendimento integral, com prioridade para as atividades preventivas, sem prejuízo dos serviços assistenciais. Inverter a ordem é a pegadinha mais comum. O acesso é universal e não depende de contribuição.","o":["os usuários que contribuem para a Previdência Social.","os procedimentos de alta complexidade.","as atividades preventivas, sem prejuízo dos serviços assistenciais.","os serviços assistenciais, sem prejuízo das atividades preventivas.","os serviços prestados pela iniciativa privada."],"c":2},{"id":"s02q17","d":"E","t":"SUS","e":"Segundo a Lei nº 8.142/1990, a representação dos usuários nos Conselhos de Saúde e nas Conferências de Saúde é","x":"O art. 1º, § 4º, estabelece que a representação dos usuários é paritária em relação ao conjunto dos demais segmentos (governo, prestadores e profissionais). Na prática, os usuários ocupam 50% das vagas.","o":["minoritária, para garantir a predominância técnica.","de um quarto das vagas, igual à dos demais segmentos.","exclusiva dos profissionais de saúde.","paritária em relação ao conjunto dos demais segmentos.","definida livremente por cada gestor."],"c":3},{"id":"s02q18","d":"E","t":"Direitos dos usuários","e":"Segundo a Carta dos Direitos dos Usuários da Saúde, as receitas entregues ao usuário devem ser","x":"A Carta garante receitas legíveis, com o nome genérico das substâncias, sem códigos ou abreviaturas, e com nome, assinatura e número de registro do profissional. Isso faz parte do direito a tratamento adequado e efetivo.","o":["legíveis, com o nome genérico das substâncias, sem códigos ou abreviaturas, com nome, assinatura e registro do profissional.","digitadas pela recepção, sem assinatura do profissional.","emitidas somente com o nome comercial do medicamento.","entregues apenas ao familiar responsável.","escritas com abreviaturas técnicas, para garantir o sigilo."],"c":0},{"id":"s02q19","d":"E","t":"Direitos dos usuários","e":"Considere as afirmações sobre os direitos dos usuários da saúde.","x":"I e II estão previstas na Carta (respeito à pessoa e humanização). III está incorreta: o usuário tem direito a acompanhante de sua livre escolha nas consultas e exames. Quem escolhe é o usuário, não o médico.","af":["O usuário tem direito ao sigilo de suas informações pessoais, mesmo após a morte, salvo nos casos de risco à saúde pública.","O usuário tem direito de recusar o tratamento proposto.","O acompanhante nas consultas e exames depende de autorização prévia do médico, que escolhe quem poderá acompanhar."],"o":["Apenas I.","Apenas I e II.","Apenas I e III.","Apenas II e III.","I, II e III."],"c":1},{"id":"s02q20","d":"E","t":"HumanizaSUS","e":"No Acolhimento com Classificação de Risco, a ordem de atendimento deixa de seguir apenas a ordem de chegada e passa a considerar","x":"A classificação de risco, dispositivo da PNH, prioriza o atendimento pela gravidade, avaliada por profissional de saúde e geralmente identificada por cores. A recepção não classifica risco, mas deve explicar esse fluxo ao usuário.","o":["o tipo de vínculo do usuário com o serviço.","a ordem alfabética dos nomes.","a disponibilidade de fichas na recepção.","a idade do usuário, exclusivamente.","a gravidade e o risco do caso, avaliados por profissional de saúde."],"c":4},{"id":"s02q21","d":"E","t":"HumanizaSUS","e":"O princípio da PNH segundo o qual as decisões da gestão interferem diretamente na atenção à saúde, razão pela qual trabalhadores e usuários devem conhecer e participar da gestão, é o da","x":"A indissociabilidade entre atenção e gestão é um dos três princípios da PNH, ao lado da transversalidade e do protagonismo, corresponsabilidade e autonomia. Universalidade e hierarquização são princípios do SUS; ambiência é diretriz da PNH.","o":["hierarquização.","universalidade.","indissociabilidade entre atenção e gestão.","ambiência.","transversalidade."],"c":2},{"id":"s02q22","d":"E","t":"Segurança do paciente","e":"Segundo a Portaria GM/MS nº 529/2013, a cultura de segurança envolve valores, atitudes e comportamentos que determinam o comprometimento com a gestão da saúde e da segurança,","x":"A definição legal é expressa: a cultura de segurança substitui a culpa e a punição pela oportunidade de aprender com as falhas. Entre suas características está priorizar a segurança acima de metas financeiras e operacionais e encorajar a notificação.","o":["dispensando a notificação de incidentes sem dano.","substituindo a culpa e a punição pela oportunidade de aprender com as falhas.","restringindo a discussão de erros à direção do serviço.","colocando as metas financeiras acima da segurança.","priorizando a identificação e a punição dos responsáveis por erros."],"c":1},{"id":"s02q23","d":"E","t":"Segurança do paciente","e":"Os protocolos básicos de segurança do paciente adotados pelo Programa Nacional de Segurança do Paciente tratam de","x":"São seis protocolos básicos: identificação do paciente; cirurgia segura; higiene das mãos; segurança na prescrição, uso e administração de medicamentos; prevenção de quedas; e prevenção de lesão por pressão. A identificação é a base de todos os outros.","o":["controle de ponto, escalas de plantão e horas extras.","limpeza de áreas externas, jardinagem e estacionamento.","triagem administrativa, agendamento e faturamento.","compras, licitações e gestão de contratos.","identificação do paciente, cirurgia segura, higiene das mãos, medicamentos, prevenção de quedas e de lesão por pressão."],"c":4},{"id":"s02q24","d":"E","t":"NR 32","e":"Segundo a NR 32, os trabalhadores que utilizarem objetos perfurocortantes","x":"O item 32.2.4.14 atribui o descarte a quem utilizou o material. A norma veda o reencape e a desconexão manual de agulhas e exige recipientes rígidos, resistentes à perfuração, respeitando o limite de enchimento.","o":["devem entregá-los ao setor de higienização para descarte ao final do turno.","podem reencapar as agulhas antes do descarte.","devem desconectar manualmente as agulhas das seringas.","podem descartá-los em sacos plásticos comuns.","devem ser os responsáveis pelo seu descarte."],"c":4},{"id":"s02q25","d":"E","t":"NR 32","e":"Segundo a NR 32, a vestimenta de trabalho adequada às atividades com exposição a agentes biológicos deve ser fornecida","x":"A NR 32 determina que o empregador forneça a vestimenta de trabalho, em condições de conforto, sem ônus para o empregado, a todos os trabalhadores expostos, e não apenas à enfermagem. A norma também veda sair do local de trabalho com a vestimenta utilizada.","o":["sem ônus para o empregado.","somente aos profissionais de enfermagem.","mediante desconto parcelado no salário.","apenas após o período de experiência.","pelo próprio trabalhador, conforme sua preferência."],"c":0},{"id":"s02q26","d":"E","t":"Ética no serviço público","e":"Segundo as regras deontológicas do Decreto nº 1.171/1994, tratar mal uma pessoa que paga seus tributos direta ou indiretamente significa","x":"O item IX afirma que a cortesia, a boa vontade, o cuidado e o tempo dedicados ao serviço público caracterizam o esforço pela disciplina, e que tratar mal quem paga seus tributos significa causar-lhe dano moral.","o":["proteger o interesse da Administração.","exercer regularmente o cargo.","agir conforme a hierarquia.","causar-lhe dano moral.","praticar falta sem relevância ética."],"c":3},{"id":"s02q27","d":"E","t":"Ética no serviço público","e":"Um assistente administrativo percebe que um colega está retirando materiais do almoxarifado para uso pessoal. Segundo o Código de Ética, a conduta esperada é","x":"É dever do servidor comunicar imediatamente aos superiores todo ato ou fato contrário ao interesse público (item XIV). É vedado ser conivente com erro ou infração por espírito de solidariedade (item XV, c).","o":["resolver a questão diretamente com o colega, sem registro.","aguardar o inventário anual para que o fato seja descoberto.","comunicar imediatamente o fato aos superiores, exigindo as providências cabíveis.","dividir os materiais para evitar conflito.","manter silêncio por espírito de solidariedade ao colega."],"c":2},{"id":"s02q28","d":"E","t":"LGPD","e":"Ao confirmar o cadastro, uma assistente atualiza o telefone e o endereço do paciente, que estavam desatualizados. Essa conduta concretiza, principalmente, o princípio da LGPD da","x":"O princípio da qualidade dos dados (art. 6º, V) garante aos titulares exatidão, clareza, relevância e atualização dos dados. Manter o cadastro atualizado também evita erros de contato e de identificação.","o":["transparência.","não discriminação.","qualidade dos dados.","prevenção.","finalidade."],"c":2},{"id":"s02q29","d":"E","t":"LGPD","e":"Sobre o consentimento na LGPD, considere as afirmações.","x":"I e II estão no art. 8º (§§ 4º e 5º). III está incorreta: o ônus da prova de que o consentimento foi obtido regularmente cabe ao controlador (art. 8º, § 2º).","af":["As autorizações genéricas para o tratamento de dados pessoais são nulas.","O consentimento pode ser revogado a qualquer momento, por procedimento gratuito e facilitado.","Cabe ao titular o ônus da prova de que o consentimento foi obtido em conformidade com a lei."],"o":["Apenas II.","Apenas III.","Apenas I e II.","Apenas II e III.","I, II e III."],"c":2},{"id":"s02q30","d":"E","t":"Almoxarifado e estoques","e":"Os valores de consumo anual de quatro itens foram: luvas, 3.000 caixas a R$ 1,50; cateter, 200 unidades a R$ 45,00; gaze, 5.000 pacotes a R$ 0,40; seringa, 4.000 unidades a R$ 0,60. Pela curva ABC, o item que deve receber controle mais rigoroso é","x":"Valores de consumo: cateter 200 × 45 = R$ 9.000; luvas 3.000 × 1,50 = R$ 4.500; seringa 4.000 × 0,60 = R$ 2.400; gaze 5.000 × 0,40 = R$ 2.000. O cateter concentra cerca de metade do valor e é classe A, mesmo com a menor quantidade física.","o":["o cateter.","a gaze.","nenhum, pois todos têm o mesmo valor.","a seringa.","a luva."],"c":0},{"id":"s02q31","d":"E","t":"Almoxarifado e estoques","e":"No recebimento de materiais, a etapa que verifica se a **quantidade** entregue corresponde à da nota fiscal e do pedido, por contagem, pesagem ou medição, é a","x":"A conferência quantitativa confere quantidades. A qualitativa verifica se o material atende às especificações (marca, validade, embalagem). A regularização é a etapa final de confronto de documentos e liberação para pagamento.","o":["codificação.","conferência quantitativa.","especificação técnica.","regularização contábil.","conferência qualitativa."],"c":1},{"id":"s02q32","d":"E","t":"ECA","e":"Segundo o parágrafo único do art. 2º do ECA, nos casos expressos em lei, o Estatuto aplica-se excepcionalmente às pessoas entre","x":"O ECA considera criança a pessoa até 12 anos incompletos e adolescente aquela entre 12 e 18 anos. Excepcionalmente, nos casos expressos em lei, aplica-se às pessoas entre 18 e 21 anos.","o":["dezoito e vinte e um anos de idade.","vinte e um e vinte e cinco anos de idade.","doze e quatorze anos de idade.","dezesseis e dezoito anos de idade.","dezoito e vinte e quatro anos de idade."],"c":0},{"id":"s02q33","d":"E","t":"ECA","e":"Segundo o ECA, as gestantes ou mães que manifestem interesse em entregar seus filhos para adoção serão obrigatoriamente encaminhadas, sem constrangimento,","x":"O art. 13, § 1º, determina o encaminhamento obrigatório, sem constrangimento, à Justiça da Infância e da Juventude. O serviço de saúde deve acolher a manifestação sem julgamento.","o":["à família extensa, para decisão.","ao cartório de registro civil.","ao serviço de ouvidoria do hospital.","à Justiça da Infância e da Juventude.","à delegacia de polícia."],"c":3},{"id":"s02q34","d":"E","t":"Estatuto da Pessoa Idosa","e":"Segundo o art. 16 do Estatuto da Pessoa Idosa, caso não seja possível o acompanhamento da pessoa idosa internada, caberá","x":"O parágrafo único do art. 16 atribui ao profissional de saúde responsável pelo tratamento conceder a autorização ou, na impossibilidade, justificá-la por escrito. A regra é o acompanhante em tempo integral, segundo critério médico.","o":["ao profissional de saúde responsável pelo tratamento justificar a impossibilidade por escrito.","ao diretor administrativo vedar o acompanhamento sem justificativa.","ao Ministério Público autorizar previamente a negativa.","à recepção decidir verbalmente, conforme a lotação.","à família assinar termo de renúncia ao direito."],"c":0},{"id":"s02q35","d":"E","t":"Estatuto da Pessoa Idosa","e":"Segundo o Estatuto da Pessoa Idosa, nos planos de saúde é","x":"O Estatuto veda a discriminação da pessoa idosa nos planos de saúde pela cobrança de valores diferenciados em razão da idade. A norma integra o direito à saúde da pessoa idosa.","o":["permitida a cobrança diferenciada a partir dos 80 anos.","permitido recusar a contratação por pessoa idosa.","vedada a discriminação da pessoa idosa pela cobrança de valores diferenciados em razão da idade.","facultativo o atendimento de urgência à pessoa idosa.","obrigatória a exclusão do plano aos 75 anos."],"c":2},{"id":"s02q36","d":"E","t":"LBI","e":"Na recepção, um servidor costuma dirigir-se apenas ao acompanhante de usuários com deficiência, ignorando a própria pessoa atendida. Segundo a LBI, essa conduta caracteriza barreira","x":"Barreiras atitudinais são atitudes ou comportamentos que impedem ou prejudicam a participação da pessoa com deficiência em igualdade de condições. A conduta correta é dirigir-se diretamente à pessoa atendida.","o":["atitudinal.","tecnológica.","arquitetônica.","urbanística.","nos transportes."],"c":0},{"id":"s02q37","d":"E","t":"LBI","e":"Segundo o art. 6º da LBI, a deficiência não afeta a plena capacidade civil da pessoa, inclusive para","x":"O art. 6º assegura a plena capacidade civil para casar, exercer direitos sexuais e reprodutivos, decidir sobre o número de filhos, conservar a fertilidade (vedada a esterilização compulsória), exercer o direito à família e à guarda, tutela, curatela e adoção.","o":["adotar somente com aprovação de equipe médica.","ter seus direitos reprodutivos decididos pelo curador.","casar apenas com autorização judicial.","ser submetida a tratamento sem consentimento quando houver interesse da família.","conservar sua fertilidade, sendo vedada a esterilização compulsória."],"c":4},{"id":"s02q38","d":"E","t":"Comunicação Não-Violenta","e":"Segundo a Comunicação Não-Violenta, o que diferencia um **pedido** de uma **exigência** é","x":"Para Rosenberg, um pedido genuíno aceita o 'não' como início de diálogo sobre as necessidades de ambos. Se a recusa leva a crítica, culpa ou punição, a solicitação era uma exigência, ainda que feita com palavras gentis.","o":["o fato de a solicitação ser feita por escrito.","o tom de voz de quem fala.","o cargo hierárquico de quem faz a solicitação.","a reação de quem pede diante da recusa: se o “não” gera culpa ou punição, trata-se de exigência.","o uso das palavras “por favor” e “obrigado”."],"c":3},{"id":"s02q39","d":"E","t":"Diversidade e inclusão (Guia ANS)","e":"Segundo o Guia ANS de Diversidade e Inclusão, a diferença entre diversidade e inclusão é que","x":"Para o Guia, diversidade é a presença de pessoas diferentes, que deve ser promovida e não apenas tolerada. Inclusão é a etapa seguinte: garantir que todos tenham acesso às mesmas oportunidades de desenvolvimento e ascensão.","o":["a diversidade é a presença de pessoas diferentes, e a inclusão garante a todos o acesso às mesmas oportunidades de desenvolvimento e ascensão.","a inclusão é a contratação de pessoas de um único grupo.","a diversidade deve ser apenas tolerada, e a inclusão, evitada.","os dois termos são sinônimos.","a inclusão se refere apenas à acessibilidade arquitetônica."],"c":0},{"id":"s02q40","d":"E","t":"Injúria racial","e":"Segundo o art. 2º-A da Lei nº 7.716/1989, incluído pela Lei nº 14.532/2023, a pena da injúria racial é aumentada de metade se o crime for cometido","x":"O parágrafo único do art. 2º-A prevê aumento de metade quando a injúria racial é cometida em concurso de duas ou mais pessoas. A pena base é reclusão de 2 a 5 anos e multa.","o":["contra pessoa estrangeira.","mediante concurso de duas ou mais pessoas.","por meio de carta escrita.","em horário noturno.","em local privado."],"c":1}],"texto":{"titulo":"Ouvir antes de responder","corpo":"Em qualquer balcão de atendimento, a pressa costuma ser a primeira conselheira. Diante de uma fila que cresce, o impulso é interromper a pessoa, adivinhar o que ela quer e oferecer uma resposta pronta. O resultado, muitas vezes, é o oposto do esperado: a conversa se alonga, o problema volta e a irritação aumenta.\nEscutar com atenção não significa perder tempo. Significa, ao contrário, ganhar precisão. Quem ouve até o fim identifica a necessidade real, evita encaminhamentos equivocados e transmite ao outro a sensação de ter sido levado a sério.\nNos serviços de saúde, essa habilidade tem peso ainda maior, pois quem procura atendimento costuma estar fragilizado. Para essas pessoas, ser ouvido já é parte do cuidado."},"tema":"Escuta e acolhimento"},{"n":3,"q":[{"id":"s03q01","d":"P","t":"Interpretação de texto","e":"O texto defende a ideia de que","x":"O 2º parágrafo afirma que 'é o registro que garante a continuidade'. O texto rejeita a ideia de que registrar bem é escrever muito ('É escrever o necessário'), mostra que o plantonista depende das anotações e considera a visão burocrática 'compreensível'.","tx":1,"o":["a visão dos formulários como burocracia é totalmente incompreensível.","o profissional do plantão seguinte pode dispensar as anotações anteriores.","registrar bem significa anotar o máximo possível de informações.","o registro adequado assegura a continuidade do cuidado entre os profissionais.","os formulários são obstáculos inevitáveis ao cuidado."],"c":3},{"id":"s03q02","d":"P","t":"Nexos","e":"No 2º parágrafo, a palavra *portanto* introduz uma relação de","x":"*Portanto* é conjunção conclusiva. Como o profissional não estava presente quando o paciente chegou, conclui-se que ele depende do que foi anotado. Pode ser trocada por *logo*, *por isso* ou *por conseguinte*.","tx":1,"o":["oposição.","conclusão.","concessão.","finalidade.","condição."],"c":1},{"id":"s03q03","d":"P","t":"Sentido figurado","e":"Na última frase do texto, a palavra *ponte* é empregada em sentido figurado para indicar que o registro","x":"Opondo 'obstáculo' a 'ponte', o texto mostra que o registro bem feito deixa de atrapalhar e passa a unir o que veio antes ao que vem depois no cuidado, como a passagem de plantão descrita no 2º parágrafo.","tx":1,"o":["dificulta a passagem de informações entre plantões.","substitui o contato direto entre profissional e paciente.","liga as etapas do cuidado e os profissionais que se sucedem no atendimento.","é uma estrutura física que conecta setores do hospital.","serve apenas para fins de fiscalização."],"c":2},{"id":"s03q04","d":"P","t":"Ortografia: porquês","e":"Assinale a alternativa em que a forma destacada está empregada **corretamente**.","x":"Usa-se *por que* em perguntas diretas ou indiretas (equivale a 'por qual razão'). *Porque* é explicativo ('faltou o laudo'), *porquê* é substantivo ('o porquê') e *por quê* aparece no fim da frase ('faltou por quê?').","o":["Você faltou ao plantão *porque*?","O exame foi cancelado *porquê* faltou o laudo.","*Por quê* o sistema parou de funcionar?","Ninguém soube explicar *por que* o exame foi cancelado.","Não entendi o *por que* da demora."],"c":3},{"id":"s03q05","d":"P","t":"Concordância nominal","e":"Assinale a alternativa **correta** quanto à concordância nominal.","x":"*Anexo* concorda com o substantivo (anexas as declarações). Sem artigo, usa-se 'É proibido entrada'. *Meio*, como advérbio, não varia (meio preocupada). *Bastante*, como adjetivo, varia (bastantes pacientes).","o":["Seguem anexas as declarações solicitadas.","Os documentos seguem anexo ao processo.","Havia bastante pacientes na fila de espera.","É proibida entrada de pessoas sem crachá.","Ela ficou meia preocupada com o resultado."],"c":0},{"id":"s03q06","d":"I","t":"Planilhas: funções","e":"As células B1 a B5 de uma planilha contêm, respectivamente, 4, 9, 2, 7 e 5. Qual é o resultado de `=MÁXIMO(B1:B5)-MÍNIMO(B1:B5)`?","x":"MÁXIMO retorna o maior valor (9) e MÍNIMO, o menor (2). A diferença é 9 − 2 = 7, que corresponde à amplitude dos dados.","o":["2","5","7","9","27"],"c":2},{"id":"s03q07","d":"I","t":"Planilhas: erros","e":"Ao dividir um valor por uma célula vazia ou que contém zero, o Excel exibe a mensagem de erro","x":"#DIV/0! indica divisão por zero ou por célula vazia. #N/D aparece quando um valor não é encontrado (comum no PROCV); #REF!, quando a referência é inválida; #NOME?, quando o nome da função é digitado errado. ###### indica apenas coluna estreita demais.","o":["#NOME?","######","#N/D","#DIV/0!","#REF!"],"c":3},{"id":"s03q08","d":"I","t":"Microsoft 365","e":"No Microsoft 365, o Salvamento Automático dos arquivos do Word e do Excel fica disponível quando o arquivo está","x":"O Salvamento Automático funciona com arquivos armazenados no OneDrive ou no SharePoint, salvando as alterações continuamente na nuvem. Nos arquivos locais, o salvamento continua manual.","o":["salvo apenas em um pen drive.","armazenado no OneDrive ou no SharePoint.","salvo na área de trabalho, sem conexão com a nuvem.","anexado a um e-mail ainda não enviado.","aberto em modo somente leitura."],"c":1},{"id":"s03q09","d":"I","t":"Segurança: ameaças","e":"Um funcionário baixou um “jogo gratuito” que, além de funcionar normalmente, executava funções maliciosas ocultas no computador. Esse tipo de ameaça é o","x":"O cavalo de troia (trojan) aparenta ser um programa útil ou inofensivo, mas executa ações maliciosas escondidas. O worm se propaga sozinho; o adware exibe propaganda; spoofing é falsificação de remetente ou endereço; phishing é a isca para obter dados.","o":["cavalo de troia.","worm.","adware.","spoofing.","phishing."],"c":0},{"id":"s03q10","d":"I","t":"Segurança: autenticação","e":"A verificação em duas etapas aumenta a segurança de uma conta porque","x":"A autenticação em dois fatores exige um segundo elemento além da senha, como um código no celular, um token ou a biometria. Assim, a senha descoberta sozinha não basta para o acesso. Ela não substitui outras medidas de segurança.","o":["dispensa o uso de senha.","substitui a necessidade de atualizar o sistema.","impede o recebimento de e-mails falsos.","criptografa todos os arquivos do computador.","combina algo que o usuário sabe (senha) com algo que ele tem ou é (celular, token, biometria)."],"c":4},{"id":"s03q11","d":"R","t":"Negação da condicional","e":"A negação de “Se o paciente está em jejum, então a coleta será feita” é:","x":"A negação de p → q é p ∧ ~q: mantém-se a primeira parte, usa-se 'e' e nega-se a segunda. A contrapositiva e 'não p ou q' são equivalentes à frase original, e não sua negação.","o":["O paciente não está em jejum e a coleta será feita.","Se a coleta não for feita, então o paciente não está em jejum.","Se o paciente não está em jejum, então a coleta não será feita.","O paciente não está em jejum ou a coleta será feita.","O paciente está em jejum e a coleta não será feita."],"c":4},{"id":"s03q12","d":"R","t":"Quantificadores","e":"A negação de “Nenhum acompanhante entrou sem crachá” é:","x":"A negação de 'Nenhum A é B' é 'Algum A é B'. Basta um acompanhante ter entrado sem crachá para que a afirmação original seja falsa.","o":["Todos os acompanhantes entraram com crachá.","Algum acompanhante entrou sem crachá.","Nenhum acompanhante entrou com crachá.","Algum acompanhante não entrou sem crachá.","Todos os acompanhantes entraram sem crachá."],"c":1},{"id":"s03q13","d":"R","t":"Divisão proporcional","e":"Uma verba de R$ 12.000,00 será dividida entre três setores, em partes diretamente proporcionais ao número de funcionários de cada um: 2, 3 e 5. O setor com mais funcionários receberá","x":"Total de partes: 2 + 3 + 5 = 10. Cada parte vale 12.000 ÷ 10 = R$ 1.200,00. O setor com 5 funcionários recebe 5 × 1.200 = R$ 6.000,00 (os demais recebem R$ 2.400,00 e R$ 3.600,00).","o":["R$ 2.400,00","R$ 3.600,00","R$ 4.000,00","R$ 5.000,00","R$ 6.000,00"],"c":4},{"id":"s03q14","d":"R","t":"Calendário e ciclos","e":"Um vigilante trabalha um dia e folga três, repetindo esse ciclo. Ele trabalhou no dia 2 de um mês de 31 dias. Quantos plantões ele fará nesse mês?","x":"O ciclo tem 4 dias, então os plantões caem nos dias 2, 6, 10, 14, 18, 22, 26 e 30. O próximo seria o dia 34, que já está fora do mês. São 8 plantões.","o":["6","7","8","9","10"],"c":2},{"id":"s03q15","d":"R","t":"Associação lógica","e":"Lia, Rui e Téo trabalham na recepção, no almoxarifado e na ouvidoria, um em cada setor. Rui não trabalha na recepção nem no almoxarifado. Lia não trabalha na recepção. É correto afirmar que","x":"Rui só pode estar na ouvidoria. Lia não está na recepção e a ouvidoria já é de Rui, então Lia está no almoxarifado. Sobra a recepção para Téo.","o":["Lia trabalha na ouvidoria.","Téo trabalha na recepção.","Lia trabalha na recepção.","Téo trabalha no almoxarifado.","Rui trabalha no almoxarifado."],"c":1},{"id":"s03q16","d":"E","t":"SUS","e":"Segundo o art. 7º, IX, da Lei nº 8.080/1990, a descentralização político-administrativa do SUS ocorre com direção única em cada esfera de governo e","x":"O inciso IX prevê a descentralização com direção única em cada esfera, com ênfase na descentralização dos serviços para os municípios e com regionalização e hierarquização da rede de serviços.","o":["transferência da gestão para a iniciativa privada.","direção compartilhada entre os entes em cada esfera.","ênfase na descentralização dos serviços para os municípios.","ênfase na concentração dos serviços na União.","prioridade da gestão estadual sobre a municipal."],"c":2},{"id":"s03q17","d":"E","t":"SUS","e":"Segundo o art. 6º da Lei nº 8.080/1990, está incluída no campo de atuação do SUS a execução de ações de","x":"O art. 6º, I, inclui a execução de ações de vigilância sanitária, vigilância epidemiológica, saúde do trabalhador, assistência terapêutica integral (inclusive farmacêutica) e saúde bucal, entre outras.","o":["assistência terapêutica integral, inclusive farmacêutica.","fiscalização de tributos federais.","previdência complementar dos trabalhadores.","segurança pública e defesa civil, exclusivamente.","concessão de crédito a estabelecimentos de saúde."],"c":0},{"id":"s03q18","d":"E","t":"Direitos dos usuários","e":"Segundo a Carta dos Direitos dos Usuários da Saúde, o acesso aos serviços de saúde deve ocorrer preferencialmente","x":"O 1º princípio da Carta prevê o acesso preferencial pela Atenção Básica (unidades básicas de saúde), articulada aos demais níveis por referência e contrarreferência. Em urgência e emergência, porém, qualquer serviço deve receber e cuidar da pessoa.","o":["pelos serviços de Atenção Básica, integrados aos demais níveis de atenção.","pelos serviços de emergência, em qualquer situação.","pelos hospitais de alta complexidade.","por meio de convênio com planos privados.","por indicação do Conselho Municipal de Saúde."],"c":0},{"id":"s03q19","d":"E","t":"Direitos dos usuários","e":"Segundo a Carta dos Direitos dos Usuários da Saúde, o consentimento livre, voluntário e esclarecido para procedimentos diagnósticos, preventivos ou terapêuticos","x":"A Carta assegura o consentimento livre e esclarecido e permite revogá-lo a qualquer tempo, sem punição ou prejuízo. O usuário também pode indicar um representante para decidir quando não puder manifestar sua vontade.","o":["só é exigido em procedimentos cirúrgicos de grande porte.","é dispensado quando o usuário for atendido pelo SUS.","pode ser revogado a qualquer tempo, sem que isso implique punição ou prejuízo ao usuário.","deve ser dado exclusivamente pelo familiar mais próximo.","é irrevogável depois de assinado."],"c":2},{"id":"s03q20","d":"E","t":"HumanizaSUS","e":"No método da tríplice inclusão da PNH, a inclusão dos diferentes sujeitos (gestores, trabalhadores e usuários) nos processos de análise e decisão busca produzir","x":"Incluir gestores, trabalhadores e usuários nos espaços de decisão é o primeiro eixo da tríplice inclusão e visa produzir autonomia, protagonismo e corresponsabilidade, em coerência com os princípios da política.","o":["autonomia, protagonismo e corresponsabilidade.","padronização rígida das condutas, sem diálogo.","redução da participação dos usuários.","substituição dos trabalhadores por sistemas automatizados.","centralização das decisões na direção."],"c":0},{"id":"s03q21","d":"E","t":"HumanizaSUS","e":"Na clínica ampliada, o conjunto de propostas de condutas terapêuticas articuladas para um sujeito individual ou coletivo, construído pela equipe com participação do usuário, denomina-se","x":"O Projeto Terapêutico Singular (PTS) é um dispositivo da clínica ampliada, que considera a singularidade do sujeito. O Plano de Segurança do Paciente é da RDC 36/2013, e o PCMSO é programa de saúde ocupacional (NR 7).","o":["Projeto Terapêutico Singular.","Protocolo de Classificação de Risco.","Contrato de Gestão.","Plano de Segurança do Paciente.","Programa de Controle Médico de Saúde Ocupacional."],"c":0},{"id":"s03q22","d":"E","t":"Segurança do paciente","e":"O Programa Nacional de Segurança do Paciente, instituído pela Portaria GM/MS nº 529/2013, tem como objetivo geral","x":"O objetivo geral do PNSP é contribuir para a qualificação do cuidado em todos os estabelecimentos de saúde do país, públicos e privados. Entre os objetivos específicos estão envolver pacientes e familiares e incluir o tema no ensino.","o":["fiscalizar exclusivamente os hospitais privados.","punir os profissionais envolvidos em eventos adversos.","substituir as ações da vigilância sanitária.","contribuir para a qualificação do cuidado em saúde em todos os estabelecimentos de saúde do território nacional.","reduzir os custos de internação dos hospitais públicos."],"c":3},{"id":"s03q23","d":"E","t":"Segurança do paciente","e":"Segundo a RDC Anvisa nº 36/2013, compete ao Núcleo de Segurança do Paciente","x":"Entre as competências do NSP (art. 7º) estão elaborar, implantar, divulgar e manter atualizado o PSP, implantar protocolos, promover capacitações e notificar eventos adversos. O núcleo segue a lógica da cultura de segurança, sem caráter punitivo.","o":["credenciar fornecedores de medicamentos.","substituir a direção do serviço nas decisões administrativas.","elaborar, implantar, divulgar e manter atualizado o Plano de Segurança do Paciente.","definir a remuneração dos profissionais de saúde.","aplicar sanções disciplinares ao profissional que cometeu o erro."],"c":2},{"id":"s03q24","d":"E","t":"NR 32","e":"Considere as condutas a seguir em postos de trabalho com possibilidade de exposição a agentes biológicos.","x":"A NR 32 veda fumar e consumir alimentos e bebidas nos postos de trabalho. O uso de luvas e de outros EPIs adequados ao risco é uma medida de proteção prevista na norma, e não uma vedação.","af":["Fumar no posto de trabalho.","Consumir alimentos e bebidas no posto de trabalho.","Utilizar luvas durante procedimentos com risco de contato com material biológico."],"o":["Apenas I.","Apenas III.","Apenas I e II.","Apenas I e III.","Apenas II e III."],"c":2},{"id":"s03q25","d":"E","t":"NR 32","e":"Segundo a NR 32, em toda ocorrência de acidente envolvendo riscos biológicos deve ser emitida a Comunicação de Acidente de Trabalho (CAT)","x":"A CAT deve ser emitida em todo acidente com risco biológico, com ou sem afastamento. O registro garante o acompanhamento do trabalhador e seus direitos caso haja soroconversão futura.","o":["apenas se houver afastamento superior a 15 dias.","somente se o trabalhador desenvolver doença.","somente a pedido do trabalhador.","apenas quando o acidente envolver perfurocortante.","com ou sem afastamento do trabalhador."],"c":4},{"id":"s03q26","d":"E","t":"Ética no serviço público","e":"Segundo o item VI do Código de Ética, a função pública integra-se na vida particular de cada servidor, de modo que os fatos e atos verificados na conduta do dia a dia em sua vida privada","x":"O Código entende a função pública como exercício profissional que se integra à vida particular. Por isso, a conduta na vida privada pode acrescer ou diminuir o bom conceito do servidor na vida funcional.","o":["são protegidos de qualquer avaliação ética.","poderão acrescer ou diminuir o seu bom conceito na vida funcional.","não têm nenhuma repercussão na vida funcional.","só interessam à Comissão de Ética se ocorrerem no horário de trabalho.","dependem de autorização da chefia para serem considerados."],"c":1},{"id":"s03q27","d":"E","t":"Ética no serviço público","e":"Um servidor retarda propositalmente a entrega da cópia de prontuário solicitada por um paciente, criando exigências que não estão previstas nas normas. Segundo o Código de Ética, essa conduta","x":"O item XV, d, veda usar de artifícios para procrastinar ou dificultar o exercício regular de direito por qualquer pessoa. O acesso e a cópia do prontuário são direitos do usuário previstos na Carta dos Direitos.","o":["depende de autorização do paciente para ser avaliada.","configura apenas excesso de zelo, sem relevância ética.","é permitida, desde que o paciente aguarde em silêncio.","é vedada, por constituir artifício para procrastinar ou dificultar o exercício regular de direito.","é dever do servidor para proteger os documentos."],"c":3},{"id":"s03q28","d":"E","t":"LGPD","e":"Segundo a LGPD, é exemplo de dado pessoal **sensível**","x":"O dado biométrico, vinculado a uma pessoa natural, é sensível (art. 5º, II), assim como os dados de saúde, genéticos, de origem racial ou étnica, religião, opinião política, filiação sindical e vida sexual. E-mail, telefone, endereço e CPF são dados pessoais comuns.","o":["o número de telefone do acompanhante.","o número do CPF.","o endereço de e-mail do paciente.","o endereço residencial do funcionário.","a impressão digital usada para controle de acesso ao setor."],"c":4},{"id":"s03q29","d":"E","t":"LGPD","e":"Segundo o art. 18 da LGPD, é direito do titular obter do controlador","x":"O art. 18 prevê, entre outros, confirmação e acesso, correção, anonimização, bloqueio ou eliminação, portabilidade, informação sobre uso compartilhado, informação sobre a possibilidade de não consentir e revogação do consentimento. O titular não tem direito aos dados de outras pessoas.","o":["a remuneração pela utilização de seus dados.","informação das entidades públicas e privadas com as quais o controlador realizou uso compartilhado de dados.","a exclusão de dados de terceiros que o mencionem.","o acesso aos dados pessoais de outros pacientes.","indenização automática por qualquer tratamento."],"c":1},{"id":"s03q30","d":"E","t":"Almoxarifado e estoques","e":"Um item tem estoque de segurança de 80 unidades e é comprado em lotes de 320 unidades. O estoque máximo é de","x":"Estoque máximo = estoque de segurança + lote de compra = 80 + 320 = 400 unidades. O estoque médio seria ES + Q/2 = 80 + 160 = 240.","o":["160 unidades","240 unidades","320 unidades","400 unidades","480 unidades"],"c":3},{"id":"s03q31","d":"E","t":"Almoxarifado e estoques","e":"Pelos critérios da Portaria STN nº 448/2002, copos de vidro e lâmpadas são classificados como material de consumo pelo critério da","x":"Pelo critério da fragilidade, é de consumo o material cuja estrutura é quebradiça ou deformável, com perda total ou de sua identidade. Perecibilidade refere-se a deterioração química ou física, como em medicamentos e alimentos.","o":["perecibilidade.","incorporabilidade.","fragilidade.","transformabilidade.","durabilidade."],"c":2},{"id":"s03q32","d":"E","t":"ECA","e":"Segundo o art. 12 do ECA, nos casos de internação de criança ou adolescente, os estabelecimentos de atendimento à saúde deverão proporcionar condições para a permanência em tempo integral de um dos pais ou responsável,","x":"Com a redação da Lei 13.257/2016, o art. 12 garante a permanência em tempo integral de um dos pais ou responsável, inclusive nas UTIs neonatais e pediátricas e nas unidades de cuidados intermediários.","o":["apenas para crianças de até seis anos.","inclusive nas unidades neonatais, de terapia intensiva e de cuidados intermediários.","exceto nas unidades de terapia intensiva.","desde que haja autorização judicial.","somente durante o horário de visitas."],"c":1},{"id":"s03q33","d":"E","t":"ECA","e":"Segundo o art. 14 do ECA, a vacinação das crianças nos casos recomendados pelas autoridades sanitárias é","x":"O § 1º do art. 14 determina que é obrigatória a vacinação das crianças nos casos recomendados pelas autoridades sanitárias. O SUS promove programas de prevenção das enfermidades que ordinariamente afetam a população infantil.","o":["obrigatória.","proibida sem autorização judicial.","facultativa, a critério dos pais.","recomendada somente a partir dos 12 anos.","obrigatória apenas em escolas públicas."],"c":0},{"id":"s03q34","d":"E","t":"Estatuto da Pessoa Idosa","e":"A Lei nº 14.423/2022 alterou a Lei nº 10.741/2003 para","x":"A Lei 14.423/2022 trocou, em toda a lei, 'idoso' por 'pessoa idosa', e o nome passou a ser Estatuto da Pessoa Idosa. A idade de referência continua sendo 60 anos ou mais.","o":["reduzir para 55 anos a idade da pessoa idosa.","substituir, em todo o texto, as expressões “idoso” e “idosos” por “pessoa idosa” e “pessoas idosas”.","criar o Conselho Tutelar da Pessoa Idosa.","extinguir a prioridade especial dos maiores de 80 anos.","revogar os crimes previstos no Estatuto."],"c":1},{"id":"s03q35","d":"E","t":"Estatuto da Pessoa Idosa","e":"Segundo o art. 17 do Estatuto, à pessoa idosa que esteja no domínio de suas faculdades mentais é assegurado o direito de","x":"O art. 17 garante à pessoa idosa no domínio de suas faculdades mentais a escolha do tratamento. Se ela não puder optar, decidem, nesta ordem: o curador (se interditada), os familiares, o médico em iminente risco de vida ou, sem curador nem familiar conhecido, o médico, que comunicará o Ministério Público.","o":["transferir ao médico, obrigatoriamente, todas as decisões.","dispensar a apresentação de documentos em qualquer serviço.","ser tratada sem consentimento quando a família desejar.","optar pelo tratamento de saúde que lhe for reputado mais favorável.","exigir internação em qualquer hospital privado."],"c":3},{"id":"s03q36","d":"E","t":"LBI","e":"Segundo a LBI, a comunicação, como forma de interação dos cidadãos, abrange, entre outros,","x":"O art. 3º, V, adota um conceito amplo de comunicação: línguas (inclusive Libras), visualização de textos, Braille, comunicação tátil, caracteres ampliados, dispositivos multimídia, linguagem simples, sistemas auditivos e meios de voz digitalizados, entre outros.","o":["as línguas, inclusive a Língua Brasileira de Sinais (Libras), o Braille, a comunicação tátil e a linguagem simples.","apenas a língua portuguesa escrita.","exclusivamente a comunicação oral.","somente os meios de comunicação de massa.","apenas os documentos oficiais impressos."],"c":0},{"id":"s03q37","d":"E","t":"LBI","e":"Segundo o art. 12 da LBI, para a realização de tratamento, procedimento, hospitalização e pesquisa científica envolvendo pessoa com deficiência, é indispensável","x":"A LBI garante a autonomia da pessoa com deficiência. O art. 12 exige seu consentimento prévio, livre e esclarecido, e o art. 11 proíbe obrigá-la a intervenção clínica ou cirúrgica, tratamento ou institucionalização forçada.","o":["a autorização do Conselho Tutelar.","a autorização exclusiva do diretor do hospital.","o consentimento da família, mesmo contra a vontade da pessoa.","o consentimento prévio, livre e esclarecido da pessoa com deficiência.","a decisão de equipe médica, dispensado o consentimento."],"c":3},{"id":"s03q38","d":"E","t":"Comunicação Não-Violenta","e":"Segundo a Comunicação Não-Violenta, qual frase é uma **observação** sem avaliação?","x":"A observação descreve fatos concretos, delimitados no tempo e verificáveis, como os que uma câmera registraria. Rótulos ('desorganizado') e generalizações ('nunca', 'sempre', 'ninguém') são avaliações, que costumam gerar defesa em vez de diálogo.","o":["“Você sempre chega atrasado.”","“Você é desorganizado.”","“Esta recepção nunca funciona.”","“Ninguém aqui se importa com o paciente.”","“Hoje, às 10h, três pacientes aguardavam sem senha.”"],"c":4},{"id":"s03q39","d":"E","t":"Diversidade e inclusão (Guia ANS)","e":"Ao selecionar candidatos, um gestor tende a preferir pessoas parecidas com ele, sem perceber que age assim. Segundo o Guia ANS de Diversidade e Inclusão, esse fenômeno é chamado de","x":"O viés inconsciente é um preconceito não percebido que cria estereótipos e leva a pré-julgamentos e discriminação. O Guia recomenda igualdade de oportunidades nos processos seletivos para enfrentá-lo.","o":["inclusão.","ação afirmativa.","letramento.","representatividade.","viés inconsciente."],"c":4},{"id":"s03q40","d":"E","t":"Injúria racial","e":"Por ser considerada crime de racismo após a Lei nº 14.532/2023, a injúria racial é, nos termos do art. 5º, XLII, da Constituição Federal,","x":"A Constituição determina que a prática do racismo é crime inafiançável e imprescritível, sujeito à pena de reclusão. Com a Lei 14.532/2023, a injúria racial passou à Lei 7.716/1989 como crime de racismo, de ação penal pública incondicionada.","o":["de ação penal privada.","punida apenas com multa.","afiançável e prescritível em quatro anos.","contravenção penal.","inafiançável e imprescritível, sujeita à pena de reclusão."],"c":4}],"texto":{"titulo":"O valor do registro","corpo":"Há quem veja nos formulários apenas burocracia. Campos a preencher, assinaturas a colher, carimbos a conferir: tudo pareceria um obstáculo entre o paciente e o cuidado de que ele precisa. Essa visão, embora compreensível, ignora uma função essencial do registro.\nÉ o registro que garante a continuidade. O profissional que assume o plantão não estava presente quando o paciente chegou; depende, portanto, do que foi anotado por outros. Uma informação omitida pode obrigar a repetir exames, atrasar decisões ou, no pior dos casos, provocar erros.\nRegistrar bem não é escrever muito. É escrever o necessário, de forma clara, no momento certo. Quando isso acontece, o papel deixa de ser obstáculo e passa a ser ponte."},"tema":"Registro e continuidade do cuidado"},{"n":4,"q":[],"tema":"Envelhecimento e atendimento","lock":1},{"n":5,"q":[],"tema":"Tecnologia e inclusão","lock":1},{"n":6,"q":[],"tema":"Saúde de quem cuida","lock":1},{"n":7,"q":[],"tema":"Resíduos e sustentabilidade","lock":1},{"n":8,"q":[],"tema":"Filas e tempo de espera","lock":1},{"n":9,"q":[],"tema":"Trabalho em equipe","lock function evaluate(qs,ans){

  if(a==null)blank++;else if(a===q.c){ok++;by[q.d][0]++;tp[q.t][0]++}});
 const full=qs.length===40;
 const nota=ok*0.25;
 let pass=null,why=[];
 if(full){if(ok<24)why.push(`menos de 24 acertos (nota mínima 6,00)`);["P","I","R"].forEach(d=>{if(by[d][0]<2)why.push(`menos de 2 acertos em ${DISC[d]}`)});pass=why.length===0}
 return{ok,blank,total:qs.length,nota,by,tp,pass,why}
}

 if(!ids.length)h+=`<div class="empty"><div class="pf" style="font-size:40px;color:var(--gold)">✓</div><p>Nenhuma questão errada salva.<br>As questões que você errar nos simulados e treinos aparecem aqui.</p></div>`;
 else{const by={};ids.forEach(id=>{const d=QBYID[id].d;by[d]=(by[d]||0)+1});
  h+=`<div class="card" style="margin-top:18px"><table class="tbl">${DORD.filter(d=>by[d]).map(d=>`<tr><td>${DISC[d]}</td><td>${by[d]}</td></tr>`).join('')}</table></div><div class="note">Ao acertar uma questão aqui, ela sai da lista.</div><button class="btn" onclick="APP.erstart()">Refazer ${Math.min(ids.length,40)} questões</button>`}
 h+=`</div>`;$('#app').innerHTML=h
}
function erStart(){const ids=shuffle(Object.keys(ST.wrong).filter(id=>QBYID[id])).slice(0,40);ST.att.erradas={sim:0,qs:ids,ans:Array(ids.length).fill(null),fl:{},mode:'estudo',left:0,cur:0,done:false,ts:Date.now()};save();go('#q/erradas/0')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- ROUTER ---------- */
function route(){
 closeSheet();
 const h=location.hash.slice(1).split('/');
 if(h[0]==='sim')return intro(+h[1]);
 if(h[0]==='q')return quiz(h[1],+h[2]);
 if(h[0]==='res')return result(h[1]);
 if(h[0]==='treino')return treino();
 if(h[0]==='erradas')return erradas();
 home()
}
async function onPedir(e){
 e.preventDefault();const f=e.target,b=f.querySelector('button');const d=Object.fromEntries(new FormData(f));
 d.email=d.email.trim().toLowerCase();b.disabled=true;b.textContent='Enviando...';
 try{await pedir(d);lsSet('po_email',d.email);const ce=document.querySelector('form input[name=codigo]');if(ce&&!ce.form.email.value)ce.form.email.value=d.email;const c=$('#pedido');if(c)c.innerHTML=`<b>Pedido enviado ✓</b><p style="color:var(--tx2);margin:6px 0 12px;font-size:14px">Para agilizar, avise no WhatsApp. Assim que a compra for confirmada, o código chega em <b>${esc(d.email)}</b>${d.whatsapp?' ou no seu WhatsApp':''}. Depois é só digitar no campo abaixo.</p><a class="btn" style="background:#25d366;text-decoration:none" href="${waLink(`Olá! Acabei de comprar sua apostila e quero fazer os simulados. Pode enviar o código?\nNome: ${d.nome}\nE-mail: ${d.email}`)}" target="_blank" rel="noopener">${WAI}Avisar no WhatsApp</a>`}
 catch(err){toast(err.message);b.disabled=false;b.textContent='Pedir liberação'}
}
async function onLiberar(e,n){
 e.preventDefault();const f=e.target,b=f.querySelector('button');const d=Object.fromEntries(new FormData(f));
 const email=d.email.trim().toLowerCase(),codigo=d.codigo.trim().toUpperCase();b.disabled=true;b.textContent='Verificando...';
 try{await liberar(email,codigo);lsSet('po_email',email);toast('Simulados liberados!');intro(n)}
 catch(err){toast(err.message);b.disabled=false;b.textContent='Liberar simulados'}
}
window.APP={pedir:onPedir,liberar:onLiberar,igok:()=>lsSet("po_ig_hide","1"),igx:()=>{lsSet("po_ig_hide","1");const e=document.getElementById("igc");if(e)e.remove()},go,start:startSim,restart,mode:(m,n)=>{chosenMode=m;intro(n)},pick,flag,sheet,closeSheet,finish,rv:setRv,calc,
 cut:(e,k,i,x)=>{e.preventDefault();cutOpt(k,i,x)},
 trd:d=>{trD=trD.includes(d)?trD.filter(x=>x!==d):trD.concat(d);if(!trD.length)trD=[d];trT=null;treino()},trt:t=>{trT=t||null;treino()},trn:n=>{trN=n;treino()},trstart:trStart,erstart:erStart};
route();
})();
</script>
