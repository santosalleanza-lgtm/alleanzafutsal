:root{
 --bg:#0b0b0c;--s1:#151517;--s2:#1d1d21;--s3:#26262b;--line:#2e2e34;
 --tx:#f3eee2;--tx2:#b8b1a0;--tx3:#8a8475;
 --gold:#e6c34a;--gold2:#c9a227;--goldbg:rgba(230,195,74,.12);
 --ok:#4cbf7a;--okbg:rgba(76,191,122,.14);--bad:#e26a6a;--badbg:rgba(226,106,106,.14);
 --r:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + var(--safe-b))}
h1,h2,h3{margin:0;line-height:1.15}
.pf{font-family:"PF",Georgia,serif;font-weight:900;letter-spacing:-.01em}
.pf,.stat b,.sim .n,.score .big,.calc .tot,.rv .hd b,.qhead .num,.brand .b2{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
.top{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.top .in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{color:var(--tx3);font-size:12px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--s2);flex:none}
.ib svg{width:20px;height:20px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px}
.brand .b1{font-size:9px;letter-spacing:.3em;color:#d9cfb2;font-weight:700}
.brand .b2{font-family:"PF",Georgia,serif;font-weight:900;font-size:20px;color:var(--gold);line-height:.95}
.hero{margin:18px 0 8px;padding:22px 20px;border-radius:22px;background:radial-gradient(120% 120% at 100% 0%,rgba(201,162,39,.28),transparent 55%),var(--s1);border:1px solid rgba(201,162,39,.28)}
.hero .k{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:800}
.hero h1{font-size:30px;margin:6px 0 6px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{margin:0;color:var(--tx2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(0,0,0,.35);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:"PF",Georgia,serif;font-size:22px;color:var(--gold)}
.stat span{font-size:11px;color:var(--tx3);line-height:1.2;display:block}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:18px}
.sec span{font-size:12px;color:var(--tx3)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:84px}
.qa b{display:block;font-size:15px;margin-bottom:2px}
.qa span{font-size:12px;color:var(--tx3)}
.qa i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--goldbg);color:var(--gold);margin-bottom:8px;font-weight:800}
.list{display:grid;gap:10px}
.sim{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;width:100%}
.sim .n{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:"PF",Georgia,serif;font-size:20px;background:var(--s3);color:var(--gold)}
.sim .m{flex:1;min-width:0}
.sim .m b{display:block;font-size:15px}
.sim .m span{font-size:12px;color:var(--tx3)}
.sim .r{flex:none;text-align:right;font-size:12px;color:var(--tx3)}
.sim .r b{display:block;font-size:17px;color:var(--tx)}
.sim.done .n{background:var(--gold);color:#111}
.btn svg{width:22px;height:22px}
.frm{display:grid;gap:10px;margin-top:12px}
.frm input{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--tx);padding:0 14px;font:inherit;font-size:16px}
.frm input:focus{outline:2px solid var(--gold);outline-offset:1px}
.sim.lk{opacity:.62}.sim.lk .n{background:var(--s2);color:var(--tx3);font-size:18px}
.sim.prog .n{box-shadow:inset 0 0 0 2px var(--gold)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--s3);color:var(--tx2)}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.g{background:var(--goldbg);color:var(--gold)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;font-weight:800;font-size:16px;background:linear-gradient(135deg,#f3d873,#c9a227);color:#111}
.btn.sec2{background:var(--s2);color:var(--tx);font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx);font-weight:700}
.btn:disabled{opacity:.45}
.mode{display:grid;gap:10px;margin:16px 0}
.mo{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:var(--r);background:var(--s1);border:2px solid var(--line);width:100%}
.mo.on{border-color:var(--gold);background:var(--goldbg)}
.mo .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--tx3);margin-top:2px}
.mo.on .dot{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 45%,transparent 50%)}
.mo b{display:block}
.mo span{font-size:13px;color:var(--tx2)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.info div{background:var(--s2);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--tx3)}
.info b{display:block;color:var(--tx);font-size:15px}
.note{font-size:13px;color:var(--tx2);background:var(--s2);border-left:3px solid var(--gold);padding:10px 12px;border-radius:8px;margin:12px 0}
/* quiz */
.qbar{height:4px;background:var(--s3)}
.qbar i{display:block;height:100%;background:var(--gold);transition:width .25s}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--s2);color:var(--gold)}
.timer.low{color:var(--bad)}
.qhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;gap:8px}
.qhead .num{font-family:"PF",Georgia,serif;font-size:26px;color:var(--gold)}
.qhead .num small{font-family:inherit;font-size:14px;color:var(--tx3);font-weight:400}
.flag{padding:8px 12px;border-radius:10px;background:var(--s2);font-size:13px;font-weight:700;color:var(--tx2)}
.flag.on{background:var(--goldbg);color:var(--gold)}
.txt{background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.txt summary{list-style:none;padding:12px 14px;font-weight:700;font-size:14px;color:var(--gold);display:flex;justify-content:space-between}
.txt summary::-webkit-details-marker{display:none}
.txt .body{padding:0 16px 14px;font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.65;color:#e9e3d3}
.txt .body p{margin:0 0 10px;text-indent:1.2em}
.txt .body small{display:block;color:var(--tx3);font-family:inherit;font-size:12px;text-indent:0}
.enun{font-size:17px;line-height:1.55;margin:0 0 14px;white-space:pre-line}
.af{margin:-4px 0 14px;display:grid;gap:8px}
.af div{background:var(--s1);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.45}
.af b{color:var(--gold);margin-right:6px}
.opts{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px;border-radius:14px;background:var(--s1);border:2px solid var(--line);font-size:15.5px;line-height:1.45;min-height:56px}
.op .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s3);font-weight:800;font-size:14px;color:var(--tx2)}
.op.sel{border-color:var(--gold);background:var(--goldbg)}
.op.sel .l{background:var(--gold);color:#111}
.op.right{border-color:var(--ok);background:var(--okbg)}
.op.right .l{background:var(--ok);color:#06210f}
.op.wrong{border-color:var(--bad);background:var(--badbg)}
.op.wrong .l{background:var(--bad);color:#2a0808}
.op.cut{opacity:.38;text-decoration:line-through}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;background:var(--s2);border-left:4px solid var(--gold);font-size:15px;line-height:1.55}
.exp .h{font-weight:800;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.exp .h.ok{color:var(--ok)}.exp .h.bad{color:var(--bad)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,11,12,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b))}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}

.sheet .pn{width:100%;max-width:640px;margin:0 auto;background:var(--s1);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + var(--safe-b));max-height:82vh;overflow:auto}
.sheet h3{font-size:16px;margin-bottom:4px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx3);margin:6px 0 12px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dots{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.dots button{aspect-ratio:1;border-radius:10px;background:var(--s3);font-weight:700;font-size:13px;color:var(--tx2);position:relative}
.dots button.a{background:var(--gold);color:#111}
.dots button.ok{background:var(--ok);color:#06210f}
.dots button.bad{background:var(--bad);color:#2a0808}
.dots button.cur{outline:2px solid #fff;outline-offset:2px}
.dots button.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#ff9f1c}
.dsep{grid-column:1/-1;font-size:11px;letter-spacing:.12em;color:var(--tx3);font-weight:700;margin-top:6px}
/* result */
.score{text-align:center;padding:26px 18px;border-radius:22px;background:radial-gradient(120% 100% at 50% 0%,rgba(201,162,39,.25),transparent 60%),var(--s1);border:1px solid rgba(201,162,39,.3);margin-top:18px}
.score .big{font-family:"PF",Georgia,serif;font-size:64px;line-height:1;color:var(--gold)}
.score .big small{font-size:24px;color:var(--tx3)}
.score .st{margin:10px 0 4px;font-weight:800;font-size:18px}
.score .st.ok{color:var(--ok)}.score .st.bad{color:var(--bad)}
.score p{margin:4px 0 0;color:var(--tx2);font-size:14px}
.bars{display:grid;gap:14px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}

.bar .tr{height:10px;border-radius:6px;background:var(--s3);overflow:hidden}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.calc{display:grid;gap:10px}
.calc input[type=range]{width:100%;accent-color:#e6c34a}
.calc .row{display:flex;justify-content:space-between;font-size:14px;color:var(--tx2)}
.calc .tot{font-family:"PF",Georgia,serif;font-size:36px;color:var(--gold);text-align:center}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:30px;background:var(--s2);font-size:14px;font-weight:700;color:var(--tx2);border:1px solid transparent}

.rv{margin-bottom:14px}

.rv .hd b{font-family:"PF",Georgia,serif;color:var(--gold);font-size:20px}
.empty{text-align:center;color:var(--tx3);padding:40px 10px}
.foot{margin:36px 0 10px;font-size:11px;color:var(--tx3);line-height:1.45;text-align:center}
.ig{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(230,195,74,.16),rgba(230,195,74,.04));border:1px solid rgba(230,195,74,.35);border-radius:var(--r);padding:14px 14px 14px 16px;margin-top:16px;position:relative}
.ig .ic{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--gold);color:#111}
.ig .ic svg{width:24px;height:24px}
.ig .tx{flex:1;min-width:0}.ig .tx b{display:block;font-size:15px}.ig .tx span{font-size:13px;color:var(--tx2)}
.ig a.go{flex:0 0 auto;background:var(--gold);color:#111;font-weight:700;font-size:14px;padding:9px 14px;border-radius:999px;text-decoration:none}
.ig .x{position:absolute;top:4px;right:6px;width:28px;height:28px;color:var(--tx3);font-size:18px;line-height:1}
.ig.dis{padding-right:34px}
.buy{display:flex;gap:14px;align-items:center;margin-top:16px;padding:14px;border-radius:var(--r);background:var(--s1);border:1px solid rgba(230,195,74,.45);text-decoration:none;color:inherit}
.buy .bk{flex:0 0 44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--goldbg);font-size:22px}
.buy .tx{flex:1;min-width:0}.buy .tx b{display:block;font-size:15px}.buy .tx span{display:block;font-size:13px;color:var(--tx2);line-height:1.4}
.buy .cta{flex:0 0 auto;background:linear-gradient(135deg,#f3d873,#c9a227);color:#111;font-weight:700;font-size:13px;padding:9px 12px;border-radius:999px}
.pc{display:grid;gap:10px}
.pt{display:flex;gap:14px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit}
.pt .lg{flex:0 0 48px;height:48px;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:17px;color:#111}
.pt .tx{flex:1;min-width:0}.pt .tx b{display:block;font-size:15px}.pt .tx span{display:block;font-size:13px;color:var(--tx2);line-height:1.4}
.pt .tx small{display:block;font-size:12px;color:var(--gold);margin-top:3px}
.pt .lg svg{width:32px;height:32px}
.pt .lg{overflow:hidden}.pt .lg img{width:100%;height:100%;object-fit:cover;display:block}
.pt .ar{color:var(--tx3);font-size:20px}
.pt.ad{border-style:dashed;border-color:rgba(230,195,74,.45);background:transparent}
.dev{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px auto 0;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--s1);color:var(--tx);text-decoration:none;font-size:14px;font-weight:600;width:max-content;max-width:100%}
.dev svg{width:18px;height:18px;color:#4cbf7a}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#f3eee2;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:12px;border-radius:12px;background:var(--s2);font-weight:800}
.seg button.on{background:var(--gold);color:#111}
.hint{font-size:12px;color:var(--tx3);text-align:center;margin-top:10px}
@media (min-width:700px){.dots{grid-template-columns:repeat(10,1fr)}}
</style>
