[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pastas de outros projetos que moram neste repositório: não publicar
# junto com o site institucional (cada uma tem o seu próprio site).
[[redirects]]
  from = "/simulados/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/gestao/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
