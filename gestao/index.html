/* ---------- Quadro de produção (quantidade por tipo + tamanho) ---------- */
function viewResumoProducao(){
  const resumo = resumoProducao();
  const blocos = Object.keys(TIPOS_PEDIDO).map(tipo=>{
    const info = TIPOS_PEDIDO[tipo];
    const tamanhos = resumo[tipo];
    const qtdTipo = Object.values(tamanhos).reduce((s,n)=>s+n,0);
    const corTipo = tipo==='uniforme' ? '#8fd6a8' : tipo==='agasalho' ? '#7dc4e0' : '#f0938d';
    const linhasTam = Object.keys(tamanhos).sort().map(tam=>
      `<div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;border-top:1px solid rgba(255,255,255,0.06);">
        <span style="color:var(--muted);">Tam. ${tam}</span><strong>${tamanhos[tam]}</strong>
      </div>`).join('');
    return `
      <div style="flex:1;min-width:200px;background:rgba(255,255,255,0.03);border:1px solid var(--line);border-radius:12px;padding:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <strong style="font-size:13px;color:${corTipo};">${info.label}</strong>
          <span style="font-family:'Playfair Display',serif;font-size:20px;font-weight:800;">${qtdTipo}</span>
        </div>
        ${linhasTam || '<div style="font-size:11.5px;color:var(--muted);">Nenhum pedido ainda</div>'}
      </div>`;
  }).join('');

  return `
    <div class="card" style="margin-bottom:18px;">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;">
        <strong style="font-size:14px;">📋 Quadro de produção — quantidade por tipo e tamanho</strong>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost btn-sm" id="btn-exportar-producao">⬇ Exportar (.txt)</button>
          <button class="btn btn-gold btn-sm" id="btn-enviar-producao">📲 Enviar pelo WhatsApp</button>
        </div>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">${blocos}</div>
      <p style="font-size:11px;color:var(--muted);margin-top:10px;margin-bottom:0;">Use esse quadro para saber se já bateu a quantidade mínima de cada peça antes de encaminhar pra produção.</p>
    </div>
  `;
}

function viewPedidos(){
  let lista = filtroLotePedido === 'sem-lote' ? pedidosSemLote()
    : filtroLotePedido ? pedidosDoLote(filtroLotePedido)
    : [...DB.pedidos];
  if(filtroTipoPedido) lista = lista.filter(p=>p.tipo===filtroTipoPedido);
  if(filtroStatusPedido) lista = lista.filter(p=>statusPagamentoPedido(p)===filtroStatusPedido);
  lista.sort((a,b)=> (b.dataPedido||'').localeCompare(a.dataPedido||''));

  const totalPedidos = DB.pedidos.length;
  const totalPendentes = DB.pedidos.filter(p=>statusPagamentoPedido(p)!=='pago').length;
  const valorTotal = DB.pedidos.reduce((s,p)=> s + TIPOS_PEDIDO[p.tipo].valor, 0);
  const valorRecebido = DB.pedidos.reduce((s,p)=> s + p.valorPago, 0);
  const valorAReceber = valorTotal - valorRecebido;
  const custoTotal = DB.pedidos.reduce((s,p)=> s + TIPOS_PEDIDO[p.tipo].custo, 0);
  const saldoAtual = valorRecebido - custoTotal;        // já recebido menos custo de produção de tudo
  const lucroProjetado = valorTotal - custoTotal;        // se todo mundo pagar
  const semLoteCount = pedidosSemLote().length;

  function nomeLote(loteId){
    const l = DB.lotes.find(x=>x.id===loteId);
    return l ? l.nome : null;
  }

  const rows = lista.map(p=>{
    const info = TIPOS_PEDIDO[p.tipo];
    const corTipo = p.tipo==='uniforme' ? '#8fd6a8' : p.tipo==='agasalho' ? '#7dc4e0' : '#f0938d';
    const detalhes = p.tipo==='torcedor'
      ? `Costas: ${p.costas||'—'} · Nº ${p.numero||'—'}`
      : (p.responsavel ? `Resp.: ${p.responsavel}` : '—');
    const stPgto = statusPagamentoPedido(p);
    const clsPgto = stPgto==='pago' ? 'pago' : stPgto==='parcial' ? 'isento' : 'pendente';
    const labelPgto = stPgto==='pago' ? 'PAGO' : stPgto==='parcial' ? `${fmtBRL(p.valorPago)}/${fmtBRL(info.valor)}` : 'PEND';
    const loteLabel = p.loteId ? (nomeLote(p.loteId) || 'Lote') : 'Novo';
    const temObs = p.observacao && p.observacao.trim();
    return `<tr>
      <td><strong>${p.nome}</strong></td>
      <td><span class="cat-badge" style="color:${corTipo};border-color:${corTipo}55;">${info.label}</span></td>
      <td>${p.tamanho}</td>
      <td class="resp-cell">${detalhes}</td>
      <td>${fmtBRL(info.valor)}</td>
      <td class="resp-cell">${fmtDataPedido(p.dataPedido)}</td>
      <td>
        <span class="mes-cell ${clsPgto}" data-edit-pgto-pedido="${p.id}" title="Toque para lançar/editar o valor pago">${labelPgto}</span>
      </td>
      <td>
        <span class="mes-cell ${p.statusEntrega==='entregue'?'pago':'pendente'}" data-toggle-pedido-entrega="${p.id}" title="Toque para alternar">${p.statusEntrega==='entregue'?'ENTREGUE':'PENDENTE'}</span>
      </td>
      <td><span class="cat-badge" style="${p.loteId?'':'border-color:rgba(201,162,74,0.5);color:var(--gold-light);'}">${loteLabel}</span></td>
      <td>
        <button class="icon-btn ${temObs?'':''}" style="${temObs?'background:rgba(201,162,74,0.18);border-color:rgba(201,162,74,0.4);':''}" data-editar-obs-pedido="${p.id}" title="${temObs ? p.observacao.replace(/"/g,'&quot;') : 'Adicionar observação'}">📝</button>
      </td>
      <td>
        <button class="icon-btn danger" data-remove-pedido="${p.id}" title="Remover pedido">🗑️</button>
      </td>
    </tr>`;
  }).join('');

  const lotesOrdenados = [...DB.lotes].sort((a,b)=> (b.dataFechamento||'').localeCompare(a.dataFechamento||''));
  const historicoLotes = lotesOrdenados.map(l=>{
    const pedidosLote = pedidosDoLote(l.id);
    const t = totaisPedidos(pedidosLote);
    const aberto = lotesAbertos.has(l.id);
    const rowsLote = pedidosLote.map(p=>{
      const info = TIPOS_PEDIDO[p.tipo];
      const stPgto = statusPagamentoPedido(p);
      const clsPgto = stPgto==='pago' ? 'pago' : stPgto==='parcial' ? 'isento' : 'pendente';
      const labelPgto = stPgto==='pago' ? 'PAGO' : stPgto==='parcial' ? `${fmtBRL(p.valorPago)}/${fmtBRL(info.valor)}` : 'PEND';
      return `<tr>
        <td><strong>${p.nome}</strong></td>
        <td><span class="cat-badge" style="font-size:10px;">${info.label}</span></td>
        <td>${p.tamanho}</td>
        <td><span class="mes-cell ${clsPgto}" data-edit-pgto-pedido="${p.id}" title="Toque para lançar/editar o valor pago">${labelPgto}</span></td>
        <td><button class="icon-btn" style="${p.observacao?'background:rgba(201,162,74,0.18);border-color:rgba(201,162,74,0.4);':''}" data-editar-obs-pedido="${p.id}" title="${p.observacao ? p.observacao.replace(/"/g,'&quot;') : 'Adicionar observação'}">📝</button></td>
      </tr>`;
    }).join('');
    return `
      <div class="card" style="margin-bottom:12px;">
        <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;" data-toggle-lote="${l.id}">
          <div>
            <strong style="font-size:13.5px;">${aberto?'▼':'▶'} ${l.nome}</strong>
            <div style="font-size:11px;color:var(--muted);margin-top:2px;">Fechado em ${fmtDataPedido(l.dataFechamento)} · ${t.qtd} pedido(s)</div>
          </div>
          <div style="display:flex;gap:14px;font-size:12px;">
            <span>Total: <strong>${fmtBRL(t.valorTotal)}</strong></span>
            <span style="color:#8fd6a8;">Recebido: <strong>${fmtBRL(t.valorRecebido)}</strong></span>
            <span style="color:#f0938d;">Falta: <strong>${fmtBRL(t.valorPendente)}</strong></span>
          </div>
        </div>
        ${aberto ? `
        <div class="table-wrap" style="margin-top:12px;">
          <table style="min-width:520px;">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Tam.</th><th>Pagamento</th><th>Obs.</th></tr></thead>
            <tbody>${rowsLote}</tbody>
          </table>
        </div>` : ''}
      </div>`;
  }).join('');

  return `
    <h1 class="view-title">Pedidos de Uniforme</h1>
    <p class="view-sub">Registre um novo pedido — a mensagem já sai formatada pro WhatsApp — e acompanhe pagamento/entrega de todos que já pediram.</p>

    ${viewResumoProducao()}

    <div class="grid-kpi" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi"><div class="kpi-ic">🛍️</div><div class="kpi-val">${totalPedidos}</div><div class="kpi-label">Total de pedidos</div></div>
      <div class="kpi accent-red"><div class="kpi-ic">⚠️</div><div class="kpi-val">${totalPendentes}</div><div class="kpi-label">Com pagamento em aberto</div></div>
      <div class="kpi"><div class="kpi-ic">📦</div><div class="kpi-val">${fmtBRL(valorTotal)}</div><div class="kpi-label">Valor total em pedidos</div></div>
    </div>
    <div class="grid-kpi" style="grid-template-columns:repeat(4,1fr);">
      <div class="kpi accent-green"><div class="kpi-ic">💰</div><div class="kpi-val">${fmtBRL(valorRecebido)}</div><div class="kpi-label">Já recebido</div></div>
      <div class="kpi accent-red"><div class="kpi-ic">⏳</div><div class="kpi-val">${fmtBRL(valorAReceber)}</div><div class="kpi-label">A receber</div></div>
      <div class="kpi"><div class="kpi-ic">🏭</div><div class="kpi-val">${fmtBRL(custoTotal)}</div><div class="kpi-label">Custo de produção (total)</div></div>
      <div class="kpi ${saldoAtual>=0?'accent-green':'accent-red'}"><div class="kpi-ic">${saldoAtual>=0?'📈':'📉'}</div><div class="kpi-val">${fmtBRL(saldoAtual)}</div><div class="kpi-label">Saldo atual (recebido − custo)</div></div>
    </div>
    <div class="note-box" style="margin-top:-8px;">
      💡 <strong style="color:var(--gold-light)">Lucro projetado</strong> se todo mundo pagar o restante: <strong class="${lucroProjetado>=0?'saldo-pos':'saldo-neg'}">${fmtBRL(lucroProjetado)}</strong>
      &nbsp;(receita total ${fmtBRL(valorTotal)} − custo total ${fmtBRL(custoTotal)}).
      Custo unitário: Uniforme ${fmtBRL(TIPOS_PEDIDO.uniforme.custo)} · Agasalho ${fmtBRL(TIPOS_PEDIDO.agasalho.custo)} · Torcedor ${fmtBRL(TIPOS_PEDIDO.torcedor.custo)}.
    </div>

    <div class="toolbar">
      <button class="btn btn-gold btn-sm" data-novo-pedido="uniforme">+ Uniforme Infantil</button>
      <button class="btn btn-gold btn-sm" data-novo-pedido="agasalho">+ Agasalho de Atleta</button>
      <button class="btn btn-gold btn-sm" data-novo-pedido="torcedor">+ Camisa de Torcedor</button>
      <button class="btn btn-ghost btn-sm" id="btn-fechar-lote" style="margin-left:auto;" ${semLoteCount===0?'disabled':''}>🔒 Fechar pedido (lote) — ${semLoteCount} novo(s)</button>
    </div>

    <div class="toolbar">
      <select id="filtro-tipo-pedido">
        <option value="">Todos os tipos</option>
        <option value="uniforme" ${filtroTipoPedido==='uniforme'?'selected':''}>Uniforme Infantil</option>
        <option value="agasalho" ${filtroTipoPedido==='agasalho'?'selected':''}>Agasalho de Atleta</option>
        <option value="torcedor" ${filtroTipoPedido==='torcedor'?'selected':''}>Camisa de Torcedor</option>
      </select>
      <select id="filtro-status-pedido">
        <option value="">Todos status</option>
        <option value="pendente" ${filtroStatusPedido==='pendente'?'selected':''}>Pendente</option>
        <option value="parcial" ${filtroStatusPedido==='parcial'?'selected':''}>Sinal pago (parcial)</option>
        <option value="pago" ${filtroStatusPedido==='pago'?'selected':''}>Pago integral</option>
      </select>
      <select id="filtro-lote-pedido">
        <option value="">Todos os pedidos</option>
        <option value="sem-lote" ${filtroLotePedido==='sem-lote'?'selected':''}>Só os novos (sem lote)</option>
        ${lotesOrdenados.map(l=>`<option value="${l.id}" ${filtroLotePedido===l.id?'selected':''}>${l.nome}</option>`).join('')}
      </select>
      <span style="margin-left:auto;font-size:11.5px;color:var(--muted);">${lista.length} pedido(s)</span>
    </div>

    <div class="table-wrap">
      <table style="min-width:920px;">
        <thead>
          <tr>
            <th>Nome</th><th>Tipo</th><th>Tam.</th><th>Detalhes</th><th>Valor</th><th>Data</th><th>Pagamento</th><th>Entrega</th><th>Lote</th><th>Obs.</th><th>Ações</th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="11"><div class="empty-state">Nenhum pedido registrado ainda.</div></td></tr>`}</tbody>
      </table>
    </div>

    ${DB.lotes.length ? `
    <div style="margin-top:26px;">
      <strong style="font-size:14px;display:block;margin-bottom:12px;">📦 Histórico de lotes fechados</strong>
      ${historicoLotes}
    </div>` : ''}
  `;
}

/* ============================================================
   VIEW: ELENCO (organização por categoria)
============================================================ */
function viewElenco(){
  const grupos = CATEGORIAS.map(cat=>{
    const atletasCat = ativos().filter(a=>a.categoria===cat).sort((a,b)=>a.nome.localeCompare(b.nome));
    if(!atletasCat.length) return '';
    const cards = atletasCat.map(a=>{
      const perf = a.perfil || {tamanhoCamisa:'', peso:'', anotacoes:[], feedbacks:[]};
      const temNotas = (perf.anotacoes||[]).length + (perf.feedbacks||[]).length;
      return `
        <div class="comp-card" data-abrir-perfil="${a.id}" style="cursor:pointer;">
          <div class="comp-top">
            <div>
              <div class="comp-name" style="font-size:15px;">${a.nome}</div>
              <span style="font-size:11px;color:var(--muted);">${a.idade ? a.idade+' anos' : ''}</span>
            </div>
            ${a.bolsista ? '<span class="status-pill status-agendada">Bolsista</span>' : ''}
          </div>
          <div class="comp-meta">
            <div>📏 Camisa: ${perf.tamanhoCamisa || 'não informado'}</div>
            <div>⚖️ Peso: ${perf.peso ? perf.peso+' kg' : 'não informado'}</div>
            <div>👤 ${a.responsavel || 'sem responsável'}</div>
          </div>
          <div class="comp-foot">
            <span style="font-size:11.5px;color:var(--muted);">${temNotas} anotação(ões)</span>
            <span style="font-size:11.5px;color:var(--gold-light);">Ver perfil →</span>
          </div>
        </div>`;
    }).join('');
    return `
      <div style="margin-bottom:22px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <span class="cat-badge" style="font-size:12px;padding:4px 12px;">${cat}</span>
          <span style="font-size:12px;color:var(--muted);">${atletasCat.length} atleta(s)</span>
        </div>
        <div class="comp-grid">${cards}</div>
      </div>`;
  }).join('');

  return `
    <h1 class="view-title">Elenco</h1>
    <p class="view-sub">Organização do time por categoria. Toque em um atleta para ver o perfil completo, registrar tamanho, peso, desempenho e feedbacks.</p>
    ${grupos || '<div class="empty-state">Nenhum atleta ativo cadastrado.</div>'}
  `;
}

/* ============================================================
   VIEW: HISTÓRICO DE ALTERAÇÕES
============================================================ */
function viewHistorico(){
  const log = DB.log || [];
  let lista = filtroAreaHistorico ? log.filter(l=>l.area===filtroAreaHistorico) : log;
  const areas = [...new Set(log.map(l=>l.area))].sort();

  const grupos = {};
  lista.forEach(l=>{
    const dia = new Date(l.ts).toLocaleDateString('pt-BR');
    if(!grupos[dia]) grupos[dia] = [];
    grupos[dia].push(l);
  });

  const corArea = {
    'Mensalidades':'#8fd6a8', 'Balanço':'#7dc4e0', 'Competições':'var(--gold-light)',
    'Pedidos':'#f0938d', 'Inscrições':'#e4c878', 'Elenco':'#7dc4e0', 'Desistências':'#f0938d', 'Configurações':'var(--muted)'
  };

  const blocos = Object.keys(grupos).map(dia=>{
    const itens = grupos[dia].map(l=>{
      const hora = new Date(l.ts).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      const cor = corArea[l.area] || 'var(--gold-light)';
      return `
        <div style="display:flex;gap:10px;padding:9px 0;border-top:1px solid rgba(255,255,255,0.06);">
          <span style="font-size:11px;color:var(--muted);white-space:nowrap;padding-top:1px;">${hora}</span>
          <span class="cat-badge" style="color:${cor};border-color:${cor}55;flex-shrink:0;">${l.area}</span>
          <span style="font-size:12.5px;">${l.descricao}</span>
        </div>`;
    }).join('');
    return `
      <div style="margin-bottom:18px;">
        <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);margin-bottom:4px;">${dia}</div>
        <div class="card" style="padding:6px 16px;">${itens}</div>
      </div>`;
  }).join('');

  return `
    <h1 class="view-title">Histórico de Alterações</h1>
    <p class="view-sub">Tudo que foi alterado em qualquer menu do painel, mais recente primeiro.</p>

    <div class="toolbar">
      <select id="filtro-area-historico">
        <option value="">Todas as áreas</option>
        ${areas.map(a=>`<option value="${a}" ${filtroAreaHistorico===a?'selected':''}>${a}</option>`).join('')}
      </select>

/* ============================================================

============================================================ */
function openModal(html){
  modalAberto = true;
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){
  modalAberto = false;
  document.getElementById('overlay').classList.remove('show');
  // Se uma atualização do Firestore chegou enquanto o modal estava aberto
  // (inclusive o eco da própria gravação), aplica agora que é seguro.
  if(DB_PENDENTE){
    DB = DB_PENDENTE;
    DB_PENDENTE = null;
    if(telaAtual === 'admin'){ render(); }
  }
  processarFilaInscricoes();
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') closeModal();
});

/* Abre um link do WhatsApp com fallback: se o navegador bloquear o pop-up
   (comum no Safari), mostra um modal com botão de abrir e de copiar o link,
   em vez de falhar em silêncio. Use isso em vez de window.open() direto. */
function abrirWhatsApp(link){
  let win = null;
  try{ win = window.open(link, '_blank', 'noopener'); }catch(err){ win = null; }
  if(win) return;
  toast('Não consegui abrir o WhatsApp automaticamente');
  openModal(`
    <h3>Abrir WhatsApp</h3>
    <p style="font-size:13px;color:var(--muted);margin-top:-10px;margin-bottom:16px;">O navegador bloqueou a abertura automática. Use uma das opções abaixo.</p>
    <div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap;">
      <a href="${link}" target="_blank" rel="noopener" class="btn btn-gold" style="text-decoration:none;">Abrir WhatsApp</a>
      <button class="btn btn-ghost" id="ww-copiar">📋 Copiar link</button>
      <button class="btn btn-ghost" id="ww-fechar">Fechar</button>
    </div>
  `);
  document.getElementById('ww-fechar').addEventListener('click', closeModal);
  document.getElementById('ww-copiar').addEventListener('click', async ()=>{
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(link);
      } else {
        const ta = document.createElement('textarea');
        ta.value = link; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      toast('Link copiado');
    }catch(err){
      alert('Não consegui copiar automaticamente. Toque e segure o link acima pra copiar manualmente.');
    }
  });
}

  });

    el.addEventListener('click', ()=>{
      const ev = (DB.eventos||[]).find(x=>x.id===el.dataset.removerEvento);
      if(ev && confirm('Excluir o evento "'+ev.titulo+'"?')){
        DB.eventos = DB.eventos.filter(x=>x.id !== el.dataset.removerEvento);
        logAcao('Calendário', 'Evento removido: '+ev.titulo);
        saveDB(); render();
      }
    });
  });
  document.querySelectorAll('[data-escala-atleta]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const [slot, atletaId] = el.dataset.escalaAtleta.split('|');
      if(!DB.escalacao) DB.escalacao = {slot1:[], slot2:[], slot3:[]};
      if(!DB.escalacao[slot]) DB.escalacao[slot] = [];
      const lista = DB.escalacao[slot];
      const idx = lista.indexOf(atletaId);
      if(el.checked && idx===-1){ lista.push(atletaId); }
      else if(!el.checked && idx!==-1){ lista.splice(idx,1); }
      const atleta = DB.atletas.find(a=>a.id===atletaId);
      const horLabel = (ESCALACAO_HORARIOS.find(h=>h.key===slot)||{}).label || slot;
      logAcao('Escalação', (atleta?atleta.nome:'Atleta')+' '+(el.checked?'adicionado ao':'removido do')+' horário '+horLabel);
      saveDB(); render();
    });
  });
  document.querySelectorAll('[data-escala-cat-all]').forEach(el=>{

      if(!DB.escalacao) DB.escalacao = {slot1:[], slot2:[], slot3:[]};
      if(!DB.escalacao[slot]) DB.escalacao[slot] = [];
      const lista = DB.escalacao[slot];
      const atletasCat = ativos().filter(a=>a.categoria===cat);
      const todosMarcados = atletasCat.length>0 && atletasCat.every(a=>lista.includes(a.id));
      const horLabel = (ESCALACAO_HORARIOS.find(h=>h.key===slot)||{}).label || slot;
      if(todosMarcados){
        DB.escalacao[slot] = lista.filter(id=>!atletasCat.some(a=>a.id===id));
        logAcao('Escalação', cat+' (todos) removido do horário '+horLabel);
      } else {
        atletasCat.forEach(a=>{ if(!lista.includes(a.id)) lista.push(a.id); });
        logAcao('Escalação', cat+' (todos) adicionado ao horário '+horLabel);

    if(!raw){ alert('Não encontrei nenhum backup salvo neste navegador.'); return; }
    let candidato;
    try{ candidato = migrarDB(JSON.parse(raw)); }
    catch(e){ alert('O backup salvo neste navegador está corrompido e não pôde ser lido.'); return; }
    const resumo = `${candidato.atletas.length} atletas, ${candidato.competicoes.length} competições, ${candidato.pedidos.length} pedidos.`;
    if(!confirm('Encontrei este backup neste navegador:\n\n'+resumo+'\n\nIsso vai SUBSTITUIR os dados atuais (inclusive na nuvem, se estiver sincronizado) por este backup. Continuar?')) return;
    DB = candidato;
    logAcao('Configurações', 'Backup local recuperado e sincronizado manualmente');
    saveDB();
    toast('Backup recuperado e sincronizado');
    render();
  });
  const btnReset = document.getElementById('btn-reset');
  if(btnReset) btnReset.addEventListener('click', ()=>{
    const aviso = FIREBASE_DOC_REF
      ? 'Isso vai APAGAR TODOS os dados do painel em todos os dispositivos (alunos, mensalidades, balanço, pedidos). Não dá para desfazer.\n\nDigite APAGAR para confirmar:'
      : 'Isso vai APAGAR TODOS os dados deste dispositivo. Não dá para desfazer.\n\nDigite APAGAR para confirmar:';
    const resposta = prompt(aviso);
    if(resposta && resposta.trim().toUpperCase() === 'APAGAR'){
      DB = seedDBFresh();
      saveDB();
      toast('Dados apagados');
      render();
    }
  });
  const inputValor = document.getElementById('input-valor-mensal');
  if(inputValor) inputValor.addEventListener('change', e=>{
    const v = parseFloat(e.target.value.replace(',','.'));
    if(!isNaN(v) && v > 0){
      logAcao('Configurações', 'Valor da mensalidade alterado de '+fmtBRL(DB.valorMensalidade)+' para '+fmtBRL(v));
      DB.valorMensalidade = v; saveDB(); render();
    }
  });
  const inputMatricula = document.getElementById('input-valor-matricula');
  if(inputMatricula) inputMatricula.addEventListener('change', e=>{
    const v = parseFloat(e.target.value.replace(',','.'));
    if(!isNaN(v) && v > 0){
      logAcao('Configurações', 'Valor da matrícula alterado de '+fmtBRL(DB.valorMatricula)+' para '+fmtBRL(v));
      DB.valorMatricula = v; saveDB(); render();
    }
  });
}

      <button class="btn btn-gold btn-sm" id="pf-salvar-dados">Salvar tamanho/peso</button>

      <div style="display:flex;gap:8px;margin-top:8px;">
        <textarea id="pf-nova-desempenho" placeholder="Ex: melhorou o passe, precisa trabalhar finalização..." style="flex:1;min-height:48px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:9px;padding:9px 11px;color:var(--cream);font-family:'Inter',sans-serif;font-size:13px;resize:vertical;"></textarea>
        <button class="btn btn-ghost btn-sm" id="pf-add-desempenho">+ Add</button>
      </div>
    </div>

    <div style="border-top:1px solid rgba(255,255,255,0.08);padding-top:14px;">
      <strong style="font-size:13px;display:block;margin-bottom:8px;">💬 Feedbacks realizados</strong>
      <div id="pf-lista-feedback" style="max-height:180px;overflow-y:auto;">${listaNotas(perf.feedbacks, 'feedback')}</div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <textarea id="pf-novo-feedback" placeholder="Ex: conversamos sobre postura em quadra..." style="flex:1;min-height:48px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:9px;padding:9px 11px;color:var(--cream);font-family:'Inter',sans-serif;font-size:13px;resize:vertical;"></textarea>

    perf.tamanhoCamisa = document.getElementById('pf-tamanho').value.trim();
    perf.peso = document.getElementById('pf-peso').value.trim();

  });

/* ============================================================
   LER FICHA DE INSCRIÇÃO RECEBIDA PELO WHATSAPP
   Faz o "de-para" entre o texto que o pai colou de volta e os
   campos do cadastro de atleta, evitando digitar tudo de novo.
============================================================ */
function calcularIdade(nascimentoStr){
  const m = nascimentoStr.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(!m) return '';
  let [, d, mo, y] = m;
  if(y.length===2) y = '20'+y;
  const nasc = new Date(parseInt(y), parseInt(mo)-1, parseInt(d));
  if(isNaN(nasc.getTime())) return '';
  const hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const aindaNaoFezAniversario = (hoje.getMonth() < nasc.getMonth()) ||
    (hoje.getMonth()===nasc.getMonth() && hoje.getDate() < nasc.getDate());
  if(aindaNaoFezAniversario) idade--;
  return idade >= 0 && idade < 100 ? idade : '';
}
function sugerirCategoria(idade){
  if(idade==='' || idade===null || idade===undefined) return 'SUB7';
  if(idade<=7) return 'SUB7';
  if(idade<=9) return 'SUB9';
  if(idade<=11) return 'SUB11';
  if(idade<=13) return 'SUB13';
  return 'SUB15';
}

============================================================ */
function openListaEscaladosModal(compId){
  const c = DB.competicoes.find(x=>x.id===compId);
  if(!c) return;
  const texto = textoListaEscalados(compId);
  const link = linkListaEscalados(compId);

  openModal(`
    <h3>Lista de escalados — ${c.nome}</h3>
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px 16px;margin-bottom:16px;white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:340px;overflow-y:auto;">${texto.replace(/\*/g,'').replace(/_/g,'')}</div>
    <div class="modal-actions" style="justify-content:flex-start;flex-wrap:wrap;">
      <a href="${link}" target="_blank" rel="noopener" class="btn btn-gold" style="text-decoration:none;">📲 Enviar pelo WhatsApp</a>
      <button class="btn btn-ghost" id="lista-copiar">📋 Copiar texto</button>
      <button class="btn btn-ghost" id="lista-fechar">Fechar</button>
    </div>
  `);
  document.getElementById('lista-fechar').addEventListener('click', closeModal);
  document.getElementById('lista-copiar').addEventListener('click', async ()=>{
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(texto);
      } else {
        const ta = document.createElement('textarea');
        ta.value = texto; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      toast('Lista copiada');
    }catch(err){
      alert('Não consegui copiar automaticamente. Selecione e copie o texto manualmente.');
    }
  });
}


function openRosterModal(compId){
  const c = DB.competicoes.find(x=>x.id===compId);
  if(!c) return;
  const roster = c.atletas || [];
  const idsNoElenco = roster.map(r=>r.atletaId);
  const disponiveis = DB.atletas.filter(a=>a.status==='ativo' && !idsNoElenco.includes(a.id));
  const vagas = c.maxAtletas - roster.length;

  const arrecadado = roster.filter(r=>r.status==='pago').reduce((s,r)=>s+r.valorCobrado,0);
  const saldoComp = arrecadado - c.valorInscricaoTime;

  const linhasRoster = roster.map(r=>{
    const atleta = DB.atletas.find(a=>a.id===r.atletaId);
    const nome = atleta ? atleta.nome : '(atleta removido)';
    const cls = r.status; // 'pago'|'pendente'|'isento'
    const corBg = cls==='pago' ? 'var(--green-soft)' : cls==='isento' ? 'rgba(201,162,74,0.15)' : 'var(--red-soft)';
    const corTxt = cls==='pago' ? '#8fd6a8' : cls==='isento' ? 'var(--gold-light)' : '#f0938d';
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:9px;background:rgba(255,255,255,0.03);margin-bottom:6px;">
        <div style="min-width:0;flex:1;">
          <div style="font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${nome}</div>
        </div>
        <input type="text" data-roster-valor="${r.atletaId}" value="${r.valorCobrado}" style="width:70px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:7px;padding:6px 8px;color:var(--cream);font-size:12px;">
        <span data-roster-status="${r.atletaId}" style="cursor:pointer;padding:5px 10px;border-radius:7px;font-size:11px;font-weight:700;background:${corBg};color:${corTxt};white-space:nowrap;" title="Toque para alternar">${cls==='pago'?'PAGO':cls==='isento'?'ISENTO':'PENDENTE'}</span>
        <button class="icon-btn danger" data-roster-remove="${r.atletaId}" title="Remover do elenco">🗑️</button>
      </div>`;
  }).join('');

  const disponiveisPorCategoria = CATEGORIAS.map(cat=>{
    const doGrupo = disponiveis.filter(a=>a.categoria===cat);
    if(!doGrupo.length) return '';
    return `
      <div style="margin-bottom:8px;">
        <div style="font-size:10.5px;color:var(--gold-light);letter-spacing:0.5px;margin-bottom:4px;">${cat}</div>
        ${doGrupo.map(a=>`
          <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;cursor:pointer;">
            <input type="checkbox" class="roster-check" value="${a.id}" style="width:15px;height:15px;">
            <span style="font-size:12.5px;">${a.nome}</span>
          </label>`).join('')}
      </div>`;
  }).join('');

  openModal(`
    <h3>Elenco — ${c.nome}</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-10px;margin-bottom:14px;">${roster.length}/${c.maxAtletas} atletas · inscrição do time ${fmtBRL(c.valorInscricaoTime)} · saldo <strong class="${saldoComp>=0?'saldo-pos':'saldo-neg'}">${fmtBRL(saldoComp)}</strong></p>

    <div style="max-height:220px;overflow-y:auto;margin-bottom:14px;">
      ${linhasRoster || '<div class="empty-state">Nenhum atleta no elenco ainda.</div>'}
    </div>

    ${vagas > 0 ? `
    <div class="field">
      <label>Escalar em lote (${vagas} vaga(s) restante(s))</label>
      <div style="max-height:220px;overflow-y:auto;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:8px 10px;margin-bottom:8px;">
        ${disponiveisPorCategoria || '<div style="font-size:12px;color:var(--muted);">Nenhum atleta disponível.</div>'}
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="roster-valor-lote" placeholder="Valor padrão (R$)" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:9px;padding:9px 10px;color:var(--cream);font-size:13px;">
        <button class="btn btn-gold btn-sm" id="roster-add-lote">+ Adicionar selecionados</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;">Marque quantos atletas quiser e adicione todos de uma vez, com o mesmo valor — ajuste caso a caso depois se precisar.</div>
    </div>` : `<div class="note-box">Elenco no limite máximo (${c.maxAtletas}).</div>`}

    <div class="modal-actions">
      <button class="btn btn-ghost" id="roster-close">Fechar</button>
    </div>
  `);

  document.getElementById('roster-close').addEventListener('click', closeModal);
  const addLoteBtn = document.getElementById('roster-add-lote');
  if(addLoteBtn) addLoteBtn.addEventListener('click', ()=>{
    const checks = [...document.querySelectorAll('.roster-check:checked')];
    if(!checks.length){ alert('Marque ao menos um atleta.'); return; }
    if(checks.length > vagas){ alert('Você marcou mais atletas do que vagas disponíveis ('+vagas+').'); return; }
    const valor = parseFloat(document.getElementById('roster-valor-lote').value.replace(',','.')) || 0;
    const nomes = [];
    checks.forEach(chk=>{
      const atletaId = chk.value;
      const atleta = DB.atletas.find(a=>a.id===atletaId);
      c.atletas.push({atletaId, valorCobrado:valor, status:'pendente'});
      if(atleta) nomes.push(atleta.nome);
    });
    logAcao('Competições', nomes.length+' atleta(s) escalado(s) em lote para "'+c.nome+'": '+nomes.join(', ')+' (valor '+fmtBRL(valor)+' cada)');
    saveDB();
    openRosterModal(compId);
  });
  document.querySelectorAll('[data-roster-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const atleta = DB.atletas.find(a=>a.id===btn.dataset.rosterRemove);
      c.atletas = c.atletas.filter(r=>r.atletaId!==btn.dataset.rosterRemove);
      logAcao('Competições', (atleta?atleta.nome:'Atleta')+' removido do elenco de "'+c.nome+'"');
      saveDB();
      openRosterModal(compId);
    });
  });
  document.querySelectorAll('[data-roster-status]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const r = c.atletas.find(x=>x.atletaId===el.dataset.rosterStatus);
      if(!r) return;
      r.status = r.status==='pendente' ? 'pago' : r.status==='pago' ? 'isento' : 'pendente';
      const atleta = DB.atletas.find(a=>a.id===r.atletaId);
      logAcao('Competições', 'Pagamento de inscrição de '+(atleta?atleta.nome:'atleta')+' em "'+c.nome+'" alterado para '+r.status.toUpperCase());
      saveDB();
      openRosterModal(compId);
    });
  });
  document.querySelectorAll('[data-roster-valor]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const r = c.atletas.find(x=>x.atletaId===inp.dataset.rosterValor);
      const v = parseFloat(inp.value.replace(',','.'));
      if(r && !isNaN(v)){
        const atleta = DB.atletas.find(a=>a.id===r.atletaId);
        logAcao('Competições', 'Valor de inscrição de '+(atleta?atleta.nome:'atleta')+' em "'+c.nome+'" alterado para '+fmtBRL(v));
        r.valorCobrado = v; saveDB();
      }
    });
  });
}

function openNovoPedidoModal(tipo){

    <h3>Novo pedido — ${info.label}</h3>
    <p style="font-size:13px;color:var(--muted);margin-top:-10px;margin-bottom:16px;">
      Valor: <strong style="color:var(--gold-light)">${fmtBRL(info.valor)}</strong>

    </p>
    <div class="field">
      <label>${isTorcedor ? 'Nome do torcedor' : 'Nome do aluno'}</label>
      <input type="text" id="p-nome" placeholder="Nome completo">
    </div>
    <div class="field">
      <label>Tamanho</label>
      <select id="p-tamanho">
        <option value="" disabled selected>Selecione</option>
        ${info.tamanhos.map(t=>`<option value="${t}">${t}</option>`).join('')}
      </select>
    </div>
    ${!isTorcedor ? `
    <div class="field">
      <label>Nome do responsável (opcional)</label>
      <input type="text" id="p-responsavel" placeholder="Nome de quem está pedindo">
    </div>` : `
    <div class="field-row">
      <div class="field">
        <label>Nome nas costas</label>
        <input type="text" id="p-costas" maxlength="14" placeholder="Ex: SILVA">
      </div>
      <div class="field">
        <label>Número</label>
        <input type="text" id="p-numero" maxlength="2" placeholder="Ex: 10">
      </div>
    </div>`}
    <div class="field">
      <label>Observação (opcional)</label>
      <textarea id="p-obs" placeholder="Ex: combinou de pagar o restante na sexta..." style="width:100%;min-height:52px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:9px;padding:9px 11px;color:var(--cream);font-family:'Inter',sans-serif;font-size:13px;resize:vertical;"></textarea>
    </div>
    <div class="pix-box" style="background:rgba(46,125,79,0.10);border:1px dashed rgba(201,162,74,0.5);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:rgba(246,243,236,0.85);margin-bottom:14px;">
      <strong style="color:var(--gold-light);">Pix (e-mail):</strong> ${PIX_CHAVE}
    </div>
    <div class="err" id="p-err" style="display:none;color:#f0938d;font-size:12.5px;margin-bottom:10px;">Preencha nome e tamanho antes de continuar.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="p-cancel">Cancelar</button>
      <button class="btn btn-gold" id="p-save">Registrar e enviar pelo WhatsApp</button>
    </div>
  `);

  document.getElementById('p-cancel').addEventListener('click', closeModal);
  document.getElementById('p-save').addEventListener('click', ()=>{
    const nome = document.getElementById('p-nome').value.trim();
    const tamanho = document.getElementById('p-tamanho').value;
    const err = document.getElementById('p-err');
    if(!nome || !tamanho){ err.style.display='block'; return; }
    err.style.display='none';

    const pedido = {
      id: uid('ped'), tipo, nome, tamanho,
      responsavel: !isTorcedor ? (document.getElementById('p-responsavel').value.trim()) : '',
      costas: isTorcedor ? document.getElementById('p-costas').value.trim() : '',
      numero: isTorcedor ? document.getElementById('p-numero').value.trim() : '',
      dataPedido: new Date().toISOString().slice(0,10),
      valorPago: 0,
      statusEntrega: 'pendente',
      loteId: null,
      observacao: document.getElementById('p-obs').value.trim()
    };
    DB.pedidos.push(pedido);
    logAcao('Pedidos', 'Novo pedido registrado: '+info.label+' — '+nome+' (tam. '+tamanho+', '+fmtBRL(info.valor)+')');
    saveDB();
    toast('Pedido registrado');
    closeModal();
    render();

    const link = montarMensagemPedido(pedido);
    abrirWhatsApp(link);
  });
}

============================================================ */
function abrirModalFecharLote(){
  const pendentes = pedidosSemLote();
  if(!pendentes.length){ alert('Não há pedidos novos para fechar em lote.'); return; }
  const t = totaisPedidos(pendentes);
  const sugestao = 'Lote ' + new Date().toLocaleDateString('pt-BR');

  openModal(`
    <h3>Fechar pedido em lote</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-10px;margin-bottom:16px;">
      ${t.qtd} pedido(s) serão agrupados neste lote — ${fmtBRL(t.valorTotal)} no total, ${fmtBRL(t.valorRecebido)} já recebido.
      Depois de fechado, você ainda pode editar pagamento, entrega e observações normalmente — fechar só registra esse momento no histórico, pra você saber o que já foi enviado pra produção.
    </p>
    <div class="field">
      <label>Nome do lote</label>
      <input type="text" id="lote-nome" value="${sugestao}">
    </div>
    <div style="max-height:200px;overflow-y:auto;margin-bottom:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:10px 12px;">
      ${pendentes.map(p=>`<div style="font-size:12px;padding:4px 0;border-top:1px solid rgba(255,255,255,0.06);">${p.nome} — ${TIPOS_PEDIDO[p.tipo].label} (tam. ${p.tamanho})</div>`).join('')}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="lote-cancel">Cancelar</button>
      <button class="btn btn-gold" id="lote-confirm">Fechar lote</button>
    </div>
  `);

  document.getElementById('lote-cancel').addEventListener('click', closeModal);
  document.getElementById('lote-confirm').addEventListener('click', ()=>{
    const nome = document.getElementById('lote-nome').value.trim() || sugestao;
    const loteId = uid('lote');
    DB.lotes.push({id:loteId, nome, dataFechamento:new Date().toISOString()});
    pendentes.forEach(p=>{ p.loteId = loteId; });
    logAcao('Pedidos', 'Lote fechado: "'+nome+'" com '+pendentes.length+' pedido(s) — '+fmtBRL(t.valorTotal));
    saveDB();
    toast('Lote fechado');
    closeModal();
    render();
  });
}

function exportarResumoProducao(){
  const txt = textoResumoProducao();
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'alleanza_resumo_producao_' + new Date().toISOString().slice(0,10) + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Resumo exportado');
}

function exportarDados(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'alleanza_painel_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup exportado');
}
function importarDados(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const novo = JSON.parse(evt.target.result);
      if(!novo.atletas || !novo.competicoes) throw new Error('formato inválido');
      DB = migrarDB(novo);
      logAcao('Configurações', 'Backup importado — dados substituídos'+(FIREBASE_DOC_REF ? ' em todos os dispositivos sincronizados' : ''));
      saveDB();
      toast('Dados importados com sucesso');
      render();
    }catch(err){
      alert('Não foi possível importar este arquivo. Verifique se é um backup válido do painel.');
    }
  };
  reader.readAsText(file);
}

/* ============================================================
   ACESSO — login (Firebase Auth, e-mail e senha) e sessão
============================================================ */
let ADMIN_USER = null;              // usuário logado no Firebase (ou null)
let unsubDadosPrivados = null;
let unsubInscricoesWeb = null;
let FILA_INSCRICOES = [];           // fichas do link aguardando importação
let telaAtual = 'carregando';       // 'carregando' | 'login' | 'admin'

/* Chamada sempre que o DB muda (primeira carga ou atualização do Firestore). */
function aoDBAtualizado(){
  esconderTelaCarregamento();
  if(telaAtual === 'admin') render();
  else entrarAdmin();
}

function entrarAdmin(){
  telaAtual = 'admin';
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-root').style.display = 'flex';
  render();
}

function mostrarLogin(){
  telaAtual = 'login';
  esconderTelaCarregamento();
  document.getElementById('admin-root').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  const btn = document.getElementById('login-entrar');
  btn.disabled = false;
  btn.textContent = 'Entrar';
  document.getElementById('login-senha').value = '';
  document.title = 'Painel de Gestão — Alleanza Escola de Futsal';
}

function sairDaAdministracao(){
  pararDadosPrivados();
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  if(firebaseAtivo()){
    firebase.auth().signOut().catch(err=>console.error('Erro ao sair:', err));
  } else {
    mostrarLogin();
  }
}

function firebaseAtivo(){
  return typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0;
}

function mensagemErroLogin(err){
  const code = (err && err.code) || '';
  if(code === 'auth/invalid-email') return 'E-mail inválido.';
  if(code === 'auth/too-many-requests') return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if(code === 'auth/network-request-failed') return 'Sem conexão com a internet.';
  if(code === 'auth/operation-not-allowed') return 'Login por e-mail/senha não está ativado no Firebase.';
  return 'E-mail ou senha incorretos.';
}

(function ligarLogin(){
  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('login-email');
  const senhaInput = document.getElementById('login-senha');
  const erroEl = document.getElementById('login-erro');
  const btnEntrar = document.getElementById('login-entrar');
  function mostrarErro(msg, ok){
    erroEl.textContent = msg;
    erroEl.classList.toggle('ok', !!ok);
    erroEl.style.display = 'block';
  }
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const email = emailInput.value.trim();
    const senha = senhaInput.value;
    if(!email || !senha){ mostrarErro('Preencha e-mail e senha.'); return; }
    if(!firebaseAtivo()){ mostrarErro('Sem conexão com o Firebase.'); return; }
    erroEl.style.display = 'none';
    btnEntrar.disabled = true;
    btnEntrar.textContent = 'Entrando...';
    firebase.auth().signInWithEmailAndPassword(email, senha).catch(err=>{
      btnEntrar.disabled = false;
      btnEntrar.textContent = 'Entrar';
      mostrarErro(mensagemErroLogin(err));
    });
  });
  document.getElementById('login-esqueci').addEventListener('click', ()=>{
    const email = emailInput.value.trim();
    if(!email){ mostrarErro('Digite seu e-mail acima e toque em "Esqueci a senha" de novo.'); emailInput.focus(); return; }
    firebase.auth().sendPasswordResetEmail(email)
      .then(()=>mostrarErro('Se esse e-mail for de um administrador, enviamos um link para criar uma nova senha.', true))
      .catch(err=>mostrarErro(mensagemErroLogin(err)));
  });
  document.getElementById('btn-sair-sidebar').addEventListener('click', ()=>{
    if(confirm('Sair do painel neste aparelho?')) sairDaAdministracao();
  });
  document.getElementById('tb-bell').addEventListener('click', ()=>setView('inscricoes'));
})();

/* ============================================================
   INSCRIÇÕES PELO LINK — os pais preenchem inscricao.html, que
   grava uma ficha em "inscricoes/". Com o painel aberto, cada
   ficha nova vira um atleta "Nova" em Inscrições e a cópia
   em "inscricoes/" é apagada.
============================================================ */

/* Texto vindo de formulário público: tira caracteres de HTML para
   nunca virar código dentro do painel. */
function textoSeguro(v, max){
  return String(v == null ? '' : v).replace(/[<>"'`]/g, '').replace(/&/g, 'e').replace(/\s+/g, ' ').trim().slice(0, max || 200);
}
function dataISOlocal(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function atletaDaInscricaoWeb(id, x){
  const enviadaEm = x.criadoEm && x.criadoEm.toDate ? x.criadoEm.toDate() : new Date();
  const nascimento = textoSeguro(x.nascimento, 10);
  const idade = nascimento ? calcularIdade(nascimento) : '';
  const email = textoSeguro(x.email, 120);
  const extras = [];
  if(email) extras.push('E-mail: ' + email);
  if(x.escola) extras.push('Escola: ' + textoSeguro(x.escola, 120));
  if(x.jaJogou) extras.push('Experiência: ' + textoSeguro(x.jaJogou, 200));
  extras.push('Uso de imagem: ' + (x.autorizaImagem ? 'autorizado' : 'NÃO autorizado'));
  const observacoes = [textoSeguro(x.observacoes, 600), ...extras].filter(Boolean).join(' · ');
  const iso = dataISOlocal(enviadaEm);
  return {
    id, categoria: sugerirCategoria(idade), nome: textoSeguro(x.nome, 120), idade, nascimento,
    responsavel: textoSeguro(x.responsavel, 120),
    telefone: String(x.telefone || '').replace(/\D/g, '').slice(0, 15),
    rg: textoSeguro(x.rg, 30), filiacaoMae: textoSeguro(x.filiacaoMae, 120), filiacaoPai: textoSeguro(x.filiacaoPai, 120),
    observacoesInscricao: observacoes, documentos: [], bolsista: false,
    status: 'inscricao_pendente', dataInscricao: iso, dataEnvioInscricao: iso,
    dataDesistencia: null, motivoDesistencia: '',
    matricula: { valor: DB.valorMatricula, pago: false },
    perfil: { tamanhoCamisa: textoSeguro(x.tamanhoCamisa, 6), peso: '', anotacoes: [], feedbacks: [] },
    mensalidades: Object.fromEntries(MESES.map(m=>[m.key, '-'])),
    emailResponsavel: email, autorizaImagem: !!x.autorizaImagem,
    origem: 'link', novaInscricao: true
  };
}

function iniciarInscricoesWeb(){
  if(unsubInscricoesWeb || !firebaseAtivo()) return;
  unsubInscricoesWeb = firebase.firestore().collection('inscricoes').onSnapshot(snap=>{
    snap.docs.forEach(d=>{ if(!FILA_INSCRICOES.some(x=>x.id===d.id)) FILA_INSCRICOES.push(d); });
    processarFilaInscricoes();
  }, err=>{
    console.warn('Não consegui ler as inscrições do link:', err && err.code);
    unsubInscricoesWeb = null;
  });
}

function processarFilaInscricoes(){
  if(!DB || !FIREBASE_DOC_REF || modalAberto || !FILA_INSCRICOES.length) return;
  const docs = FILA_INSCRICOES.splice(0);
  const novos = [];
  docs.forEach(d=>{
    const id = 'atl_web_' + d.id;
    if(DB.atletas.some(a=>a.id===id)) return; // já importada (outro aparelho)
    const atleta = atletaDaInscricaoWeb(id, d.data());
    if(!atleta.nome) return;
    DB.atletas.push(atleta);
    novos.push(atleta);
    logAcao('Inscrições', 'Nova inscrição pelo link: ' + atleta.nome + ' (' + atleta.categoria + ')');
  });
  const apagarFichas = ()=>Promise.all(docs.map(d=>d.ref.delete()))
    .catch(err=>console.warn('Não consegui limpar fichas importadas:', err));
  if(!novos.length){ apagarFichas(); return; }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
  // Só apaga a ficha depois que ela estiver salva no painel.
  FIREBASE_DOC_REF.set(DB).then(apagarFichas)
    .catch(err=>console.error('Erro ao salvar inscrições importadas:', err));
  avisarNovasInscricoes(novos);
  if(telaAtual === 'admin') render();
}

function avisarNovasInscricoes(novos){
  const txt = novos.length === 1 ? 'Nova inscrição: ' + novos[0].nome : novos.length + ' novas inscrições';
  toast('🔔 ' + txt);
  try{
    if('Notification' in window && Notification.permission === 'granted' && document.hidden){
      new Notification('Alleanza — ' + txt, { body: 'Abra o painel em Inscrições para revisar.', icon: 'logo.jpg', tag: 'alleanza-inscricao' });
    }
  }catch(e){ /* navegador sem suporte */ }
}

function atualizarBadgeInscricoes(){
  if(!DB) return;
  const n = pendentesInscricao().length;
  document.querySelectorAll('[data-view="inscricoes"] .nav-badge, #tb-bell .nav-badge').forEach(el=>{
    el.textContent = n > 9 ? '9+' : String(n);
    el.hidden = n === 0;
  });
  const bell = document.getElementById('tb-bell');
  if(bell) bell.hidden = n === 0;
  document.title = (n ? '(' + n + ') ' : '') + 'Painel de Gestão — Alleanza';
}

/* Revisar e aprovar uma inscrição: define categoria e o mês em que o
   aluno começa a contar (meses anteriores ficam como "não se aplica"). */
function openAprovarInscricao(id){
  const a = DB.atletas.find(x=>x.id===id);
  if(!a) return;
  const mapa = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const mesInsc = mesKeyDaData(a.dataInscricao);
  let idxPadrao = MESES.findIndex(m=>m.key===mesInsc);
  if(idxPadrao === -1) idxPadrao = mesInsc === 'dez' ? MESES.length - 1 : 0;
  const linha = (rotulo, valor)=> valor ? `<div class="ficha-linha"><span>${rotulo}</span><strong>${valor}</strong></div>` : '';
  const tel = a.telefone ? a.telefone.replace(/^55(?=\d{10,11}$)/, '') : '';
  openModal(`
    <h3>Revisar inscrição</h3>
    <div class="ficha">
      ${linha('Atleta', a.nome)}
      ${linha('Nascimento', a.nascimento + (a.idade!=='' && a.idade!==undefined ? ' · ' + a.idade + ' anos' : ''))}
      ${linha('RG', a.rg)}
      ${linha('Mãe', a.filiacaoMae)}
      ${linha('Pai', a.filiacaoPai)}
      ${linha('Responsável', a.responsavel)}
      ${linha('WhatsApp', tel)}
      ${linha('Uniforme', a.perfil && a.perfil.tamanhoCamisa)}
      ${linha('Observações', a.observacoesInscricao)}
      ${linha('Enviada em', a.dataEnvioInscricao ? a.dataEnvioInscricao.split('-').reverse().join('/') : '')}
    </div>
    <div class="field-row">
      <div class="field">
        <label>Categoria</label>
        <select id="ap-categoria">${CATEGORIAS.map(c=>`<option value="${c}" ${a.categoria===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Começa a pagar em</label>
        <select id="ap-mes">${MESES.map((m,i)=>`<option value="${m.key}" ${i===idxPadrao?'selected':''}>${m.label}</option>`).join('')}</select>
      </div>
    </div>
    <div class="check-row">
      <input type="checkbox" id="ap-matricula" ${a.matricula && a.matricula.pago ? 'checked' : ''}>
      <label for="ap-matricula">Matrícula (${fmtBRL(a.matricula ? a.matricula.valor : DB.valorMatricula)}) já paga</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="ap-bolsista" ${a.bolsista ? 'checked' : ''}>
      <label for="ap-bolsista">Aluno bolsista (isento de mensalidade)</label>
    </div>
    ${a.telefone ? `<div class="check-row">
      <input type="checkbox" id="ap-whats" checked>
      <label for="ap-whats">Abrir WhatsApp com mensagem de boas-vindas</label>
    </div>` : ''}
    <div class="modal-actions">
      <button class="btn btn-danger" id="ap-recusar" style="margin-right:auto;">Recusar</button>
      <button class="btn btn-ghost" id="ap-cancelar">Depois</button>
      <button class="btn btn-gold" id="ap-aprovar">Aprovar</button>
    </div>
  `);
  document.getElementById('ap-cancelar').addEventListener('click', ()=>{ closeModal(); render(); });
  document.getElementById('ap-recusar').addEventListener('click', ()=>{
    if(!confirm('Recusar e apagar a inscrição de ' + a.nome + '?')) return;
    DB.atletas = DB.atletas.filter(x=>x.id!==a.id);
    logAcao('Inscrições', 'Inscrição de ' + a.nome + ' recusada');
    closeModal(); saveDB(); render();
  });
  document.getElementById('ap-aprovar').addEventListener('click', ()=>{
    const mesKey = document.getElementById('ap-mes').value;
    const mesLabel = MESES.find(m=>m.key===mesKey).label;
    const bolsista = document.getElementById('ap-bolsista').checked;
    const ano = (a.dataEnvioInscricao || dataISOlocal(new Date())).slice(0,4);
    a.categoria = document.getElementById('ap-categoria').value;
    a.dataInscricao = ano + '-' + String(mapa.indexOf(mesKey)+1).padStart(2,'0') + '-01';
    a.bolsista = bolsista;
    a.status = 'ativo';
    delete a.novaInscricao;
    a.matricula = { valor: a.matricula ? a.matricula.valor : DB.valorMatricula, pago: document.getElementById('ap-matricula').checked };
    a.mensalidades = Object.fromEntries(MESES.map(m=>[m.key, bolsista ? 'BOLSA' : (((a.mensalidades||{})[m.key] || '-') === 'BOLSA' ? '-' : ((a.mensalidades||{})[m.key] || '-'))]));
    logAcao('Inscrições', 'Inscrição de ' + a.nome + ' aprovada (' + a.categoria + ') — conta a partir de ' + mesLabel);
    const whats = document.getElementById('ap-whats');
    const abrirBoasVindas = whats && whats.checked;
    closeModal(); saveDB(); render();
    toast('Inscrição aprovada!');
    if(abrirBoasVindas){
      const primeiro = (a.responsavel || '').split(' ')[0];
      const msg = 'Olá' + (primeiro ? ', ' + primeiro : '') + '! A inscrição de ' + a.nome + ' na Alleanza Escola de Futsal foi confirmada ✅\n\n'
        + '⚽ Categoria: ' + a.categoria + '\n'
        + (a.matricula.pago ? '' : '🎟️ Matrícula: ' + fmtBRL(a.matricula.valor) + '\n')
        + (bolsista ? '🎓 Aluno bolsista\n' : '💳 Mensalidade: ' + fmtBRL(DB.valorMensalidade) + ' a partir de ' + mesLabel + '\n')
        + '🔑 Pix (e-mail): ' + PIX_CHAVE + '\n\nSeja bem-vindo(a) à família Alleanza!';
      abrirWhatsApp('https://api.whatsapp.com/send?phone=' + normalizePhone(a.telefone) + '&text=' + encodeURIComponent(msg));
    }
  });
}

/* ============================================================
   DADOS PRIVADOS — só com administrador logado
============================================================ */
function pararDadosPrivados(){
  if(unsubDadosPrivados){ unsubDadosPrivados(); unsubDadosPrivados = null; }
  if(unsubInscricoesWeb){ unsubInscricoesWeb(); unsubInscricoesWeb = null; }
  FILA_INSCRICOES = [];
  DB = null;
  DB_PENDENTE = null;
}

function assinarDadosPrivados(){
  if(unsubDadosPrivados) return;
  unsubDadosPrivados = FIREBASE_DOC_REF.onSnapshot(snap=>{
    if(snap.exists){
      const novoDB = migrarDB(snap.data());
      if(modalAberto && DB){
        // Não troca o DB debaixo de um modal aberto — isso quebraria a
        // referência ao item sendo editado. Aplica quando o modal fechar.
        DB_PENDENTE = novoDB;
        return;
      }
      DB = novoDB;
    } else {
      // Documento novo na nuvem: aproveita o cache deste navegador, se houver.
      const raw = (function(){ try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; } })();
      if(raw){
        try{ DB = migrarDB(JSON.parse(raw)); }
        catch(e){ DB = seedDBFresh(); }
      } else {
        DB = seedDBFresh();
      }
      FIREBASE_DOC_REF.set(DB);
    }
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }catch(e){}
    aoDBAtualizado();
    iniciarInscricoesWeb();
    processarFilaInscricoes();
  }, err=>{
    console.error('Erro Firestore (dados do painel):', err);
    unsubDadosPrivados = null;
    if(err && err.code === 'permission-denied'){
      alert('Este usuário não tem permissão para abrir o painel. Confira se o e-mail dele está na lista de administradores nas regras do Firestore (firestore.rules).');
      firebase.auth().signOut();
    } else {
      mostrarErroConexao('Não consegui carregar os dados do painel. Verifique sua internet.');
    }
  });
}

function iniciarFirebase(){
  const configPreenchida = typeof firebaseConfig !== 'undefined'
    && firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('SUBSTITUA');
  if(!configPreenchida || typeof firebase === 'undefined'){
    bootstrapLocal('Firebase não configurado — rodando só com armazenamento local neste navegador.');
    return;
  }
  try{
    if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(firebaseConfig); }
    FIREBASE_DOC_REF = firebase.firestore().collection('alleanza').doc('painel-dados');
    firebase.auth().onAuthStateChanged(user=>{
      if(user && user.isAnonymous){
        // Sessão anônima da versão antiga do painel — não dá mais acesso.
        firebase.auth().signOut();
        return;
      }
      ADMIN_USER = user || null;
      if(user){
        const status = document.getElementById('sb-sync-status');
        if(status) status.textContent = user.email || 'Sincronizado';
        assinarDadosPrivados();
      } else {
        pararDadosPrivados();
        mostrarLogin();
      }
    });
  }catch(err){
    console.error('Erro ao iniciar Firebase:', err);
    bootstrapLocal('Falha ao iniciar o Firebase — caindo para armazenamento local.');
  }
}

/* ============================================================
   INIT — Firebase (com fallback automático pra armazenamento local
   se a configuração não estiver preenchida ou a conexão falhar)
============================================================ */
function esconderTelaCarregamento(){
  if(window.__alleanzaMarcarCarregado) window.__alleanzaMarcarCarregado();
  const overlay = document.getElementById('loading-overlay');
  if(overlay) overlay.remove();
}
function mostrarErroConexao(msg){
  const overlay = document.getElementById('loading-overlay');
  if(!overlay) return;
  overlay.innerHTML = `
    <div style="text-align:center;max-width:340px;padding:20px;">
      <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
      <div style="font-weight:800;font-size:15px;margin-bottom:8px;color:#f0938d;">Não consegui conectar</div>
      <div style="font-size:13px;color:rgba(246,243,236,0.7);line-height:1.6;margin-bottom:16px;">${msg}</div>
      <button onclick="location.reload()" style="background:linear-gradient(135deg,#c9a24a,#a97f2f);color:#081729;border:none;padding:10px 20px;border-radius:9px;font-weight:800;cursor:pointer;">Tentar novamente</button>
    </div>`;
}
function localStorageDisponivel(){
  try{
    const testKey = '__teste_storage__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}
function bootstrapLocal(motivo){
  if(motivo) console.warn(motivo);
  const raw = (function(){ try{ return localStorage.getItem(STORAGE_KEY); }catch(e){ return null; } })();
  if(raw){
    try{ DB = migrarDB(JSON.parse(raw)); }
    catch(e){ DB = seedDBFresh(); }
  } else {
    DB = seedDBFresh();
  }
  aoDBAtualizado();
  if(!localStorageDisponivel()){
    setTimeout(mostrarAvisoStorageBloqueado, 300);
  }
}
iniciarFirebase();
