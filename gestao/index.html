<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" id="app-favicon" href="data:,">
<link rel="apple-touch-icon" id="app-touch-icon" href="data:,">
<meta name="theme-color" content="#060f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alleanza">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Painel Alleanza">
<meta name="description" content="Painel de Gestão — Alleanza Escola de Futsal">
<link rel="manifest" href="manifest.webmanifest">
<title>Painel de Gestão — Alleanza Escola de Futsal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Melhorias de toque e usabilidade em celular */
button, .btn, .icon-btn, .mes-cell, .chip-check, .nav button, .tabbar button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
input, select, textarea {
  font-size: 16px; /* evita zoom automático no iOS ao focar */
}
@media (max-width: 860px) {
  .btn, .icon-btn { min-height: 44px; }
  .icon-btn { width: 40px; height: 40px; }
  .mes-cell { min-width: 64px; padding: 10px 8px; }
}
:root{
  --navy:#0c2340;
  --navy-deep:#081729;
  --navy-card:#0f2c50;
  --gold:#c9a24a;
  --gold-light:#e4c878;
  --green:#2e7d4f;
  --green-soft:rgba(46,125,79,0.18);
  --red:#c6362f;
  --red-soft:rgba(198,54,47,0.18);
  --cream:#f6f3ec;
  --line:rgba(201,162,74,0.25);
  --muted:rgba(246,243,236,0.55);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:
    radial-gradient(circle at 10% 0%, rgba(201,162,74,0.08), transparent 40%),
    radial-gradient(circle at 100% 10%, rgba(46,125,79,0.08), transparent 40%),
    var(--navy-deep);
  color:var(--cream);
  min-height:100vh;
}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:rgba(201,162,74,0.35);border-radius:8px;}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:230px;flex-shrink:0;
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%);
  border-right:1px solid var(--line);
  padding:22px 16px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.sb-logo img, .sb-logo svg{width:40px;height:40px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.4));}
.app-logo-img{border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px rgba(201,162,74,0.5);}
.sb-brand{font-family:'Playfair Display',serif;font-weight:800;font-size:16px;letter-spacing:1px;line-height:1.1;}
.sb-sub{font-size:9.5px;letter-spacing:1.5px;color:var(--gold-light);text-transform:uppercase;margin-top:2px;}
.sb-title{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin:26px 0 10px 4px;}
.nav{display:flex;flex-direction:column;gap:4px;}
.nav button{
  display:flex;align-items:center;gap:10px;
  background:transparent;border:none;
  color:rgba(246,243,236,0.72);
  padding:11px 12px;border-radius:10px;
  font-family:'Inter',sans-serif;font-size:13.5px;font-weight:600;
  cursor:pointer;text-align:left;width:100%;
  transition:background .15s ease, color .15s ease;
}
.nav button .ic{font-size:16px;width:20px;text-align:center;}
.nav button:hover{background:rgba(255,255,255,0.05);color:var(--cream);}
.nav button.active{
  background:linear-gradient(135deg,rgba(201,162,74,0.22),rgba(201,162,74,0.06));
  color:var(--gold-light);
  box-shadow:inset 0 0 0 1px rgba(201,162,74,0.3);
}
.sb-foot{margin-top:auto;font-size:10.5px;color:rgba(246,243,236,0.35);letter-spacing:0.5px;padding:6px 4px;}

.topbar{
  display:none;
  align-items:center;justify-content:space-between;
  padding:14px 16px;
  background:linear-gradient(180deg,var(--navy),var(--navy-deep));
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.topbar .tb-brand{display:flex;align-items:center;gap:9px;}
.topbar img, .topbar svg{width:30px;height:30px;object-fit:contain;}
.topbar .tb-name{font-family:'Playfair Display',serif;font-weight:800;font-size:14.5px;}
.topbar .tb-name small{display:block;font-size:8.5px;letter-spacing:1.5px;color:var(--gold-light);font-weight:600;}

.tabbar{
  display:none;
  gap:6px;
  overflow-x:auto;
  padding:10px 12px;
  background:var(--navy-deep);
  border-bottom:1px solid var(--line);
  position:sticky;top:57px;z-index:19;
  -webkit-overflow-scrolling:touch;
}
.tabbar::-webkit-scrollbar{display:none;}
.tabbar button{
  flex-shrink:0;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--line);
  color:rgba(246,243,236,0.65);
  padding:8px 14px;border-radius:999px;
  font-size:12.5px;font-weight:700;
  display:flex;align-items:center;gap:6px;
  cursor:pointer;
}
.tabbar button.active{
  background:linear-gradient(135deg,var(--gold),#a97f2f);
  color:var(--navy-deep);border-color:transparent;
}

.main{flex:1;min-width:0;padding:30px 40px 60px;max-width:1400px;}
.view-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;margin:0 0 4px;}
.view-sub{font-size:13px;color:var(--muted);margin:0 0 22px;}

/* Versão Desktop: layout de sidebar sempre ativo, independente da largura da janela. */

/* ---------- COMMON UI ---------- */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
}
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
.kpi{
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
  border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;
  position:relative;overflow:hidden;
}
.kpi .kpi-ic{font-size:18px;opacity:0.8;margin-bottom:8px;}
.kpi .kpi-val{font-family:'Playfair Display',serif;font-size:24px;font-weight:800;color:var(--cream);}
.kpi .kpi-label{font-size:11px;color:var(--muted);letter-spacing:0.4px;margin-top:3px;}
.kpi.accent-green .kpi-val{color:#8fd6a8;}
.kpi.accent-red .kpi-val{color:#f0938d;}
.kpi.accent-gold .kpi-val{color:var(--gold-light);}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.toolbar input[type=text], .toolbar select{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
  border-radius:9px;padding:9px 12px;color:var(--cream);font-family:'Inter',sans-serif;
  font-size:13px;outline:none;
}
.toolbar select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23e4c878' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;padding-right:28px;}
.toolbar input:focus, .toolbar select:focus{border-color:var(--gold);}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:9px;border:none;cursor:pointer;
  font-family:'Inter',sans-serif;font-weight:700;font-size:13px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(1px);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#a97f2f);color:var(--navy-deep);}
.btn-gold:hover{box-shadow:0 6px 16px rgba(201,162,74,0.35);}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--cream);border:1px solid rgba(255,255,255,0.14);}
.btn-ghost:hover{background:rgba(255,255,255,0.1);}
.btn-danger{background:rgba(198,54,47,0.16);color:#f0938d;border:1px solid rgba(198,54,47,0.4);}
.btn-danger:hover{background:rgba(198,54,47,0.26);}
.btn-sm{padding:6px 11px;font-size:11.5px;}

/* Table */
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line);}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.8px;}
thead th{
  background:rgba(255,255,255,0.04);
  color:var(--gold-light);
  text-align:left;padding:11px 12px;
  font-size:10.5px;letter-spacing:0.6px;text-transform:uppercase;
  white-space:nowrap;position:sticky;top:0;z-index:2;
}
tbody td{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.06);white-space:nowrap;}
tbody tr:hover{background:rgba(255,255,255,0.03);}
td.sticky-col, th.sticky-col{
  position:sticky;left:0;z-index:3;
  background:var(--navy-card);
  box-shadow:2px 0 6px rgba(0,0,0,0.25);
}
thead th.sticky-col{z-index:4;}
.cat-badge{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:700;
  background:rgba(201,162,74,0.15);color:var(--gold-light);border:1px solid rgba(201,162,74,0.35);
}
.mes-cell{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:58px;padding:6px 8px;border-radius:8px;
  font-size:11px;font-weight:700;cursor:pointer;user-select:none;
  border:1px solid transparent;
}
.mes-cell.pago{background:var(--green-soft);color:#8fd6a8;border-color:rgba(46,125,79,0.4);}
.mes-cell.pendente{background:var(--red-soft);color:#f0938d;border-color:rgba(198,54,47,0.35);}
.mes-cell.isento{background:rgba(125,196,224,0.15);color:#7dc4e0;border-color:rgba(125,196,224,0.4);}
.mes-cell.bolsa{background:rgba(201,162,74,0.15);color:var(--gold-light);border-color:rgba(201,162,74,0.35);cursor:default;}
.mes-cell.naoaplica{background:rgba(255,255,255,0.025);color:rgba(246,243,236,0.28);border-color:rgba(255,255,255,0.07);cursor:default;}
/* Corrige dropdowns "apagados": alguns navegadores ignoram a cor do <select>
   na lista de opções e usam cores do sistema, deixando o texto ilegível até
   passar o mouse/focar. Forçamos cor e fundo explícitos nas <option>. */
select option{
  background:var(--navy-card);
  color:var(--cream);
}
.mes-cell:active{transform:scale(0.95);}
.name-cell{font-weight:700;color:var(--cream);cursor:pointer;}
.name-cell:hover{color:var(--gold-light);}
.resp-cell{color:var(--muted);font-size:12px;}
.row-actions{display:flex;gap:6px;}
.icon-btn{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
  color:var(--cream);width:28px;height:28px;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;
}
.icon-btn:hover{background:rgba(255,255,255,0.12);}
.icon-btn.danger:hover{background:rgba(198,54,47,0.25);color:#f0938d;}

.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;}

/* Chart bars */
.chart-card{margin-bottom:22px;}
.chart-row{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;}
.bar{
  width:100%;max-width:34px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,var(--gold-light),var(--gold));
  transition:height .4s ease;
  min-height:3px;
}
.bar-label{font-size:9.5px;color:var(--muted);letter-spacing:0.4px;}
.bar-val{font-size:9.5px;color:var(--gold-light);font-weight:700;}

/* Competitions */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
.comp-card{
  background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
  border:1px solid var(--line);border-radius:14px;padding:18px;
  display:flex;flex-direction:column;gap:8px;
}
.comp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.comp-name{font-family:'Playfair Display',serif;font-weight:700;font-size:16.5px;color:var(--cream);}
.status-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;letter-spacing:0.3px;text-transform:uppercase;}
.status-agendada{background:rgba(201,162,74,0.15);color:var(--gold-light);border:1px solid rgba(201,162,74,0.35);}
.status-andamento{background:var(--green-soft);color:#8fd6a8;border:1px solid rgba(46,125,79,0.4);}
.status-concluida{background:rgba(255,255,255,0.08);color:var(--muted);border:1px solid rgba(255,255,255,0.12);}
.comp-meta{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px;}
.comp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.08);}
.comp-inscritos{font-size:12px;color:var(--gold-light);font-weight:700;}

/* Modal */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(4,10,20,0.72);
  backdrop-filter:blur(3px);z-index:100;align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex;}
.modal{
  width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,var(--navy-card),var(--navy));
  border:1px solid var(--line);border-radius:16px;padding:22px;
}
.modal h3{font-family:'Playfair Display',serif;margin:0 0 16px;font-size:19px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);margin-bottom:6px;font-weight:700;}
.field input, .field select, .field textarea{
  width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);
  border-radius:9px;padding:10px 12px;color:var(--cream);font-family:'Inter',sans-serif;font-size:13.5px;outline:none;
}
.field select{appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23e4c878' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;}
.field textarea{resize:vertical;min-height:60px;font-family:'Inter',sans-serif;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;}
.check-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
.check-row input{width:16px;height:16px;}
.check-row label{font-size:12.5px;color:var(--cream);text-transform:none;letter-spacing:0;}

/* Toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);
  background:linear-gradient(135deg,var(--gold),#a97f2f);color:var(--navy-deep);
  padding:11px 20px;border-radius:999px;font-weight:700;font-size:13px;
  box-shadow:0 10px 24px rgba(0,0,0,0.35);
  opacity:0;pointer-events:none;transition:all .3s ease;z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-top:1px solid rgba(255,255,255,0.07);}
.settings-row:first-child{border-top:none;}
.settings-row .st-label{font-size:13px;font-weight:600;}
.settings-row .st-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* Balanço */
.saldo-pos{color:#8fd6a8;font-weight:800;}
.saldo-neg{color:#f0938d;font-weight:800;}
.editable-val{cursor:pointer;border-bottom:1px dashed rgba(228,200,120,0.4);}
.editable-val:hover{color:var(--gold-light);}
.chart-row-dual{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px;}
.bar-col-dual{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;}
.bar-pair{display:flex;align-items:flex-end;gap:3px;height:100%;}
.bar-mini{width:12px;border-radius:4px 4px 2px 2px;min-height:3px;}
.bar-mini.receita{background:linear-gradient(180deg,#8fd6a8,#2e7d4f);}
.bar-mini.despesa{background:linear-gradient(180deg,#f0938d,#c6362f);}
.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;}
.note-box{
  background:rgba(198,54,47,0.08);border:1px dashed rgba(198,54,47,0.35);
  border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.6;color:rgba(246,243,236,0.75);
  margin-bottom:16px;
}

.file-list-modal{display:flex;flex-direction:column;gap:6px;}
.doc-link{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);
  border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--gold-light);
  text-decoration:none;
}
.doc-link:hover{background:rgba(201,162,74,0.1);}

/* ---------- Calendário ---------- */
.evento-card{
  display:flex;gap:14px;align-items:flex-start;
  background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;
}
.evento-data{
  flex-shrink:0;width:58px;text-align:center;
  background:rgba(201,162,74,0.12);border:1px solid var(--line);border-radius:10px;padding:8px 4px;
}
.evento-data .dia{font-family:'Playfair Display',serif;font-size:20px;font-weight:800;color:var(--gold-light);line-height:1;}
.evento-data .mes{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.evento-body{flex:1;min-width:0;}
.evento-body .tit{font-weight:700;font-size:14.5px;margin-bottom:3px;}
.evento-body .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;margin-bottom:4px;}
.evento-body .obs{font-size:12px;color:rgba(246,243,236,0.7);}
.evento-passado{opacity:0.55;}

/* ---------- Nutrição / Exercícios ---------- */
.info-card{
  background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.02));
  border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;
}
.info-card h3{font-family:'Playfair Display',serif;font-size:15.5px;margin:0 0 10px;color:var(--gold-light);display:flex;align-items:center;gap:8px;}
.info-card ul{margin:0;padding-left:18px;}
.info-card li{font-size:13px;line-height:1.7;color:rgba(246,243,236,0.85);margin-bottom:4px;}
.info-card p{font-size:13px;line-height:1.7;color:rgba(246,243,236,0.85);margin:0 0 8px;}
.cat-tag{
  display:inline-block;background:rgba(201,162,74,0.18);border:1px solid var(--line);
  color:var(--gold-light);font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;margin-bottom:10px;
}

/* ---------- Escalação ---------- */
.escala-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.escala-header > button{flex-shrink:0;white-space:nowrap;}
.escala-ic{font-size:24px;}
.escala-hora{font-family:'Playfair Display',serif;font-size:17px;font-weight:800;color:var(--gold-light);}
.chip-check-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.chip-check{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.14);
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;
  cursor:pointer;color:var(--muted);user-select:none;transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.chip-check input{accent-color:var(--gold);width:14px;height:14px;cursor:pointer;}
.chip-check.ativo{
  background:linear-gradient(135deg,rgba(201,162,74,0.22),rgba(201,162,74,0.06));
  border-color:var(--gold);color:var(--gold-light);
}
.escala-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line);}
.escala-sub-group{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 14px;}
.escala-sub-title{font-size:13px;font-weight:800;color:var(--gold-light);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.escala-sub-count{background:rgba(201,162,74,0.18);border-radius:999px;padding:1px 8px;font-size:11px;}
.escala-nomes{margin:0;padding-left:18px;}
.escala-nomes li{font-size:12.5px;line-height:1.9;color:rgba(246,243,236,0.85);}

/* ============================================================
   RESPONSIVO — CELULAR / TABLET (sidebar vira topbar + abas)
============================================================ */
@media (max-width: 860px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .tabbar{display:flex;}
  .app{flex-direction:column;}
  .main{padding:16px 14px 90px;max-width:100%;}
  .view-title{font-size:21px;}
  .card{padding:16px 14px;}
  .grid-kpi{grid-template-columns:repeat(2,1fr) !important;gap:10px;}
  .kpi{padding:12px;}
  .field-row{grid-template-columns:1fr;}
  .toolbar{flex-direction:column;align-items:stretch;}
  .toolbar input, .toolbar select{width:100%;margin-left:0 !important;}
  .toolbar .btn{width:100%;}
  .evento-card{flex-wrap:wrap;}
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important;}
  [style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr) !important;}
  [style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:repeat(2,1fr) !important;}
  [style*="minmax(260px"]{grid-template-columns:1fr !important;}
  .main *{min-width:0;}
}
@media (max-width: 480px){
  .kpi-val{font-size:18px;}
  .view-title{font-size:19px;}
}

/* ============================================================
   ALTERNAR VERSÃO — botão manual força layout mobile ou PC
   independente da largura real da tela
============================================================ */
.js-toggle-layout{
  display:flex;align-items:center;gap:6px;flex-shrink:0;
  background:rgba(255,255,255,0.06);border:1px solid var(--line);
  color:var(--gold-light);border-radius:9px;padding:8px 12px;
  font-family:'Inter',sans-serif;font-size:11.5px;font-weight:700;
  cursor:pointer;white-space:nowrap;transition:background .15s ease;
}
.js-toggle-layout:hover{background:rgba(201,162,74,0.18);}
.sb-toggle-wrap{margin-top:14px;}
.sb-toggle-wrap .js-toggle-layout{width:100%;justify-content:center;}

body.force-desktop .sidebar{display:flex !important;}
body.force-desktop .topbar{display:none !important;}
body.force-desktop .tabbar{display:none !important;}
body.force-desktop .app{flex-direction:row !important;}
body.force-desktop .main{padding:30px 40px 60px !important;max-width:1400px !important;}

body.force-desktop .card{padding:20px !important;}

body.force-desktop .toolbar{flex-direction:row !important;align-items:center !important;}
body.force-desktop .toolbar input, body.force-desktop .toolbar select{width:auto !important;}
body.force-desktop .toolbar .btn{width:auto !important;}
body.force-desktop [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr 1fr !important;}
body.force-desktop [style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(4,1fr) !important;}
body.force-desktop [style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:repeat(3,1fr) !important;}

body.force-mobile .sidebar{display:none !important;}
body.force-mobile .topbar{display:flex !important;}
body.force-mobile .tabbar{display:flex !important;}
body.force-mobile .app{flex-direction:column !important;}
body.force-mobile .main{padding:16px 14px 90px !important;max-width:100% !important;}
body.force-mobile .view-title{font-size:21px !important;}
body.force-mobile .card{padding:16px 14px !important;}
body.force-mobile .grid-kpi{grid-template-columns:repeat(2,1fr) !important;gap:10px !important;}
body.force-mobile .kpi{padding:12px !important;}
body.force-mobile .field-row{grid-template-columns:1fr !important;}

body.force-mobile .toolbar input, body.force-mobile .toolbar select{width:100% !important;margin-left:0 !important;}
body.force-mobile .toolbar .btn{width:100% !important;}
body.force-mobile .evento-card{flex-wrap:wrap !important;}
body.force-mobile [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr !important;}
body.force-mobile [style*="grid-template-columns:repeat(4,1fr)"]{grid-template-columns:repeat(2,1fr) !important;}
body.force-mobile [style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:repeat(2,1fr) !important;}
body.force-mobile [style*="minmax(260px"]{grid-template-columns:1fr !important;}

/* ============================================================
   CAMADA PREMIUM v2 — refinamento visual por cima do tema
   original (mesmas cores da marca: azul-marinho + dourado),
   com mais profundidade, contraste e acabamento.
============================================================ */
:root{
  --navy-deep:#060f1d;
  --navy:#0a1d36;
  --navy-card:#0d2442;
  --surface:rgba(255,255,255,0.035);
  --surface-2:rgba(255,255,255,0.06);
  --hairline:rgba(255,255,255,0.08);
  --line:rgba(212,175,95,0.22);
  --gold:#d4af5f;
  --gold-light:#ecd393;
  --gold-deep:#a88334;
  --muted:rgba(240,236,226,0.58);
  --cream:#f3efe6;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3), 0 4px 12px -4px rgba(0,0,0,0.35);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,0.7), 0 8px 24px -12px rgba(0,0,0,0.5);
  --ring:0 0 0 3px rgba(212,175,95,0.28);
  --ease:cubic-bezier(.2,.8,.2,1);
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;background:#060f1d;}
body{
  background:
    radial-gradient(1200px 600px at 0% -10%, rgba(212,175,95,0.10), transparent 60%),
    radial-gradient(900px 500px at 110% 0%, rgba(46,125,79,0.08), transparent 60%),
    linear-gradient(180deg, #071426 0%, var(--navy-deep) 60%);
  background-attachment:fixed;
  letter-spacing:-0.005em;
}
::selection{background:rgba(212,175,95,0.35);color:#fff;}
::-webkit-scrollbar-thumb{background:rgba(212,175,95,0.28);border-radius:8px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background-color:rgba(212,175,95,0.45);}

/* Números alinhados em tabelas e indicadores */
.kpi-val, td, .bar-val, .saldo-pos, .saldo-neg, .comp-inscritos, .evento-data .dia{font-variant-numeric:tabular-nums;}

/* Foco visível e consistente (teclado) */
:focus{outline:none;}
:focus-visible{outline:none;box-shadow:var(--ring) !important;border-radius:10px;}

/* ---------- Tela de carregamento ---------- */
#loading-overlay{
  background:
    radial-gradient(600px 400px at 50% 40%, rgba(212,175,95,0.12), transparent 70%),
    var(--navy-deep) !important;
}
.loading-logo{
  width:84px;height:84px;border-radius:50%;object-fit:cover;
  box-shadow:0 0 0 2px rgba(212,175,95,0.5), 0 0 50px rgba(212,175,95,0.25);
  animation:loadingBreath 2.2s ease-in-out infinite;
}
#loading-spinner{width:28px !important;height:28px !important;border-width:2px !important;}
@keyframes loadingBreath{0%,100%{transform:scale(1);opacity:.9;}50%{transform:scale(1.04);opacity:1;}}

/* ---------- Sidebar ---------- */
.sidebar{
  width:252px;
  padding:24px 14px 18px;
  background:
    linear-gradient(180deg, rgba(10,29,54,0.92), rgba(6,15,29,0.96)),
    var(--navy-deep);
  border-right:1px solid var(--hairline);
  box-shadow:inset -1px 0 0 rgba(212,175,95,0.06);
  overflow-y:auto;
}
.sb-logo{padding:4px 8px 18px;border-bottom:1px solid var(--hairline);margin-bottom:4px;gap:12px;}
.sb-logo img, .sb-logo svg{width:44px;height:44px;box-shadow:0 0 0 1.5px rgba(212,175,95,0.55), 0 8px 24px -6px rgba(212,175,95,0.35);}
.sb-brand{font-size:17px;letter-spacing:2.5px;}
.sb-sub{font-size:9px;letter-spacing:2.2px;font-weight:600;}
.sb-title{font-size:10px;letter-spacing:2px;font-weight:700;color:rgba(240,236,226,0.35);margin:20px 0 8px 12px;}
.nav{gap:2px;}
.nav button{
  position:relative;
  padding:10px 12px;border-radius:10px;
  font-size:13.5px;font-weight:500;color:rgba(240,236,226,0.66);
  transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
}
.nav button .ic{
  width:30px;height:30px;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;background:rgba(255,255,255,0.03);
  color:rgba(240,236,226,0.55);
  transition:background .2s var(--ease), color .2s var(--ease);
}
.nav button svg, .tabbar button svg{pointer-events:none;display:block;}
.nav button:hover{background:rgba(255,255,255,0.04);color:var(--cream);}
.nav button:hover .ic{color:var(--gold-light);}
.nav button.active{
  background:linear-gradient(90deg, rgba(212,175,95,0.16), rgba(212,175,95,0.03));
  color:var(--cream);font-weight:600;
  box-shadow:inset 0 0 0 1px rgba(212,175,95,0.18);
}
.nav button.active::before{
  content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));
  box-shadow:0 0 12px rgba(212,175,95,0.6);
}
.nav button.active .ic{background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));color:#0a1729;box-shadow:0 4px 14px -4px rgba(212,175,95,0.6);}
.sb-foot{border-top:1px solid var(--hairline);padding:14px 8px 0;margin-top:16px;color:rgba(240,236,226,0.32);}
.sb-toggle-wrap .js-toggle-layout{background:transparent;border-color:var(--hairline);color:rgba(240,236,226,0.6);font-weight:600;}
.sb-toggle-wrap .js-toggle-layout:hover{color:var(--gold-light);border-color:var(--line);background:rgba(212,175,95,0.06);}

/* ---------- Topo e abas no celular ---------- */
.topbar{
  background:rgba(6,15,29,0.78);
  backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);
  border-bottom:1px solid var(--hairline);
  padding:12px 14px;padding-top:max(12px, env(safe-area-inset-top));
  gap:8px;
}
.topbar .tb-brand{flex:1;min-width:0;}
.topbar .js-toggle-layout{padding:8px 10px;background:var(--surface);border-color:var(--hairline);}
.tabbar{
  background:rgba(6,15,29,0.82);
  backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);
  border-bottom:1px solid var(--hairline);
  padding:8px 12px 10px;gap:6px;
  scroll-snap-type:x proximity;
}
.tabbar button{
  scroll-snap-align:start;
  background:var(--surface);border:1px solid var(--hairline);
  color:rgba(240,236,226,0.7);font-weight:600;font-size:12.5px;
  padding:7px 13px 7px 9px;
  transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.tabbar button .ic{display:inline-flex;opacity:.75;}
.tabbar button svg{width:16px;height:16px;}
.tabbar button.active{
  background:linear-gradient(135deg,var(--gold-light),var(--gold) 50%,var(--gold-deep));
  color:#0a1729;border-color:transparent;
  box-shadow:0 6px 18px -6px rgba(212,175,95,0.65), inset 0 1px 0 rgba(255,255,255,0.35);
}
.tabbar button.active .ic{opacity:1;}

/* ---------- Conteúdo ---------- */
.main{padding:36px 44px 72px;animation:viewIn .35s var(--ease);}
.view-title{
  font-size:30px;letter-spacing:-0.01em;margin-bottom:6px;
  background:linear-gradient(180deg,#fff 0%, #e9dfc6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.view-sub{font-size:13.5px;margin-bottom:26px;max-width:720px;line-height:1.55;}
@keyframes viewIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.card, .info-card, .comp-card, .evento-card, .kpi{
  background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.018));
  border:1px solid var(--hairline);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), var(--shadow-sm);
}
.card{border-radius:18px;padding:22px;}
.info-card, .comp-card, .evento-card{border-radius:16px;}
.comp-card, .evento-card, .info-card{transition:transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);}
.comp-card:hover, .evento-card:hover, .info-card:hover{transform:translateY(-2px);border-color:rgba(212,175,95,0.28);box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), var(--shadow-lg);}

/* KPIs com filete dourado e leve elevação */
.grid-kpi{gap:16px;margin-bottom:26px;}
.kpi{border-radius:16px;padding:18px 18px 16px;transition:transform .25s var(--ease), border-color .25s var(--ease);}
.kpi::before{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;
  background:linear-gradient(90deg, transparent, rgba(212,175,95,0.7), transparent);
  opacity:.55;
}
.kpi::after{
  content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle, rgba(212,175,95,0.10), transparent 70%);pointer-events:none;
}
.kpi:hover{transform:translateY(-2px);border-color:rgba(212,175,95,0.3);}
.kpi .kpi-ic{
  width:34px;height:34px;border-radius:10px;font-size:16px;opacity:1;
  display:flex;align-items:center;justify-content:center;
  background:rgba(212,175,95,0.10);border:1px solid rgba(212,175,95,0.18);
}
.kpi .kpi-val{font-family:'Inter',sans-serif;font-weight:800;font-size:26px;letter-spacing:-0.02em;}
.kpi .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:4px;}
.kpi.accent-green::before{background:linear-gradient(90deg, transparent, rgba(143,214,168,0.8), transparent);}
.kpi.accent-red::before{background:linear-gradient(90deg, transparent, rgba(240,147,141,0.8), transparent);}

/* ---------- Botões ---------- */
.btn{
  border-radius:10px;padding:10px 16px;font-weight:600;letter-spacing:0.01em;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease), filter .2s var(--ease);
}
.btn-gold{
  background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 45%,var(--gold-deep) 100%);
  color:#0a1729;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.4), 0 6px 18px -8px rgba(212,175,95,0.7);
}
.btn-gold:hover{filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), 0 10px 26px -8px rgba(212,175,95,0.8);transform:translateY(-1px);}
.btn-gold:disabled{opacity:.6;cursor:wait;transform:none;}
.btn-ghost{background:var(--surface-2);border:1px solid var(--hairline);}
.btn-ghost:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.16);}
.btn-danger{background:rgba(198,54,47,0.12);border-color:rgba(198,54,47,0.35);}
.btn-link{background:none;border:none;color:var(--gold-light);padding:10px 4px;font-weight:600;}
.btn-link:hover{text-decoration:underline;text-underline-offset:3px;}
.icon-btn{border-radius:9px;background:var(--surface-2);border-color:var(--hairline);transition:background .2s var(--ease), transform .15s var(--ease);}
.icon-btn:hover{transform:translateY(-1px);}

/* ---------- Campos ---------- */
.toolbar input[type=text], .toolbar select, .field input, .field select, .field textarea{
  background:rgba(0,0,0,0.22);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
}
.toolbar input[type=text]:focus, .toolbar select:focus, .field input:focus, .field select:focus, .field textarea:focus{
  border-color:rgba(212,175,95,0.6);box-shadow:var(--ring);background:rgba(0,0,0,0.3);
}
.field label{font-size:10px;letter-spacing:1.4px;font-weight:600;color:rgba(236,211,147,0.85);}

/* ---------- Tabelas ---------- */
.table-wrap{border:1px solid var(--hairline);border-radius:16px;background:rgba(0,0,0,0.12);box-shadow:var(--shadow-sm);}
thead th{
  background:rgba(10,29,54,0.92);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:rgba(236,211,147,0.85);font-weight:600;letter-spacing:1px;
  border-bottom:1px solid var(--hairline);padding:12px 14px;
}
tbody td{padding:11px 14px;border-top:1px solid rgba(255,255,255,0.045);}
tbody tr:nth-child(even){background:rgba(255,255,255,0.012);}
tbody tr{transition:background .15s ease;}
tbody tr:hover{background:rgba(212,175,95,0.05);}
td.sticky-col, th.sticky-col{background:#0b2040;}
.name-cell{font-weight:600;}
.mes-cell{border-radius:8px;font-weight:600;letter-spacing:.2px;transition:transform .12s var(--ease), filter .15s ease;}
.mes-cell:hover{filter:brightness(1.15);}
.cat-badge, .status-pill, .cat-tag{font-weight:600;letter-spacing:.5px;}

/* ---------- Gráficos de barras ---------- */
.bar{border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--gold-light),var(--gold-deep));box-shadow:0 0 18px -6px rgba(212,175,95,0.6);}

/* ---------- Modal ---------- */
.overlay{background:rgba(3,8,16,0.66);backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);}
.overlay.show .modal{animation:modalIn .28s var(--ease);}
.modal{
  max-width:480px;border-radius:20px;padding:26px;
  background:linear-gradient(180deg,#10284a 0%, #0a1c35 100%);
  border:1px solid rgba(212,175,95,0.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.06), var(--shadow-lg), 0 0 0 1px rgba(0,0,0,0.3);
}
.modal h3{font-size:21px;letter-spacing:-0.01em;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}

/* Login */
.login-head{text-align:center;margin-bottom:18px;}
.login-logo{width:64px;height:64px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(212,175,95,0.5), 0 10px 30px -8px rgba(212,175,95,0.45);margin-bottom:12px;}
.login-head h3{margin:0 0 4px;}
.login-head p{margin:0;font-size:12.5px;color:var(--muted);}
.login-erro{font-size:12.5px;color:#f0938d;background:rgba(198,54,47,0.10);border:1px solid rgba(198,54,47,0.3);border-radius:10px;padding:9px 12px;margin:-2px 0 6px;line-height:1.45;}
.login-erro.ok{color:#8fd6a8;background:rgba(46,125,79,0.12);border-color:rgba(46,125,79,0.35);}
.login-actions{align-items:center;flex-wrap:wrap;}

/* ---------- Toast ---------- */
.toast{
  background:rgba(13,36,66,0.92);color:var(--cream);
  border:1px solid rgba(212,175,95,0.35);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-weight:600;padding:12px 20px;
  box-shadow:var(--shadow-lg);
  bottom:max(22px, env(safe-area-inset-bottom));
}


/* ---------- Celular ---------- */
@media (max-width: 860px){
  .main{padding:18px 16px 96px;}
  .view-title{font-size:23px;}
  .kpi .kpi-val{font-size:21px;}
  .grid-kpi{gap:10px;}
  .modal{padding:22px 18px;border-radius:20px 20px 0 0;max-height:92vh;}
  .overlay{align-items:flex-end;padding:0;}
  .overlay.show .modal{animation:sheetIn .3s var(--ease);max-width:100%;padding-bottom:max(22px, env(safe-area-inset-bottom));}
  .tabbar{top:calc(57px + env(safe-area-inset-top));}
}
body.force-mobile .main{padding:18px 16px 96px !important;}
body.force-desktop .main{padding:36px 44px 72px !important;}
body.force-desktop .view-title{font-size:30px !important;}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}


/* ============================================================

<script>
/* Relógio de segurança: se em 9s os dados ainda não tiverem terminado
   de carregar de verdade (Firebase OU modo local), mostra um aviso claro
   em vez de girar pra sempre. Cobre tanto o caso do script nem chegar a
   rodar (SDK travado) quanto o caso do script rodar mas o Firebase
   (autenticação/Firestore) ficar pendurado sem responder nem dar erro —
   esse segundo caso é o mais comum em apps que bloqueiam a API do Google
   mas deixam o arquivo .js do CDN carregar. Não depende de nenhum outro
   script: só é cancelado quando esconderTelaCarregamento() roda de verdade. */
(function(){
  var jaCarregou = false;
  window.__alleanzaMarcarCarregado = function(){ jaCarregou = true; };
  setTimeout(function(){
    if(jaCarregou) return;
    var overlay = document.getElementById('loading-overlay');
    if(!overlay) return;
    overlay.innerHTML =
      '<div style="text-align:center;max-width:320px;padding:20px;">' +
        '<div style="font-size:32px;margin-bottom:12px;">📶</div>' +
        '<div style="font-weight:800;font-size:15px;margin-bottom:8px;color:#f0938d;">Sem conexão com o servidor</div>' +
        '<div style="font-size:13px;color:rgba(246,243,236,0.7);line-height:1.6;margin-bottom:16px;">' +
          'Não consegui carregar os dados. Se você abriu este arquivo dentro de outro ' +
          'aplicativo (WhatsApp, Files, um app de chat), tente abrir com o Safari ou ' +
          'Chrome do celular — alguns apps bloqueiam o acesso à internet de arquivos abertos por dentro deles.' +
        '</div>' +
        '<button onclick="location.reload()" style="background:linear-gradient(135deg,#c9a24a,#a97f2f);color:#081729;border:none;padding:10px 20px;border-radius:9px;font-weight:800;cursor:pointer;font-family:Inter,sans-serif;">Tentar novamente</button>' +
      '</div>';
  }, 9000);
})();
</script>

const MESES = [
  {key:'fev', label:'Fev'}, {key:'mar', label:'Mar'}, {key:'abr', label:'Abr'},
  {key:'mai', label:'Mai'}, {key:'jun', label:'Jun'}, {key:'jul', label:'Jul'},
  {key:'ago', label:'Ago'}, {key:'set', label:'Set'}, {key:'out', label:'Out'},
  {key:'nov', label:'Nov'}
];
/* Mês de referência do painel: calculado a partir da data real do
   aparelho, não fixo — assim o Dashboard e a Verificação por mês sempre
   abrem no mês em que o arquivo está sendo usado. O ano letivo vai de
   fev a nov; se o arquivo for aberto em jan/dez (recesso), cai no mês
   letivo mais próximo (fev ou nov). */
function calcularMesAtual(){
  const mapa = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const key = mapa[new Date().getMonth()];
  if(MESES.some(m=>m.key===key)) return key;
  return key==='jan' ? 'fev' : 'nov';
}
const MES_ATUAL = calcularMesAtual();
const CATEGORIAS = ['SUB7','SUB9','SUB11','SUB13','SUB15'];

function seedAtletas(){
  /* Sem dados pessoais no código-fonte (o arquivo é público). Os alunos
     reais ficam só no Firestore, protegidos pelo login. */
  const base = [];
  const telefones = [];
  return base.map((r,i)=>{
    const mensal = {};
    MESES.forEach((m,idx)=>{
      if(r[5]) { mensal[m.key] = 'BOLSA'; }
      else { mensal[m.key] = r[6][idx] !== undefined ? r[6][idx] : '-'; }
    });
    return {
      id:'atl_'+(i+1),
      categoria:r[0], nome:r[1], idade:r[2], nascimento:r[3], responsavel:r[4],
      telefone: telefones[i] || '', bolsista:r[5], status:'ativo',
      dataInscricao:'2026-02-01', dataDesistencia:null, motivoDesistencia:'',
      matricula:{valor:75, pago:true}, // atletas já ativos no snapshot: matrícula já quitada
      perfil:{tamanhoCamisa:'', peso:'', anotacoes:[], feedbacks:[]},
      mensalidades:mensal

const MESES_BAL = [

  {key:'jun',label:'Jun'},{key:'jul',label:'Jul'},{key:'ago',label:'Ago'},{key:'set',label:'Set'},

function mesBal(receitaManual, andrius, outroLabel, outro){
  const despesas = [];
  if(andrius) despesas.push({id:uid('desp'), label:'Professor Andrius', valor:andrius});
  if(outro) despesas.push({id:uid('desp'), label:outroLabel, valor:outro});
  return { receitaManual: receitaManual||0, outrasReceitas:0, despesas };
}
function seedBalanco(){
  const anoVazio = (outroLabel)=>{
    const meses = {};
    MESES_BAL.forEach(m=>{ meses[m.key] = mesBal(0, 0, outroLabel, 0); });
    return { outroLabel, meses };
  };
  return { '2025': anoVazio('Outro custo'), '2026': anoVazio('Quadra') };
}
/* Migra formato antigo {receita, andrius, outro} para o novo formato flexível
   {receitaManual, outrasReceitas, despesas:[...]} — preserva valores já editados
   pelo usuário em versões anteriores do painel. */
function migrarBalanco(balanco){
  Object.keys(balanco).forEach(ano=>{
    const outroLabel = balanco[ano].outroLabel || 'Outro custo';
    Object.keys(balanco[ano].meses).forEach(mesKey=>{
      const m = balanco[ano].meses[mesKey];
      if(m.despesas === undefined){
        const despesas = [];
        if(m.andrius) despesas.push({id:uid('desp'), label:'Professor Andrius', valor:m.andrius});
        if(m.outro) despesas.push({id:uid('desp'), label:outroLabel, valor:m.outro});
        balanco[ano].meses[mesKey] = { receitaManual:m.receita||0, outrasReceitas:0, despesas };
      }
    });
  });
  return balanco;
}

/* Receita "viva": para 2026 (fev a nov), a receita de mensalidades é recalculada
   em tempo real a partir de quem já está marcado como PAGO na aba Mensalidades —
   inclui ativos + desistentes, pois pagamentos já feitos continuam valendo. */
function calcReceitaViva(mesKey){
  const naoBolsistas = atletasComHistoricoFinanceiro().filter(a=>!a.bolsista);
  const pagos = naoBolsistas.filter(a=>classeStatusMes(statusMesAtleta(a,mesKey))==='pago').length;
  return pagos * DB.valorMensalidade;
}
function receitaMensalidadesBalanco(ano, mesKey){
  if(ano==='2026' && mesKey!=='dez' && MESES.some(m=>m.key===mesKey)){
    return calcReceitaViva(mesKey);
  }
  const m = DB.balanco[ano] && DB.balanco[ano].meses[mesKey];
  return m ? m.receitaManual : 0;
}
function receitaBalanco(ano, mesKey){
  const m = DB.balanco[ano] && DB.balanco[ano].meses[mesKey];
  const outras = m ? (m.outrasReceitas||0) : 0;
  return receitaMensalidadesBalanco(ano, mesKey) + outras;
}
function totalDespesasBalanco(ano, mesKey){
  const m = DB.balanco[ano] && DB.balanco[ano].meses[mesKey];
  if(!m || !m.despesas) return 0;
  return m.despesas.reduce((s,d)=>s+d.valor, 0);
}
function despesasBalanco(ano, mesKey){
  const m = DB.balanco[ano] && DB.balanco[ano].meses[mesKey];
  return m ? m.despesas : [];
}
function receitaEhAoVivo(ano, mesKey){
  return ano==='2026' && mesKey!=='dez' && MESES.some(m=>m.key===mesKey);
}

/* Aplica todas as migrações de formato a um objeto DB vindo de qualquer fonte
   (Firestore, localStorage ou um backup .json importado). */
function migrarDB(parsed){
  if(!parsed.balanco){ parsed.balanco = seedBalanco(); }
  else { parsed.balanco = migrarBalanco(parsed.balanco); }
  if(!parsed.valorMensalidade) parsed.valorMensalidade = 90;
  if(!parsed.valorMatricula) parsed.valorMatricula = 75;
  if(!parsed.atletas) parsed.atletas = [];
  if(!parsed.competicoes) parsed.competicoes = [];
  parsed.atletas.forEach(a=>{ if(!a.matricula) a.matricula = {valor: parsed.valorMatricula, pago:true}; });
  parsed.atletas.forEach(a=>{ if(!a.perfil) a.perfil = {tamanhoCamisa:'', peso:'', anotacoes:[], feedbacks:[]}; });
  if(!parsed.eventos) parsed.eventos = [];
  if(!parsed.escalacao) parsed.escalacao = {slot1:[], slot2:[], slot3:[]};
  // Migração: a escalação era por categoria inteira (ex.: "SUB11" escalado
  // num horário, valendo pra todo mundo do sub). Agora é por atleta, pra
  // dar pra dividir alunos da mesma categoria entre horários diferentes.
  // Uma entrada que bate com o nome de uma categoria é o formato antigo —
  // expande pros IDs dos atletas ativos daquela categoria; o que já for um
  // ID de atleta passa direto.
  ['slot1','slot2','slot3'].forEach(slotKey=>{
    const lista = parsed.escalacao[slotKey] || [];
    const migrada = [];
    lista.forEach(item=>{
      if(CATEGORIAS.includes(item)){
        parsed.atletas.filter(a=>a.categoria===item && a.status==='ativo').forEach(a=>{
          if(!migrada.includes(a.id)) migrada.push(a.id);
        });
      } else if(!migrada.includes(item)){
        migrada.push(item);
      }
    });
    parsed.escalacao[slotKey] = migrada;
  });
  parsed.atletas.forEach(a=>{
    if(a.rg===undefined) a.rg = '';
    if(a.filiacaoMae===undefined) a.filiacaoMae = '';
    if(a.filiacaoPai===undefined) a.filiacaoPai = '';
    if(a.observacoesInscricao===undefined) a.observacoesInscricao = '';
    if(!a.documentos) a.documentos = [];
  });
  parsed.competicoes.forEach(c=>{
    if(c.valorInscricaoTime===undefined) c.valorInscricaoTime = 0;
    if(c.timeInscricaoPaga===undefined) c.timeInscricaoPaga = false;
    if(c.maxAtletas===undefined) c.maxAtletas = 15;
    if(c.horario===undefined) c.horario = '';
    if(c.atletas===undefined) c.atletas = [];
  });
  if(!parsed.pedidos) parsed.pedidos = seedPedidos();
  if(!parsed.log) parsed.log = [];
  if(!parsed.lotes) parsed.lotes = [];
  parsed.pedidos.forEach(p=>{
    if(p.loteId === undefined) p.loteId = null;
    if(p.observacao === undefined) p.observacao = '';
  });
  parsed.pedidos.forEach(p=>{
    if(p.valorPago === undefined){
      p.valorPago = p.statusPagamento === 'pago' ? TIPOS_PEDIDO[p.tipo].valor : 0;
    }
  });
  if(!parsed.pedidosImportadosPlanilha){
    const jaTem = parsed.pedidos.some(p=>p.id==='ped_seed_1');
    if(!jaTem){ parsed.pedidos.push(...seedPedidos()); }
    parsed.pedidosImportadosPlanilha = true;
  }
  return parsed;
}

function saveDB(){
  if(!DB) return;
  let localOk = false;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    localOk = true;
  }catch(e){
    localOk = false;
  }

  if(FIREBASE_DOC_REF){
    // Com Firebase conectado, os dados estão seguros na nuvem mesmo que o
    // cache local falhe — então o "salvo" aqui é sincero.
    FIREBASE_DOC_REF.set(DB).catch(err=>{
      console.error('Erro ao salvar no Firebase:', err);
      toast(err && err.code === 'permission-denied'
        ? '⚠️ Sem permissão para salvar — entre de novo na administração'
        : '⚠️ Não sincronizou — verifique sua internet');
    });
    toast('Alterações salvas');
    return;
  }

  if(localOk){
    toast('Alterações salvas');
  } else {
    // Nem Firebase nem localStorage disponíveis — a alteração existe só na
    // memória desta aba e será perdida ao fechar. Avisa de verdade, sem
    // fingir que salvou.
    toast('⚠️ NÃO SALVOU — veja o aviso');
    mostrarAvisoStorageBloqueado();
  }
}

/* Em que mês (chave de MESES) o atleta se inscreveu, a partir de
   dataInscricao. Retorna null se a data cair fora do ano letivo
   (jan/dez) ou não existir — nesse caso nenhum mês é bloqueado. */
function mesKeyDaData(iso){
  if(!iso) return null;
  const mapa = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return mapa[new Date(iso+'T00:00:00').getMonth()];
}
function atletaAindaNaoInscrito(atleta, mesKey){
  const mesInsc = mesKeyDaData(atleta.dataInscricao);
  const idxInsc = MESES.findIndex(m=>m.key===mesInsc);
  const idxAlvo = MESES.findIndex(m=>m.key===mesKey);
  if(idxInsc===-1 || idxAlvo===-1) return false;
  return idxAlvo < idxInsc;
}
function statusMesAtleta(atleta, mesKey){
  if(atleta.bolsista) return 'BOLSA';
  if(atletaAindaNaoInscrito(atleta, mesKey)) return 'N/A';
  const v = atleta.mensalidades[mesKey];
  return v === undefined ? '-' : v;
}
function classeStatusMes(valor){
  if(valor === 'BOLSA') return 'bolsa';
  if(valor === 'N/A') return 'naoaplica';
  if(valor === 'ISENTO') return 'isento';
  if(valor === '-' || !valor) return 'pendente';
  return 'pago'; // 'PAGO' ou string de data tipo '25/07'
}
/* Ciclo de 3 estados ao clicar: Pendente -> Pago -> Isento -> Pendente */
function proximoStatusMes(valorAtual){
  const cls = classeStatusMes(valorAtual);
  if(cls==='pendente') return 'PAGO';
  if(cls==='pago') return 'ISENTO';
  return '-'; // isento -> pendente
}

  if(!raw) return '';
  let digits = raw.replace(/\D/g,'');
  if(digits.length===10 || digits.length===11) digits = '55'+digits;
  return digits;
}
function linkCobranca(atleta){
  const phone = normalizePhone(atleta.telefone);
  if(!phone) return null;
  return 'https://api.whatsapp.com/send?phone='+phone+'&text='+encodeURIComponent(MSG_COBRANCA);
}
/* Link público do formulário de inscrição — é a página inscricao.html
   publicada junto com o painel (mesmo site do Netlify). */
function linkInscricaoPublico(){
  if(location.protocol === 'file:') return null;
  return new URL('inscricao.html', location.href).href.split('#')[0].split('?')[0];
}
function linkConviteInscricao(){
  const link = linkInscricaoPublico();
  if(!link) return null;
  const msg = 'Olá! Segue o link para a inscrição na Alleanza Escola de Futsal. É rapidinho, leva 2 minutos:\n' + link;
  // sem "phone=" -> abre o seletor de contatos do WhatsApp (funciona igual no celular e no computador)
  return 'https://api.whatsapp.com/send?text='+encodeURIComponent(msg);
}

document.querySelectorAll('.nav button, .tabbar button').forEach(btn=>{

});
function setView(view){
  currentView = view;
  document.querySelectorAll('.nav button, .tabbar button').forEach(b=>{

}

function render(){

  else if(currentView === 'balanco') main.innerHTML = viewBalanco();

  const pendentesNoMes = naoBolsistas.filter(a=>classeStatusMes(statusMesAtleta(a, mesSelecionado))==='pendente').length;
  const inadimplencia = naoBolsistas.length ? Math.round((pendentesNoMes/naoBolsistas.length)*100) : 0;

  // Receita usa histórico financeiro (ativos + desistentes) — mensalidades já
  // pagas por quem saiu continuam contando no mês em que entraram.
  const arrecadado = calcReceitaViva(mesSelecionado);

  const porCategoria = CATEGORIAS.map(c=>({
    cat:c, total: at.filter(a=>a.categoria===c).length

    const pagos = DB.valorMensalidade ? Math.round(valor/DB.valorMensalidade) : 0;

/* ---------- Verificação rápida por mês (agrupada por categoria) + cobrança via WhatsApp ---------- */
function viewVerificacaoMes(){
  const mesObj = MESES.find(m=>m.key===mesSelecionado) || MESES[0];
  let base = ativos();
  if(filtroCategoria) base = base.filter(a=>a.categoria===filtroCategoria);
  if(filtroBusca) base = base.filter(a=>a.nome.toLowerCase().includes(filtroBusca.toLowerCase()));
  base = base.filter(a=>!atletaAindaNaoInscrito(a, mesSelecionado));
  const pendentesCount = base.filter(a=>classeStatusMes(statusMesAtleta(a,mesSelecionado))==='pendente').length;
  const emDiaCount = base.length - pendentesCount;

  function renderItem(a){
    const val = statusMesAtleta(a, mesSelecionado);
    const cls = classeStatusMes(val);
    const pago = cls==='pago';
    const link = linkCobranca(a);
    const label = cls==='bolsa' ? 'BOLSA' : cls==='isento' ? 'ISENTO' : (pago ? (val==='PAGO'?'PAGO':val) : 'PEND');
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,${pago?'0.02':'0.045'});border:1px solid ${cls==='pendente'?'rgba(198,54,47,0.25)':'rgba(255,255,255,0.06)'};margin-bottom:7px;">
        <div style="min-width:0;">
          <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${a.nome}</div>
          <div style="font-size:11px;color:var(--muted);">${a.categoria} · ${a.responsavel || 'sem responsável'}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
          <span class="mes-cell ${cls}" data-atleta="${a.id}" data-mes="${mesSelecionado}" title="Toque para alternar">${label}</span>
          ${cls==='pendente' ? (link
            ? `<button class="btn btn-gold btn-sm" data-cobrar="${link}" data-nome="${a.nome.replace(/"/g,'&quot;')}" data-tel="${a.telefone}">📲 Cobrar</button>
               <button class="icon-btn" data-copiar="${link}" title="Copiar mensagem/número (backup)">📋</button>`
            : `<span class="btn btn-ghost btn-sm" style="opacity:0.4;cursor:not-allowed;" title="Sem telefone cadastrado">📲 Cobrar</span>`
          ) : ''}
        </div>
      </div>`;
  }

  function renderColuna(lista){
    const grupos = CATEGORIAS.map(cat=>{
      const doGrupo = lista.filter(a=>a.categoria===cat).sort((a,b)=>a.nome.localeCompare(b.nome));
      if(!doGrupo.length) return '';
      return `
        <div style="margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span class="cat-badge">${cat}</span>
            <span style="font-size:11px;color:var(--muted);">${doGrupo.length}</span>
          </div>
          ${doGrupo.map(renderItem).join('')}
        </div>`;
    }).join('');
    return grupos || '<div class="empty-state">Ninguém aqui.</div>';
  }

  const pendentesList = base.filter(a=>classeStatusMes(statusMesAtleta(a,mesSelecionado))==='pendente');
  const emDiaList = base.filter(a=>classeStatusMes(statusMesAtleta(a,mesSelecionado))!=='pendente');

  return `
    <div class="card" style="margin-bottom:18px;">
      <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;">
        <div>
          <strong style="font-size:15px;">Verificação por mês</strong>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">Todos os atletas ativos, organizados por status em ${mesObj.label}</div>
        </div>
        <select id="mes-verificacao">
          ${MESES.map(m=>`<option value="${m.key}" ${m.key===mesSelecionado?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>
      <div class="toolbar" style="margin-bottom:16px;">
        <input type="text" id="busca-mensal" placeholder="Buscar atleta..." value="${filtroBusca}">
        <select id="filtro-categoria">

          ${CATEGORIAS.map(c=>`<option value="${c}" ${filtroCategoria===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;">

            <span style="font-size:13px;font-weight:800;color:#f0938d;">⚠️ PENDENTES</span>
            <span style="font-family:'Playfair Display',serif;font-size:18px;font-weight:800;color:#f0938d;">${pendentesCount}</span>

}

function viewBalanco(){
  const anos = Object.keys(DB.balanco).sort();

  let totalReceita=0, totalDespesas=0, totalSaldo=0;
  const maxVal = Math.max(...MESES_BAL.map(m=>{
    const r = receitaBalanco(anoBalanco, m.key);
    const d = totalDespesasBalanco(anoBalanco, m.key);
    return Math.max(r, d);
  }), 1);

  const linhas = MESES_BAL.map(m=>{
    const receita = receitaBalanco(anoBalanco, m.key);
    const despesas = totalDespesasBalanco(anoBalanco, m.key);
    const saldo = receita - despesas;
    totalReceita += receita; totalDespesas += despesas; totalSaldo += saldo;
    const isLive = receitaEhAoVivo(anoBalanco, m.key);
    const hR = Math.max(3, Math.round((receita/maxVal)*120));
    const hD = Math.max(3, Math.round((despesas/maxVal)*120));
    return { label:m.label, key:m.key, receita, despesas, saldo, isLive, hR, hD };
  });

  const bars = linhas.map(l=>`
    <div class="bar-col-dual">
      <div class="bar-pair" title="${l.label}: receita ${fmtBRL(l.receita)} · despesas ${fmtBRL(l.despesas)}">
        <div class="bar-mini receita" style="height:${l.hR}px"></div>
        <div class="bar-mini despesa" style="height:${l.hD}px"></div>
      </div>
      <div class="bar-label">${l.label}</div>
    </div>`).join('');

  const rows = linhas.map(l=>{
    const despesasList = despesasBalanco(anoBalanco, l.key);
    const despesasResumo = despesasList.length
      ? despesasList.map(d=>d.label+' '+fmtBRL(d.valor)).join(' · ')
      : '<span style="color:var(--muted);">sem despesas</span>';
    return `
    <tr>
      <td class="sticky-col"><strong>${l.label}</strong>${l.isLive ? ' <span style="font-size:9.5px;color:var(--gold-light);">● ao vivo</span>' : ''}</td>
      <td>${fmtBRL(l.receita)}</td>
      <td style="max-width:260px;white-space:normal;font-size:11.5px;">${despesasResumo}</td>
      <td class="${l.saldo>=0?'saldo-pos':'saldo-neg'}">${fmtBRL(l.saldo)}</td>
      <td><button class="icon-btn" data-edit-mes-bal="${l.key}" title="Editar mês">✏️</button></td>
    </tr>`;
  }).join('');

  return `
    <h1 class="view-title">Balanço Mensal</h1>
    <p class="view-sub">Receita de mensalidades, outras receitas e despesas — tudo editável, mês a mês.</p>

    <div class="toolbar">
      <select id="ano-balanco">
        ${anos.map(a=>`<option value="${a}" ${a===anoBalanco?'selected':''}>${a}</option>`).join('')}
      </select>
    </div>

    ${anoBalanco==='2026' ? `<div class="note-box">⚠️ Meses marcados com <strong style="color:var(--gold-light)">● ao vivo</strong> puxam a receita de mensalidades direto da aba Mensalidades — pagamentos/isenções marcados lá atualizam o saldo aqui automaticamente. "Outras receitas" (editável por mês) soma-se a isso.</div>` : ''}

    <div class="grid-kpi">
      <div class="kpi accent-green"><div class="kpi-ic">💰</div><div class="kpi-val">${fmtBRL(totalReceita)}</div><div class="kpi-label">Receita no ano</div></div>
      <div class="kpi accent-red"><div class="kpi-ic">📤</div><div class="kpi-val">${fmtBRL(totalDespesas)}</div><div class="kpi-label">Despesas no ano</div></div>
      <div class="kpi ${totalSaldo>=0?'accent-green':'accent-red'}"><div class="kpi-ic">${totalSaldo>=0?'📈':'📉'}</div><div class="kpi-val">${fmtBRL(totalSaldo)}</div><div class="kpi-label">Saldo no ano</div></div>
      <div class="kpi"><div class="kpi-ic">📅</div><div class="kpi-val">${fmtBRL(totalSaldo/11)}</div><div class="kpi-label">Saldo médio mensal</div></div>
    </div>

    <div class="card chart-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <strong style="font-size:14px;">Receita x Despesas por mês</strong>
        <span style="font-size:11px;color:var(--muted);">
          <span class="legend-dot" style="background:#8fd6a8;"></span>Receita
          <span class="legend-dot" style="background:#f0938d;margin-left:10px;"></span>Despesas
        </span>
      </div>
      <div class="chart-row-dual">${bars}</div>
    </div>

    <div class="table-wrap">
      <table style="min-width:680px;">
        <thead>
          <tr>
            <th class="sticky-col">Mês</th>
            <th>Receita total</th>
            <th>Despesas</th>
            <th>Saldo</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>

    <p style="font-size:11.5px;color:var(--muted);margin-top:12px;">Toque no ✏️ de um mês para adicionar/editar despesas e outras receitas.</p>

        <input type="text" id="bal-nova-desp-label" placeholder="Descrição (ex: aluguel quadra)" style="flex:2;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:8px;padding:9px 10px;color:var(--cream);font-size:13px;">
        <input type="text" id="bal-nova-desp-valor" placeholder="Valor" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:8px;padding:9px 10px;color:var(--cream);font-size:13px;">
        <button class="btn btn-ghost btn-sm" id="bal-add-despesa">+ Add</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="bal-cancel">Fechar</button>
      <button class="btn btn-gold" id="bal-save">Salvar</button>
    </div>

    const label = document.getElementById('bal-nova-desp-label').value.trim();
    const valorStr = document.getElementById('bal-nova-desp-valor').value.trim();
    const valor = parseFloat(valorStr.replace(',','.'));
    if(!label || isNaN(valor)){ alert('Preencha descrição e valor da despesa.'); return; }
    m.despesas.push({id:uid('desp'), label, valor});

  document.querySelectorAll('[data-desp-remove]').forEach(btn=>{

    document.querySelectorAll('[data-desp-label]').forEach(inp=>{

      if(d) d.label = inp.value.trim() || d.label;

function viewInscricoes(){
  let lista = [...DB.atletas];
  if(filtroCategoria) lista = lista.filter(a=>a.categoria===filtroCategoria);
  if(filtroBusca) lista = lista.filter(a=>a.nome.toLowerCase().includes(filtroBusca.toLowerCase()));
  lista.sort((a,b)=>{
    if(a.status==='inscricao_pendente' && b.status!=='inscricao_pendente') return -1;
    if(b.status==='inscricao_pendente' && a.status!=='inscricao_pendente') return 1;
    const idA = (a.idade===''||a.idade===null||a.idade===undefined) ? 999 : a.idade;
    const idB = (b.idade===''||b.idade===null||b.idade===undefined) ? 999 : b.idade;
    if(idA !== idB) return idA - idB;
    return a.nome.localeCompare(b.nome);
  });

  const totalAtivos = lista.filter(a=>a.status==='ativo').length;
  const matriculasPendentes = lista.filter(a=>a.status==='ativo' && !a.matricula.pago).length;
  const totalPendentesInsc = pendentesInscricao().length;

  const rows = lista.map(a=>{
    const nascFmt = a.nascimento || '—';
    const idadeFmt = (a.idade===''||a.idade===null||a.idade===undefined) ? '—' : a.idade+' anos';
    const statusTxt = a.status==='ativo' ? '<span class="status-pill status-andamento">Ativo</span>'

      ? `<span class="mes-cell pago" style="cursor:default;">PAGA</span>`
      : `<span class="mes-cell pendente" data-toggle-matricula="${a.id}" title="Toque para marcar como paga">${fmtBRL(a.matricula.valor)}</span>`;
    const qtdDocs = (a.documentos||[]).length;
    const docsTxt = qtdDocs > 0
      ? `<button class="icon-btn" data-ver-docs="${a.id}" title="Ver documentos anexados">📎 ${qtdDocs}</button>`
      : '<span class="resp-cell">—</span>';
    const enviadaEm = a.origem==='link' && a.dataEnvioInscricao ? `<div class="sub-linha">pelo link · ${a.dataEnvioInscricao.split('-').reverse().join('/')}</div>` : '';
    return `<tr class="${a.status==='inscricao_pendente' ? 'linha-pendente' : ''}">
      <td><strong ${a.status==='inscricao_pendente' ? `class="name-cell" data-aprovar="${a.id}"` : ''}>${a.nome}</strong>${enviadaEm}</td>
      <td><span class="cat-badge">${a.categoria}</span></td>
      <td class="resp-cell">${nascFmt}</td>

      <td>${docsTxt}</td>
      <td>${matriculaTxt}</td>
      <td>${statusTxt}</td>
      <td>
        <div class="row-actions">
          ${a.status==='inscricao_pendente' ? `<button class="btn btn-gold btn-sm" data-aprovar="${a.id}" title="Revisar e aprovar a inscrição">Revisar</button>` : ''}
          <button class="icon-btn" data-edit="${a.id}" title="Editar">✏️</button>

function viewCalendario(){
  const hoje = new Date().toISOString().slice(0,10);
  let lista = [...(DB.eventos||[])];
  lista.sort((a,b)=> (a.data||'').localeCompare(b.data||''));
  const proximos = lista.filter(e=> e.data >= hoje);
  const passados = lista.filter(e=> e.data < hoje).reverse();

  const MES_NOMES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  function cardEvento(e, passado){
    const [y,m,d] = (e.data||'0000-01-01').split('-');
    const mesNome = MES_NOMES[parseInt(m,10)-1] || '';
    return `<div class="evento-card ${passado?'evento-passado':''}">
      <div class="evento-data"><div class="dia">${d}</div><div class="mes">${mesNome}</div></div>
      <div class="evento-body">
        <div class="tit">${e.titulo || 'Jogo'} ${e.categoria ? `<span class="cat-badge">${e.categoria}</span>` : ''}</div>
        <div class="meta">
          ${e.horario ? `<span>🕐 ${e.horario}</span>` : ''}
          ${e.local ? `<span>📍 ${e.local}</span>` : ''}
          ${e.adversario ? `<span>⚔️ vs ${e.adversario}</span>` : ''}
        </div>
        ${e.obs ? `<div class="obs">${e.obs}</div>` : ''}
      </div>
      <div class="row-actions">
        <button class="icon-btn" data-editar-evento="${e.id}" title="Editar">✏️</button>
        <button class="icon-btn danger" data-remover-evento="${e.id}" title="Excluir">🗑️</button>
      </div>
    </div>`;
  }

  return `
    <h1 class="view-title">Calendário</h1>
    <p class="view-sub">Jogos, competições e eventos da escola.</p>
    <div class="toolbar">
      <button class="btn btn-gold" id="btn-novo-evento">+ Novo evento</button>
    </div>
    <div class="card" style="margin-bottom:20px;">
      <strong style="font-size:14px;color:var(--gold-light);">📅 Próximos eventos</strong>
      <div style="margin-top:12px;">
        ${proximos.map(e=>cardEvento(e,false)).join('') || '<div class="empty-state">Nenhum evento futuro cadastrado.</div>'}
      </div>
    </div>
    ${passados.length ? `<div class="card">
      <strong style="font-size:14px;color:var(--muted);">🕓 Eventos anteriores</strong>
      <div style="margin-top:12px;">
        ${passados.map(e=>cardEvento(e,true)).join('')}
      </div>
    </div>` : ''}
  `;
}

/* ============================================================
   VIEW: ESCALAÇÃO PARA O TREINO
============================================================ */
const ESCALACAO_HORARIOS = [
  {key:'slot1', label:'09:00 às 10:00', ic:'🕘'},
  {key:'slot2', label:'10:00 às 11:00', ic:'🕙'},
  {key:'slot3', label:'11:00 ao meio-dia', ic:'🕚'},
];
function categoriasComAtivos(){
  return CATEGORIAS.filter(cat=>ativos().some(a=>a.categoria===cat));
}
function atletasEscaladosNoSlot(slotKey){
  const idsNoSlot = (DB.escalacao && DB.escalacao[slotKey]) || [];
  const grupos = categoriasComAtivos().map(cat=>({
    categoria: cat,
    nomes: ativos().filter(a=>a.categoria===cat && idsNoSlot.includes(a.id)).sort((a,b)=>a.nome.localeCompare(b.nome)).map(a=>a.nome)
  })).filter(g=>g.nomes.length);
  return grupos;
}
function textoEscalacaoSlot(slotKey){
  const h = ESCALACAO_HORARIOS.find(x=>x.key===slotKey);
  const grupos = atletasEscaladosNoSlot(slotKey);
  const totalAtletas = grupos.reduce((s,g)=>s+g.nomes.length, 0);

  let txt = '⚽ *ALLEANZA ESCOLA DE FUTSAL*\n';
  txt += '📋 *Escalação do treino*\n\n';
  txt += '🕐 *'+(h?h.label:slotKey)+'*\n\n';
  if(!grupos.length){
    txt += 'Nenhum sub escalado para este horário ainda.\n';
  } else {
    grupos.forEach(g=>{
      txt += '*'+g.categoria+'* ('+g.nomes.length+')\n';
      if(g.nomes.length){
        g.nomes.forEach((n,i)=>{ txt += (i+1)+'. '+n+'\n'; });
      } else {
        txt += '_nenhum atleta ativo nessa categoria_\n';
      }
      txt += '\n';
    });
    txt += 'Total: '+totalAtletas+' atleta(s) neste horário.\n';
  }
  txt += '\nChegar com 10 a 15 min de antecedência, uniforme completo. 🏆';
  return txt;
}
function linkEscalacaoSlot(slotKey){
  return 'https://api.whatsapp.com/send?text='+encodeURIComponent(textoEscalacaoSlot(slotKey));
}
function viewEscalacao(){
  if(!DB.escalacao) DB.escalacao = {slot1:[], slot2:[], slot3:[]};
  ESCALACAO_HORARIOS.forEach(h=>{ if(!DB.escalacao[h.key]) DB.escalacao[h.key] = []; });

  const cats = categoriasComAtivos();

  const blocos = ESCALACAO_HORARIOS.map(h=>{
    const idsNoSlot = DB.escalacao[h.key] || [];

    const gruposHtml = cats.map(cat=>{
      const atletasCat = ativos().filter(a=>a.categoria===cat).sort((a,b)=>a.nome.localeCompare(b.nome));
      const selecionadosCat = atletasCat.filter(a=>idsNoSlot.includes(a.id)).length;
      const todosMarcados = atletasCat.length>0 && selecionadosCat===atletasCat.length;
      const itens = atletasCat.map(a=>{
        const marcado = idsNoSlot.includes(a.id);
        return `<label class="chip-check ${marcado?'ativo':''}" style="width:100%;justify-content:flex-start;">
          <input type="checkbox" data-escala-atleta="${h.key}|${a.id}" ${marcado?'checked':''}>
          ${a.nome}
        </label>`;
      }).join('');
      return `<div class="escala-sub-group">
        <div class="escala-sub-title" style="justify-content:space-between;">
          <span>${cat} <span class="escala-sub-count">${selecionadosCat}/${atletasCat.length}</span></span>
          <span data-escala-cat-all="${h.key}|${cat}" style="font-size:10.5px;font-weight:700;color:var(--gold-light);text-decoration:underline;cursor:pointer;white-space:nowrap;">${todosMarcados?'limpar':'marcar todos'}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px;">
          ${itens || `<div class="empty-state" style="padding:6px 0;">Nenhum atleta ativo nessa categoria.</div>`}
        </div>
      </div>`;
    }).join('');

    return `
      <div class="card" style="margin-bottom:16px;">
        <div class="escala-header">
          <span class="escala-ic">${h.ic}</span>
          <div style="flex:1;min-width:0;">
            <div class="escala-hora">${h.label}</div>
            <div class="view-sub" style="margin:0;">${idsNoSlot.length} atleta(s) escalado(s) — dá pra dividir alunos da mesma categoria entre horários diferentes</div>
          </div>
          <button class="btn btn-gold btn-sm" data-exportar-escala="${h.key}" title="Exportar para o WhatsApp">📲 Exportar</button>
        </div>
        ${gruposHtml
          ? `<div class="escala-body">${gruposHtml}</div>`
          : `<div class="empty-state">Nenhum atleta ativo cadastrado.</div>`}
      </div>
    `;
  }).join('');

  return `
    <h1 class="view-title">Escalação para o Treino</h1>
    <p class="view-sub">Marque quais atletas treinam em cada horário — dá pra escalar só alguns alunos de uma categoria num horário e o resto em outro. Use "marcar todos" para escalar a categoria inteira de uma vez.</p>
    ${blocos}
  `;
}
